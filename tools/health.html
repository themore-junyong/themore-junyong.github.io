:root{
  --bg:#f6f6f6; --ink:#333; --soft:#6f7480; --card:#fff; --line:#e2e3e8; --field:#fbfbfc;
  --blue:#4e6bf1; --blue-ink:#fff; --blue-soft:#e9edfe; --ok:#2e8b4c; --bad:#c8432f; --mid:#c98a00;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642; --field:#1a1d23;
  --blue:#7c93ff; --blue-ink:#10121a; --blue-soft:#262d4a; --ok:#5cc47c; --bad:#ff7a63; --mid:#f0b93a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642; --field:#1a1d23;

body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 120px;display:flex;flex-direction:column;gap:16px}

p{margin:0} .soft{color:var(--soft)}
button{font:inherit;color:inherit;cursor:pointer}

.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.why{background:var(--blue-soft);border-radius:4px;padding:12px 14px;font-size:.95rem}
.why b{color:var(--blue)}
.warn{background:#fff4e0;color:#7a4300;border-radius:4px;padding:12px 14px;font-size:.95rem}
.note{font-size:.88rem;color:var(--soft)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:10px 16px;font-weight:700}
.btn.pri{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.steps i{height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--blue)}
.item{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0;padding-bottom:0}
.item p{font-weight:700}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{border:1px solid var(--line);background:var(--field);border-radius:4px;padding:9px 12px;text-align:left}
.opts button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--field);padding:10px 4px}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink);font-weight:700}
.total{font-size:2.6rem;font-weight:900;line-height:1}
.radar{width:100%;max-width:360px;margin:0 auto;display:block}
.radar text{font-size:11px;fill:var(--ink);font-family:var(--f)}
.area{display:grid;grid-template-columns:8.6em 1fr 4.2em;gap:8px;align-items:center;font-size:.95rem}
.area .tr{height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.area .fl{display:block;height:100%;border-radius:7px}
.area .g{font-weight:700;text-align:right;font-size:.85rem}
.act{display:flex;flex-direction:column;gap:8px}
.act label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--field)}
.act input{width:20px;height:20px;margin-top:2px;flex:none}
.fact{border-left:4px solid var(--blue);padding:8px 12px;background:var(--field);font-size:.92rem}
table.wk{border-collapse:collapse;width:100%;font-size:.9rem}
table.wk th,table.wk td{border:1px solid var(--line);padding:6px 4px;text-align:center}
table.wk td:first-child{text-align:left;width:42%;font-size:.85rem;line-height:1.35}
table.wk th:not(:first-child),table.wk td:not(:first-child){width:8%;padding:6px 0}
table.wk button{border:0;background:none;font-size:1.2rem;width:100%}
.barb{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.barb .in{max-width:760px;margin:0 auto;display:flex;gap:8px;justify-content:space-between}
.barb .btn{flex:1;max-width:220px;padding:12px}
@media print{.barb,.noprint{display:none!important}body{background:#fff}}
</style>

var app=document.getElementById('app');
function head(){return '<div class="top"><div class="brand"><small>위듀케이션 · 건강 생활습관 점검</small></div><a href="./">← 도구 모음</a></div>'}
function score(){return A.map(function(ar){var s=0;ar.items.forEach(function(_,i){s+=S.a[ar.k+i]||0});return Math.round(s/(ar.items.length*3)*100)})}
function grade(v){return v>=75?['좋음','var(--ok)']:v>=50?['보통','var(--mid)']:['주의','var(--bad)']}
function radar(sc){
  var c=180,r=120,n=sc.length,pt=function(i,v){var a=-Math.PI/2+i*2*Math.PI/n;return [c+Math.cos(a)*r*v,c+Math.sin(a)*r*v]};
  var g='';[.25,.5,.75,1].forEach(function(f){g+='<polygon points="'+sc.map(function(_,i){return pt(i,f).join(',')}).join(' ')+'" fill="none" stroke="var(--line)"/>'});
  sc.forEach(function(_,i){var p=pt(i,1);g+='<line x1="'+c+'" y1="'+c+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="var(--line)"/>';var t=pt(i,1.2);g+='<text x="'+t[0]+'" y="'+t[1]+'" text-anchor="middle" dominant-baseline="middle">'+A[i].e+' '+A[i].n+'</text>'});
  g+='<polygon points="'+sc.map(function(v,i){return pt(i,Math.max(.04,v/100)).join(',')}).join(' ')+'" fill="color-mix(in srgb,var(--blue) 25%,transparent)" stroke="var(--blue)" stroke-width="2"/>';
  return '<svg class="radar" viewBox="0 0 360 360" role="img" aria-label="영역별 건강 점수">'+g+'</svg>';
}
function start(){
  return head()+'<div class="card"><div style="font-size:2.4rem">🩺</div><h1>건강 생활습관 점검</h1><p>수면·운동·식사·마음·스마트폰·자세·담배와 술, <b>7가지 영역 33문항</b>으로 내 생활습관을 점검해요. 결과로 내 약점 영역과 <b>이번 주 실천 약속</b>을 만들어요.</p>'+
   '<div class="why"><b>약 5분</b> · 최근 2주 동안의 평소 모습으로 답하세요. 답은 이 휴대폰에만 저장돼요.</div>'+
   '<div class="card" style="padding:12px"><b>교대근무(밤샘 근무)를 하거나 할 예정인가요?</b><div class="seg">'+[['예',true],['아니요',false]].map(function(o){return '<button data-shift="'+o[1]+'" aria-pressed="'+(S.shift===o[1])+'">'+o[0]+'</button>'}).join('')+'</div></div>'+
   '<button class="btn pri" data-go="0"'+(S.shift==null?' disabled':'')+'>시작하기</button></div>';
}
function area(i){
  var ar=A[i],h=head()+'<div class="steps">'+A.map(function(_,j){return '<i class="'+(j<=i?'on':'')+'"></i>'}).join('')+'</div><p class="soft">'+(i+1)+' / 7 영역</p><div class="card"><h2>'+ar.e+' '+ar.n+'</h2>';
  ar.items.forEach(function(it,j){var v=S.a[ar.k+j];h+='<div class="item"><p>'+(j+1)+'. '+it[0]+'</p><div class="opts">'+it[1].map(function(o){return '<button data-q="'+ar.k+j+'" data-v="'+o[1]+'" aria-pressed="'+(v===o[1])+'">'+o[0]+'</button>'}).join('')+'</div></div>'});
  return h+'</div>';
}
function result(){
  var sc=score(),tot=Math.round(sc.reduce(function(a,b){return a+b},0)/sc.length),g=grade(tot);
  var ord=sc.map(function(v,i){return i}).sort(function(a,b){return sc[a]-sc[b]}),weak=ord.slice(0,2);
  var h=head()+'<div class="card"><span class="soft">나의 건강 생활습관 점수</span><div><span class="total" style="color:'+g[1]+'">'+tot+'</span><span class="soft"> / 100 · '+g[0]+'</span></div>'+radar(sc)+
    '<div style="display:flex;flex-direction:column;gap:8px">'+A.map(function(ar,i){var gg=grade(sc[i]);return '<div class="area"><span>'+ar.e+' '+ar.n+'</span><span class="tr"><span class="fl" style="width:'+Math.max(3,sc[i])+'%;background:'+gg[1]+'"></span></span><span class="g" style="color:'+gg[1]+'">'+sc[i]+' '+gg[0]+'</span></div>'}).join('')+'</div></div>';
  if(S.a.mind1===0||S.a.mind1===1)h+='<div class="warn"><b>💛 마음이 많이 지쳐 있는 것 같아요.</b> 기분이 가라앉는 날이 2주 넘게 이어지면 혼자 버티지 말고 이야기해 주세요. 선생님·보건실·가족, 또는 <b>청소년상담 1388</b>, <b>자살예방 상담전화 109</b>(24시간)로 연락할 수 있어요.</div>';
  h+='<div class="card"><h2>🎯 먼저 바꿀 곳: '+weak.map(function(i){return A[i].e+' '+A[i].n}).join(', ')+'</h2><p class="soft">점수가 가장 낮은 두 영역이에요. 아래에서 이번 주에 해 볼 행동을 <b>최대 3개</b> 골라 약속해요.</p>';
  weak.forEach(function(i){var c=CARD[A[i].k];h+='<h3>'+A[i].e+' '+A[i].n+' ('+sc[i]+'점)</h3><p class="fact">'+c.fact+'</p><div class="act">'+c.acts.map(function(t){return '<label><input type="checkbox" data-pick="'+t+'"'+(S.pick.indexOf(t)>=0?' checked':'')+'><span>'+t+'</span></label>'}).join('')+'</div>'});
  h+='</div>';
  if(S.shift)h+='<div class="card">'+SHIFT+'</div>';
  if(S.pick.length){
    var D=['월','화','수','목','금','토','일'];
    h+='<div class="card"><h2>📅 이번 주 실천 약속</h2><p class="soft">지킨 날을 눌러 ✅로 바꾸세요. 7일 중 5일이면 성공!</p><table class="wk"><tr><th>약속</th>'+D.map(function(d){return '<th>'+d+'</th>'}).join('')+'</tr>'+
      S.pick.map(function(t,i){return '<tr><td>'+t+'</td>'+D.map(function(_,j){var k=i+'_'+j;return '<td><button data-wk="'+k+'">'+(S.wk[k]?'✅':'⬜')+'</button></td>'}).join('')+'</tr>'}).join('')+'</table></div>';
  }
  h+='<details class="card"><summary><b>다른 영역 실천 방법도 보기</b></summary>'+ord.slice(2).map(function(i){var c=CARD[A[i].k];return '<h3>'+A[i].e+' '+A[i].n+' ('+sc[i]+'점)</h3><p class="fact">'+c.fact+'</p><ul style="margin:0;padding-left:20px">'+c.acts.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul>'}).join('')+'</details>';
  h+='<p class="note">이 점검은 생활습관을 돌아보는 교육용 도구예요. 질병을 진단하지 않아요. 몸이나 마음이 계속 불편하면 병원·보건소·상담 기관을 찾아 주세요.</p>'+
   '<div class="btns noprint"><button class="btn" data-go="again">다시 점검하기</button><button class="btn" data-go="print">인쇄·PDF</button></div>';
  return h;
}
function render(){
  app.innerHTML=S.step===-1?start():S.step==='res'?result():area(S.step);
  var b=document.getElementById('barb');if(b)b.remove();
  if(typeof S.step==='number'&&S.step>=0){
    var ar=A[S.step],full=ar.items.every(function(_,j){return S.a[ar.k+j]!=null});
    b=document.createElement('div');b.className='barb';b.id='barb';
    b.innerHTML='<div class="in"><button class="btn" data-go="prev">이전</button><button class="btn pri" data-go="next"'+(full?'':' disabled')+'>'+(S.step===A.length-1?'결과 보기':'다음 영역')+'</button></div>';
    document.body.appendChild(b);
  }
}
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;var d=b.dataset;
  if(d.shift!=null){S.shift=d.shift==='true';save();render();return}
  if(d.go==='0'){S.step=0}
  else if(d.go==='prev'){S.step=S.step===0?-1:S.step-1}
  else if(d.go==='next'){S.step=S.step===A.length-1?'res':S.step+1}
  else if(d.go==='again'){S={step:-1,shift:null,a:{},pick:[],wk:{}}}
  else if(d.go==='print'){window.print();return}
  else if(d.q){S.a[d.q]=+d.v;save();b.parentNode.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});
    var ar=A[S.step],full=ar.items.every(function(_,j){return S.a[ar.k+j]!=null}),nx=document.querySelector('#barb [data-go="next"]');if(nx)nx.disabled=!full;return}
  else if(d.wk){S.wk[d.wk]=!S.wk[d.wk];save();b.textContent=S.wk[d.wk]?'✅':'⬜';return}
  else return;
  save();render();window.scrollTo(0,0);
});
document.addEventListener('change',function(e){
  var t=e.target.dataset.pick;if(t==null)return;
  var i=S.pick.indexOf(t);
  if(e.target.checked){if(S.pick.length>=3){e.target.checked=false;alert('약속은 3개까지만 골라요. 적을수록 잘 지켜요!');return}S.pick.push(t)}else if(i>=0){S.pick.splice(i,1);S.wk={}}
  save();var y=window.scrollY;render();window.scrollTo(0,y);
});
render();
})();
</script>
</body></html>
