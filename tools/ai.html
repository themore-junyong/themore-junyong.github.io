<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 수업 도구</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="font.css"><style>
/* 여섯 활동: #plan~#plan7 요청문 만들기(기획하는 법) · #prompt 프롬프트 연습장(AI) · #lie AI 거짓말 찾기 · #who AI vs 사람 글 · #ethics AI 윤리 딜레마 · #future 내 직무 미래 지도(AI) */
:root{
  --bg:#f6f6f6; --ink:#333; --soft:#6f7480; --card:#fff; --line:#e2e3e8; --field:#fbfbfc;
  --blue:#4e6bf1; --blue-ink:#fff; --blue-soft:#e9edfe; --ok:#2e8b4c; --bad:#c8432f; --mid:#c98a00;
  --f:"SCDream","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642; --field:#1a1d23;
  --blue:#7c93ff; --blue-ink:#10121a; --blue-soft:#262d4a; --ok:#5cc47c; --bad:#ff7a63; --mid:#f0b93a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642; --field:#1a1d23;
  --blue:#7c93ff; --blue-ink:#10121a; --blue-soft:#262d4a; --ok:#5cc47c; --bad:#ff7a63; --mid:#f0b93a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 60px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.75rem;font-weight:900} h2{font-size:1.35rem;font-weight:900} h3{font-size:1.05rem;font-weight:700}
p{margin:0} .soft{color:var(--soft)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top a{color:var(--blue);font-weight:700;text-decoration:none}
.brand small{letter-spacing:.12em;font-weight:700;color:var(--blue);font-size:.78rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.why{background:var(--blue-soft);border-radius:4px;padding:12px 14px;font-size:.95rem}
.why b{color:var(--blue)}
.note{font-size:.88rem;color:var(--soft)} .note.bad{color:var(--bad)} .note.ok{color:var(--ok)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:10px 16px;font-weight:700;color:var(--ink);text-decoration:none;display:inline-block}
.btn.pri{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-weight:700}
.f input,.f textarea{border:1px solid var(--line);background:var(--field);border-radius:4px;padding:10px 12px}
.f textarea{min-height:110px;resize:vertical}
.list{display:flex;flex-direction:column;gap:10px}
a.g{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:4px;padding:14px 16px;color:var(--ink);text-decoration:none}
a.g b{font-size:1.1rem} a.g span{color:var(--soft);font-size:.92rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.out{white-space:pre-wrap;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:12px;font-size:.95rem;line-height:1.7;min-height:60px}
.tag{display:inline-block;font-weight:900;border-radius:4px;padding:2px 8px;font-size:.85rem}
.tag.a{background:#fde3e0;color:#9a2a1c} .tag.b{background:#dff3e6;color:#1d6b3a}
.sent{display:inline;border-radius:3px;padding:2px 2px;cursor:pointer;line-height:2}
.sent[aria-pressed="true"]{background:#ffe08a;color:#333}
.sent.false{text-decoration:underline wavy var(--bad);text-underline-offset:4px}
.sent.hit{background:color-mix(in srgb,var(--ok) 25%,transparent)}
.sent.miss{background:color-mix(in srgb,var(--bad) 22%,transparent)}
.aibox{border:1px solid var(--line);border-radius:6px;padding:14px;background:var(--field)}
.aibox .who{font-size:.8rem;color:var(--soft);font-weight:700;margin-bottom:6px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{border:2px solid var(--line);background:var(--field);border-radius:6px;padding:12px;text-align:left;line-height:1.7;font-size:.95rem}
.pick button.right{border-color:var(--ok)} .pick button.wrong{border-color:var(--bad)}
@media (max-width:640px){.pick{grid-template-columns:1fr}}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vote button{border:2px solid var(--line);background:var(--field);border-radius:6px;padding:14px;font-weight:900;font-size:1.05rem}
.vote button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.side{border-left:4px solid var(--blue);padding:8px 12px;background:var(--field);font-size:.95rem}
/* 강사 미리보기: 반 통계 */
.stat{border:2px solid var(--blue);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.stat h3{margin:0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.stat h3 span{color:var(--soft);font-size:.9rem;font-weight:700}
.sb{display:grid;grid-template-columns:minmax(80px,30%) 1fr 92px;gap:8px;align-items:center;font-size:.92rem}
.sb .tr{height:22px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}.sb .tr i{display:block;height:100%}
.sb .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.sq{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.qno{color:var(--blue);font-weight:700;font-size:.9rem}
.big{font-size:2.2rem;font-weight:900;text-align:center}
.vid{width:100%;max-width:320px;aspect-ratio:9/16;margin:0 auto;border-radius:6px;overflow:hidden;background:#000}.vid iframe{width:100%;height:100%;border:0;display:block}
/* 요청문 만들기(#plan) */
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.steps a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:4px;background:var(--card);border:1px solid var(--line);color:var(--soft);text-decoration:none;font-size:.78rem;text-align:center;line-height:1.3}
.steps a b{font-size:1rem;color:var(--ink)}
.steps a[aria-current="step"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}.steps a[aria-current="step"] b{color:var(--blue-ink)}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:640px){.tgrid{grid-template-columns:1fr 1fr}}
.tp{border:2px solid var(--line);background:var(--card);border-radius:6px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;line-height:1.35;font-size:.92rem}
.tp .te{font-size:1.7rem}.tp[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:2px solid var(--line);background:var(--field);border-radius:999px;padding:6px 14px;font-weight:700}
.chips button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.ck{display:flex;gap:8px;align-items:flex-start;line-height:1.5}.ck input{width:20px;height:20px;margin-top:2px;flex:none}
.plist{display:flex;flex-direction:column;gap:8px}.plist details{border:1px solid var(--line);border-radius:4px;padding:8px 12px;background:var(--field)}
.plist summary{cursor:pointer;font-weight:700}
</style>
</head><body>
<script src="room.js?v=235" data-guard></script>
<div class="wrap" id="app"></div>
<script type="module" src="ai.js"></script>
<script>
(function(){
var app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var AI=window.TM_AI||null, CODE={code:''};
try{CODE=JSON.parse(localStorage.getItem('tm-code')||'null')||CODE}catch(e){}
var qc=(new URLSearchParams(location.search).get('c')||'').trim().toUpperCase();if(qc&&qc!==CODE.code)CODE={code:qc};
function saveCode(){try{localStorage.setItem('tm-code',JSON.stringify(CODE))}catch(e){}}
window.addEventListener('tm-ai',function(){AI=window.TM_AI;if(CODE.code&&!CODE.ok)check()});
function check(){AI.check(CODE.code).then(function(r){CODE.name=r.name;CODE.ok=1;delete CODE.err;saveCode();render()},function(e){CODE.ok=0;CODE.err=e.message;render()})}
if(AI&&CODE.code&&!CODE.ok)check();
var V=(location.hash||'').slice(1)||'home', busy=false, note='';
window.addEventListener('hashchange',function(){V=(location.hash||'').slice(1)||'home';note='';render();window.scrollTo(0,0)});
var st={};try{st=JSON.parse(localStorage.getItem('ai-v1')||'{}')}catch(e){}
function save(){try{localStorage.setItem('ai-v1',JSON.stringify(st))}catch(e){}push()}
/* 학생: 거짓말 찾기·AI vs 사람·윤리 딜레마에서 고른 것을 선생님 화면으로(조용히, 바뀔 때마다 1초 모아서). 강사 미리보기 탭은 반 통계를 봄 */
var pushT=null,pushed={};
function push(){if(!window.TM_ROOM||TM_ROOM.teach||!TM_ROOM.get())return;clearTimeout(pushT);pushT=setTimeout(function(){
  var out=[];
  if(st.lie){var L=st.lie,d={};Object.keys(L.done||{}).forEach(function(i){var s=L.sel[i]||{};d[i]=Object.keys(s).filter(function(j){return s[j]}).map(Number)});
    if(Object.keys(d).length)out.push(['ai-lie','AI 거짓말 찾기 '+L.score+'점',{d:d,s:L.score}])}
  if(st.who&&Object.keys(st.who.pick||{}).length){var ok=0,n=0;Object.keys(st.who.pick).forEach(function(i){n++;if(st.who.pick[i]==='ai')ok++});out.push(['ai-who','AI vs 사람 '+ok+'/'+n,{p:st.who.pick}])}
  if(st.eth&&Object.keys(st.eth.v||{}).length)out.push(['ai-eth','AI 윤리 딜레마 '+Object.keys(st.eth.v).length+'개 투표',{v:st.eth.v}]);
  if(st.plan&&st.plan.what&&st.plan.what.trim())out.push(['ai-plan','요청문 · '+st.plan.what.trim().slice(0,60),{k:st.plan.k,t:st.plan.what.trim().slice(0,120),r:planOut().slice(0,1500)}]);
  out.forEach(function(o){var b=JSON.stringify(o[2]);if(pushed[o[0]]===b)return;pushed[o[0]]=b;TM_ROOM.send(o[0],o[1],b,true)});
},1000)}
var SW=null,STM=[];
function statOn(){return !!(window.TM_ROOM&&TM_ROOM.teach&&TM_ROOM.teachWork)}
if(statOn())TM_ROOM.teachWork(['ai-lie','ai-who','ai-eth','ai-plan'],function(A,T){if(T){STM=T}else SW=A.map(function(x){var b={};try{b=JSON.parse(x.body)}catch(e){}return {tool:x.tool,nick:x.nick,team:x.team||'',b:b}});
  var y=window.scrollY;render();window.scrollTo(0,y)});
function sbar(lab,n,tot,c){var p=tot?Math.round(n/tot*100):0;return '<div class="sb"><span>'+lab+'</span><span class="tr"><i style="width:'+p+'%;background:'+(c||'var(--blue)')+'"></i></span><span class="n">'+n+'명 '+p+'%</span></div>'}
function tlist(R){var t=STM.slice();R.forEach(function(r){var k=r.team&&t.indexOf(r.team)>=0?r.team:'조 없음';if(t.indexOf(k)<0)t.push(k)});return t}
function tof(r){return r.team&&STM.indexOf(r.team)>=0?r.team:'조 없음'}
function statBox(kind){if(!statOn())return '';var R=(SW||[]).filter(function(x){return x.tool===kind}),h;
  if(!SW)return '<div class="stat"><h3>📊 반 통계 <span>불러오는 중…</span></h3></div>';
  h='<div class="stat"><h3>📊 반 통계 (선생님만 보여요) <span>참여 '+R.length+'명</span></h3>';
  if(!R.length)return h+'<p class="note">학생이 고르면 여기에 바로 모여요.</p></div>';
  if(kind==='ai-plan'){var TP=tlist(R);
    h+=TP.map(function(t){var M=R.filter(function(r){return tof(r)===t});if(!M.length)return '';return '<div class="sq"><b>'+esc(t)+' ('+M.length+'명)</b><div class="plist">'+M.map(function(r){return '<details><summary>'+esc(r.nick)+' · '+esc(r.b.t||'')+'</summary><div class="out">'+esc(r.b.r||'')+'</div></details>'}).join('')+'</div></div>'}).join('');
    return h+'<p class="note">요청문을 눌러 펼쳐 보세요. 빔에 띄워 "이 요청문에서 빠진 것은?"을 함께 찾아보면 좋아요.</p></div>'}
  if(kind==='ai-lie'){var T=tlist(R);
    h+='<div class="sq"><b>조별 평균 점수</b>'+T.map(function(t){var M=R.filter(function(r){return tof(r)===t});if(!M.length)return '';var a=M.reduce(function(s,r){return s+(+r.b.s||0)},0)/M.length;return '<div class="sb"><span>'+esc(t)+'</span><span class="tr"><i style="width:'+Math.max(0,Math.min(100,a/3*100))+'%;background:var(--blue)"></i></span><span class="n">'+a.toFixed(1)+'점</span></div>'}).join('')+'</div>';
    LIE.forEach(function(Q,i){var M=R.filter(function(r){return r.b.d&&r.b.d[i]});if(!M.length)return;
      h+='<div class="sq"><b>'+(i+1)+'. '+esc(Q.t)+'</b> <span class="note">확인한 학생 '+M.length+'명 · 거짓 문장을 찾은 비율</span>'+Q.s.map(function(x,j){if(!x[1])return '';var n=M.filter(function(r){return r.b.d[i].indexOf(j)>=0}).length;return sbar(esc(x[0].slice(0,26))+'…',n,M.length,'var(--ok)')}).join('')+
        (function(){var w=Q.s.map(function(x,j){return [j,x]}).filter(function(z){return !z[1][1]}).map(function(z){return [z[1][0],M.filter(function(r){return r.b.d[i].indexOf(z[0])>=0}).length]}).filter(function(z){return z[1]}).sort(function(a,b){return b[1]-a[1]})[0];return w?'<p class="note">참인데 거짓으로 고른 문장 1위: "'+esc(w[0].slice(0,30))+'…" ('+w[1]+'명)</p>':''})()+'</div>'});
  }else if(kind==='ai-who'){var T2=tlist(R);
    h+='<div class="sq"><b>조별 정답률</b>'+T2.map(function(t){var M=R.filter(function(r){return tof(r)===t}),ok=0,n=0;M.forEach(function(r){Object.keys(r.b.p||{}).forEach(function(i){n++;if(r.b.p[i]==='ai')ok++})});return n?sbar(esc(t)+' ('+M.length+'명)',ok,n).replace(/>\d+명 /,'>'+ok+'/'+n+' '):''}).join('')+'</div>';
    WHO.forEach(function(Q,i){var M=R.filter(function(r){return r.b.p&&r.b.p[i]});if(!M.length)return;var ok=M.filter(function(r){return r.b.p[i]==='ai'}).length;
      h+='<div class="sq">'+sbar((i+1)+'. '+esc(Q.q),ok,M.length,ok/M.length>=.5?'var(--ok)':'var(--bad)')+'</div>'});
    h+='<p class="note">막대 = AI 글을 맞힌 학생 비율이에요.</p>';
  }else{var T3=tlist(R);
    ETH.forEach(function(Q,i){var M=R.filter(function(r){return r.b.v&&r.b.v[i]});if(!M.length)return;var y=M.filter(function(r){return r.b.v[i]==='y'}).length;
      h+='<div class="sq"><b>'+(i+1)+'. '+esc(Q.q)+'</b>'+sbar('👍 된다',y,M.length,'var(--ok)')+sbar('👎 안 된다',M.length-y,M.length,'var(--bad)')+
        '<span class="note">'+T3.map(function(t){var K=M.filter(function(r){return tof(r)===t});if(!K.length)return '';var yy=K.filter(function(r){return r.b.v[i]==='y'}).length;return esc(t)+' 👍'+yy+' 👎'+(K.length-yy)}).filter(Boolean).join(' · ')+'</span></div>'});
  }
  return h+'</div>'}

function head(t){return '<div class="top"><div class="brand"><small>위듀케이션 · AI 수업 도구</small></div><a href="'+(V==='home'?'./':'#')+'">← '+(V==='home'?'도구 모음':'AI 수업 도구')+'</a></div>'+(t?'<h1>'+t+'</h1>':'')}
function codeCard(){
  if(CODE.ok)return '<p class="note ok">✔ 초대코드 '+esc(CODE.code)+(CODE.name?' · '+esc(CODE.name):'')+' <button class="btn" data-a="recode" style="padding:2px 8px;font-size:.8rem">바꾸기</button></p>';
  return '<div class="card"><h3>초대코드</h3><p class="soft">AI를 쓰는 활동이라 선생님이 알려 준 코드가 필요해요.</p><div class="btns"><input id="code" value="'+esc(CODE.code||'')+'" placeholder="예: OSAN-1106" style="flex:1;min-width:0;border:1px solid var(--line);background:var(--field);border-radius:4px;padding:10px 12px;text-transform:uppercase"><button class="btn pri" data-a="code">확인</button></div>'+(CODE.err?'<p class="note bad">'+esc(CODE.err)+'</p>':'')+(!AI?'<p class="note">연결 준비 중…</p>':'')+'</div>';
}
function lab(p){busy=true;note='';render();return AI.lab(Object.assign({code:CODE.code},p)).finally(function(){busy=false})}

/* ---------- 홈 ---------- */
function home(){
  return head('AI 수업 도구')+'<p class="soft">AI를 "잘 쓰는 사람"이 되기 위한 여섯 가지 활동이에요. ⚡표시는 AI가 실제로 답해요(초대코드 필요).</p><div class="list">'+
   [['plan','📝 요청문 만들기 · 기획하는 법','무엇을·누구에게·어떤 화면으로·완성 기준 6단계 → AI에게 줄 요청문 완성 + 고치기 요청문'],
    ['prompt','⚡ 프롬프트 연습장','대충 쓴 부탁 vs 잘 쓴 부탁, AI 답을 나란히 비교 + 프롬프트 채점'],
    ['lie','🕵️ AI 거짓말 찾기','AI 답변 속 그럴듯한 거짓 문장을 찾아라 (환각 찾기)'],
    ['who','🤖 AI가 쓴 글 vs 사람이 쓴 글','어느 쪽이 AI일까? AI 글의 특징 알아보기'],
    ['ethics','⚖️ AI 윤리 딜레마','"AI로 자소서를 써도 될까?" 찬반 투표와 생각해 볼 점'],
    ['future','⚡ 내 직무 미래 지도','내 직무에서 AI가 대신할 일·사람이 할 일·키울 역량']].map(function(x){return '<a class="g" href="#'+x[0]+'"><b>'+x[1]+'</b><span>'+x[2]+'</span></a>'}).join('')+'</div>'+
   '<div class="why"><b>선생님 팁:</b> 윤리 딜레마 질문은 <a href="live.html?host">실시간 마인드맵</a>에 바로 넣어 반 전체 투표로 할 수 있어요(윤리 딜레마 화면 맨 아래 버튼).</div>';
}

/* ---------- ① 프롬프트 연습장 ---------- */
var PEX=[

function planSet(id,v){var p=PL(),m;
  if(id==='pf-text'){p.text=v;p.ed=1;return}
  if((m=id.match(/^pf-s(\d)([ab])$/))){p.s[+m[1]][m[2]==='a'?0:1]=v;return}
  if((m=id.match(/^pf-d(\d)$/))){p.d[+m[1]]=v;return}
  if((m=id.match(/^pf-f([wng])(\d)$/))){p.fix[+m[2]][m[1]]=v;return}
  var k=id.slice(3);if(['what','who','when','why','c','look'].indexOf(k)>=0)p[k]=v;
}

function render(){
  var f={home:home,prompt:prompt,lie:lie,who:who,ethics:ethics,future:future,plan:planIntro,plan1:plan1,plan2:plan2,plan3:plan3,plan4:plan4,plan5:plan5,plan6:plan6,plan7:plan7}[V]||home;
  app.innerHTML=f();
}
function readP(){var P=st.p,a=document.getElementById('pa'),b=document.getElementById('pb');if(a)P.a=a.value;if(b)P.b=b.value;save()}
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-a],[data-ex],[data-s],[data-who],[data-ev],[data-pt],[data-ptone],[data-pc],[data-pr]');if(!t)return;var d=t.dataset;
  if(d.pt){var P0=PL();if(P0.k!==d.pt){P0.k=d.pt;P0.what='';P0.chk={}}save();render();return}
  if(d.ptone){PL().tone=d.ptone;save();render();return}
  if(d.pc){PL().chk[d.pc]=t.checked?1:0;save();return}
  if(d.pr){PL().rules[d.pr]=t.checked?1:0;save();return}
  if(d.a==='pfill'){var P1=PL(),X=pex(),i=+d.i;if(!X)return;
    if(i===1){P1.who=X.who;P1.when=X.when;P1.why=X.why}else if(i===2){P1.s=X.s.map(function(z){return z.slice()})}else if(i===3){P1.c=X.c;P1.look=X.look}else if(i===4){P1.d=X.d.slice()}
    if(!P1.what)P1.what=X.what;save();render();return}
  if(d.a==='pcopy'){pcopy(planOut());return}
  if(d.a==='preset'){var P2=PL();P2.ed=0;P2.text='';save();render();return}
  if(d.a==='pfadd'){PL().fix.push({w:'',n:'',g:''});save();render();return}
  if(d.a==='pfcopy'){var el=document.getElementById('pfx'+d.i);if(el)pcopy(el.textContent);note='복사했어요. Canva 코드의 수정 입력창에 붙여넣으세요.';return}
  if(d.a==='pund'||d.a==='pcoach'){var txt=planOut().split('\n').filter(function(l){return l.indexOf('[꼭 지킬 것]')!==0}).join('\n').trim(),P3=PL();if(!PL().what){note='1단계에서 만들 것을 먼저 적어 주세요';render();return}
    var pr=d.a==='pund'?('개발자처럼 아래 기획을 읽고 1) 만들 앱을 화면 순서로 3줄 설명 2) 기획에 빠져서 네가 마음대로 정해야 할 것 3가지. 코드는 쓰지 마.\n'+txt).slice(0,600):txt.slice(0,600);
    note='';lab({mode:d.a==='pund'?'run':'coach',prompt:pr}).then(function(r){if(d.a==='pund')P3.ru=r.text;else P3.rc=r.text;save()},function(er){note=er.message}).then(render);return}
  if(d.a==='code'){CODE={code:(document.getElementById('code').value||'').trim().toUpperCase()};saveCode();if(AI)check();render();return}
  if(d.a==='recode'){CODE={code:''};saveCode();render();return}
  if(d.ex!=null){st.p.a=PEX[d.ex][0];st.p.b=PEX[d.ex][1];st.p.ra=st.p.rb=st.p.rc='';save();render();return}
  if(d.a==='runA'||d.a==='runB'||d.a==='coach'){readP();var P=st.p,txt=d.a==='runA'?P.a:P.b;if(!txt.trim()){note='부탁을 먼저 적어 주세요';render();return}
    lab({mode:d.a==='coach'?'coach':'run',prompt:txt}).then(function(r){if(d.a==='runA')P.ra=r.text;else if(d.a==='runB')P.rb=r.text;else P.rc=r.text;save()},function(er){note=er.message}).then(render);return}
  if(d.s!=null){var L=st.lie;if(L.done[L.i])return;var sel=L.sel[L.i]||(L.sel[L.i]={});sel[d.s]=!sel[d.s];save();render();return}
  if(d.a==='lieCheck'){var L2=st.lie,R=LIE[L2.i],sl=L2.sel[L2.i]||{};R.s.forEach(function(x,j){if(sl[j])L2.score+=x[1]?1:-1});L2.done[L2.i]=1;save();render();return}
  if(d.a==='lieNext'){st.lie.i++;save();render();window.scrollTo(0,0);return}
  if(d.a==='lieRe'){st.lie={i:0,sel:{},done:{},score:0};save();render();return}
  if(d.who){st.who.pick[st.who.i]=d.who;save();render();return}
  if(d.a==='whoNext'){st.who.i++;save();render();window.scrollTo(0,0);return}
  if(d.a==='whoRe'){st.who={i:0,pick:{},ord:{}};save();render();return}
  if(d.ev){var p=d.ev.split('_');st.eth.v[p[0]]=p[1];save();var y=window.scrollY;render();window.scrollTo(0,y);return}
  if(d.a==='toLive'){var qs=[];try{qs=JSON.parse(localStorage.getItem('live-qs')||'null')||[]}catch(er){}
    ETH.forEach(function(x){if(!qs.some(function(q){return q.text===x.q}))qs.push({type:'poll',text:x.q,opts:['👍 된다','👎 안 된다']})});
    try{localStorage.setItem('live-qs',JSON.stringify(qs))}catch(er){}location.href='live.html?host';return}
  if(d.a==='fut'){var F=st.fut;F.job=(document.getElementById('job').value||'').trim();if(!F.job){note='직무를 먼저 적어 주세요';render();return}
    lab({mode:'future',job:F.job}).then(function(r){F.r=r.text;save()},function(er){note=er.message}).then(render);return}
});
app.addEventListener('input',function(e){if(e.target.id==='pa'||e.target.id==='pb')readP();var pf=e.target.dataset&&e.target.dataset.pf;if(pf){planSet(pf,e.target.value);save()}});
render();
})();
</script>
</body></html>
