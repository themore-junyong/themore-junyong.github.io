<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 수업 도구</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 다섯 활동: #prompt 프롬프트 연습장(AI) · #lie AI 거짓말 찾기 · #who AI vs 사람 글 · #ethics AI 윤리 딜레마 · #future 내 직무 미래 지도(AI) */
:root{
  --bg:#f6f6f6; --ink:#333; --soft:#6f7480; --card:#fff; --line:#e2e3e8; --field:#fbfbfc;
  --blue:#4e6bf1; --blue-ink:#fff; --blue-soft:#e9edfe; --ok:#2e8b4c; --bad:#c8432f; --mid:#c98a00;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642; --field:#1a1d23;
  --blue:#7c93ff; --blue-ink:#10121a; --blue-soft:#262d4a; --ok:#5cc47c; --bad:#ff7a63; --mid:#f0b93a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642; --field:#1a1d23;
  --blue:#7c93ff; --blue-ink:#10121a; --blue-soft:#262d4a; --ok:#5cc47c; --bad:#ff7a63; --mid:#f0b93a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 60px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.75rem;font-weight:900} h2{font-size:1.35rem;font-weight:900} h3{font-size:1.05rem;font-weight:700}
p{margin:0} .soft{color:var(--soft)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top a{color:var(--blue);font-weight:700;text-decoration:none}
.brand small{letter-spacing:.12em;font-weight:700;color:var(--blue);font-size:.78rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.why{background:var(--blue-soft);border-radius:4px;padding:12px 14px;font-size:.95rem}
.why b{color:var(--blue)}
.note{font-size:.88rem;color:var(--soft)} .note.bad{color:var(--bad)} .note.ok{color:var(--ok)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:10px 16px;font-weight:700;color:var(--ink);text-decoration:none;display:inline-block}
.btn.pri{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-weight:700}
.f input,.f textarea{border:1px solid var(--line);background:var(--field);border-radius:4px;padding:10px 12px}
.f textarea{min-height:110px;resize:vertical}
.list{display:flex;flex-direction:column;gap:10px}
a.g{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:4px;padding:14px 16px;color:var(--ink);text-decoration:none}
a.g b{font-size:1.1rem} a.g span{color:var(--soft);font-size:.92rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.out{white-space:pre-wrap;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:12px;font-size:.95rem;line-height:1.7;min-height:60px}
.tag{display:inline-block;font-weight:900;border-radius:4px;padding:2px 8px;font-size:.85rem}
.tag.a{background:#fde3e0;color:#9a2a1c} .tag.b{background:#dff3e6;color:#1d6b3a}
.sent{display:inline;border-radius:3px;padding:2px 2px;cursor:pointer;line-height:2}
.sent[aria-pressed="true"]{background:#ffe08a;color:#333}
.sent.false{text-decoration:underline wavy var(--bad);text-underline-offset:4px}
.sent.hit{background:color-mix(in srgb,var(--ok) 25%,transparent)}
.sent.miss{background:color-mix(in srgb,var(--bad) 22%,transparent)}
.aibox{border:1px solid var(--line);border-radius:6px;padding:14px;background:var(--field)}
.aibox .who{font-size:.8rem;color:var(--soft);font-weight:700;margin-bottom:6px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{border:2px solid var(--line);background:var(--field);border-radius:6px;padding:12px;text-align:left;line-height:1.7;font-size:.95rem}
.pick button.right{border-color:var(--ok)} .pick button.wrong{border-color:var(--bad)}
@media (max-width:640px){.pick{grid-template-columns:1fr}}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vote button{border:2px solid var(--line);background:var(--field);border-radius:6px;padding:14px;font-weight:900;font-size:1.05rem}
.vote button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.side{border-left:4px solid var(--blue);padding:8px 12px;background:var(--field);font-size:.95rem}
.qno{color:var(--blue);font-weight:700;font-size:.9rem}
.big{font-size:2.2rem;font-weight:900;text-align:center}
</style>
<link rel="stylesheet" href="theme.css">
</head><body>
<div class="wrap" id="app"></div>
<script type="module" src="ai.js"></script>
<script>
(function(){
var app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var AI=window.TM_AI||null, CODE={code:''};
try{CODE=JSON.parse(localStorage.getItem('tm-code')||'null')||CODE}catch(e){}
var qc=(new URLSearchParams(location.search).get('c')||'').trim().toUpperCase();if(qc&&qc!==CODE.code)CODE={code:qc};
function saveCode(){try{localStorage.setItem('tm-code',JSON.stringify(CODE))}catch(e){}}
window.addEventListener('tm-ai',function(){AI=window.TM_AI;if(CODE.code&&!CODE.ok)check()});
function check(){AI.check(CODE.code).then(function(r){CODE.name=r.name;CODE.ok=1;delete CODE.err;saveCode();render()},function(e){CODE.ok=0;CODE.err=e.message;render()})}
if(AI&&CODE.code&&!CODE.ok)check();
var V=(location.hash||'').slice(1)||'home', busy=false, note='';
window.addEventListener('hashchange',function(){V=(location.hash||'').slice(1)||'home';note='';render();window.scrollTo(0,0)});
var st={};try{st=JSON.parse(localStorage.getItem('ai-v1')||'{}')}catch(e){}
function save(){try{localStorage.setItem('ai-v1',JSON.stringify(st))}catch(e){}}

function head(t){return '<div class="top"><div class="brand"><small>위듀케이션 · AI 수업 도구</small></div><a href="'+(V==='home'?'./':'#')+'">← '+(V==='home'?'도구 모음':'AI 수업 도구')+'</a></div>'+(t?'<h1>'+t+'</h1>':'')}
function codeCard(){
  if(CODE.ok)return '<p class="note ok">✔ 초대코드 '+esc(CODE.code)+(CODE.name?' · '+esc(CODE.name):'')+' <button class="btn" data-a="recode" style="padding:2px 8px;font-size:.8rem">바꾸기</button></p>';
  return '<div class="card"><h3>초대코드</h3><p class="soft">AI를 쓰는 활동이라 선생님이 알려 준 코드가 필요해요.</p><div class="btns"><input id="code" value="'+esc(CODE.code||'')+'" placeholder="예: OSAN-1106" style="flex:1;min-width:0;border:1px solid var(--line);background:var(--field);border-radius:4px;padding:10px 12px;text-transform:uppercase"><button class="btn pri" data-a="code">확인</button></div>'+(CODE.err?'<p class="note bad">'+esc(CODE.err)+'</p>':'')+(!AI?'<p class="note">연결 준비 중…</p>':'')+'</div>';
}
function lab(p){busy=true;note='';render();return AI.lab(Object.assign({code:CODE.code},p)).finally(function(){busy=false})}

/* ---------- 홈 ---------- */
function home(){
  return head('AI 수업 도구')+'<p class="soft">AI를 "잘 쓰는 사람"이 되기 위한 다섯 가지 활동이에요. ⚡표시는 AI가 실제로 답해요(초대코드 필요).</p><div class="list">'+
   [['prompt','⚡ 프롬프트 연습장','대충 쓴 부탁 vs 잘 쓴 부탁, AI 답을 나란히 비교 + 프롬프트 채점'],
    ['lie','🕵️ AI 거짓말 찾기','AI 답변 속 그럴듯한 거짓 문장을 찾아라 (환각 찾기)'],
    ['who','🤖 AI가 쓴 글 vs 사람이 쓴 글','어느 쪽이 AI일까? AI 글의 특징 알아보기'],
    ['ethics','⚖️ AI 윤리 딜레마','"AI로 자소서를 써도 될까?" 찬반 투표와 생각해 볼 점'],
    ['future','⚡ 내 직무 미래 지도','내 직무에서 AI가 대신할 일·사람이 할 일·키울 역량']].map(function(x){return '<a class="g" href="#'+x[0]+'"><b>'+x[1]+'</b><span>'+x[2]+'</span></a>'}).join('')+'</div>'+
   '<div class="why"><b>선생님 팁:</b> 윤리 딜레마 질문은 <a href="live.html?host">실시간 반응판</a>에 바로 넣어 반 전체 투표로 할 수 있어요(윤리 딜레마 화면 맨 아래 버튼).</div>';
}

/* ---------- ① 프롬프트 연습장 ---------- */
var PEX=[
 ['자소서 써 줘','너는 10년 차 채용 담당자야. 나는 반도체 장비 회사 생산직에 지원하는 공업고등학교 3학년이야. 나의 강점은 성실함이고, 3년 동안 지각·결석 0회, 전기기능사 자격증을 땄어. 이 내용으로 "성격의 장점" 항목을 500자 이내, ~습니다체로 써 줘. 없는 경험은 지어내지 마.'],
 ['운동 알려 줘','너는 헬스 트레이너야. 나는 운동을 처음 하는 고등학생이고, 집에서 도구 없이 하루 15분만 할 수 있어. 일주일 계획을 요일별 표로 짜 줘. 무릎이 약하니 점프 동작은 빼 줘.'],
 ['면접 질문 알려 줘','너는 공기업 면접관이야. 나는 고졸 사무직에 지원했어. 실제로 자주 나오는 인성 질문 5개를 골라, 질문마다 "면접관이 이 질문으로 알고 싶은 것"을 한 줄씩 붙여 줘.']
];
function prompt(){
  var P=st.p||(st.p={a:'',b:'',ra:'',rb:'',rc:''});
  var h=head('⚡ 프롬프트 연습장')+'<div class="why"><b>AI는 묻는 만큼 답해요.</b> 같은 부탁을 <span class="tag a">A 대충</span> <span class="tag b">B 꼼꼼히</span> 두 가지로 써서 결과를 비교해 보세요. 좋은 프롬프트의 5요소: <b>역할 · 목적 · 맥락 · 형식 · 조건</b></div>'+codeCard();
  h+='<div class="card"><h3>예시로 시작하기</h3><div class="btns">'+PEX.map(function(x,i){return '<button class="btn" data-ex="'+i+'">'+esc(x[0])+'</button>'}).join('')+'</div></div>';
  h+='<div class="two"><div class="card"><span class="tag a">A 대충 쓴 부탁</span><div class="f"><textarea id="pa" maxlength="600" placeholder="예: 자소서 써 줘">'+esc(P.a)+'</textarea></div><button class="btn" data-a="runA"'+(CODE.ok&&!busy?'':' disabled')+'>A 보내기</button>'+(P.ra?'<div class="out">'+esc(P.ra)+'</div>':'')+'</div>'+
    '<div class="card"><span class="tag b">B 꼼꼼히 쓴 부탁</span><div class="f"><textarea id="pb" maxlength="600" placeholder="역할·목적·맥락·형식·조건을 넣어 보세요">'+esc(P.b)+'</textarea></div><div class="btns"><button class="btn pri" data-a="runB"'+(CODE.ok&&!busy?'':' disabled')+'>B 보내기</button><button class="btn" data-a="coach"'+(CODE.ok&&!busy?'':' disabled')+'>🧑‍🏫 B 채점받기</button></div>'+(P.rb?'<div class="out">'+esc(P.rb)+'</div>':'')+(P.rc?'<div class="out" style="border-color:var(--blue)">'+esc(P.rc)+'</div>':'')+'</div></div>';
  if(busy)h+='<p class="note">AI가 답을 쓰는 중… (10~30초)</p>';if(note)h+='<p class="note bad">'+esc(note)+'</p>';
  h+='<div class="card"><h3>비교해 볼 질문</h3><ol style="margin:0;padding-left:20px"><li>A와 B 중 바로 쓸 수 있는 답은?</li><li>A의 답에서 AI가 "마음대로 정해 버린" 것은?</li><li>B에 무엇을 더 넣으면 더 좋아질까?</li></ol><p class="note">⚠ 이름·전화번호·주소 같은 개인정보는 AI에 넣지 마세요. AI 답은 저장되지 않아요.</p></div>';
  return h;
}
/* ---------- ② AI 거짓말 찾기 ---------- */
var LIE=[
 {t:'이순신 장군에 대해 알려 줘',s:[
  ['이순신은 임진왜란 때 활약한 조선의 장군입니다.',0],['한산도 대첩에서 학이 날개를 편 모양의 학익진 전법으로 크게 이겼습니다.',0],
  ['거북선은 임진왜란이 끝난 뒤 이순신이 처음 만들었습니다.',1,'거북선은 임진왜란이 일어나기 직전에 완성돼 전쟁 초기부터 쓰였어요.'],
  ['그는 전쟁 중에 쓴 일기를 남겼는데, 이것이 『난중일기』입니다.',0],
  ['노량 해전에서 승리한 뒤 한양으로 돌아가 영의정이 되어 오래 살았습니다.',1,'이순신은 노량 해전에서 적의 총탄에 맞아 전사했어요.']]},
 {t:'재미있는 과학 상식 알려 줘',s:[
  ['물은 1기압에서 100℃에 끓습니다.',0],['지구에서 가장 가까운 별은 북극성입니다.',1,'지구에서 가장 가까운 별은 태양이에요. 북극성은 아주 멀리 있어요.'],
  ['어른의 뼈는 보통 206개 정도입니다.',0],['번개는 같은 곳에 두 번 떨어지지 않습니다.',1,'번개는 같은 곳에 여러 번 떨어질 수 있어요. 높은 건물은 해마다 여러 번 맞아요.'],
  ['소리는 공기보다 물속에서 더 빠르게 전달됩니다.',0]]},
 {t:'알바할 때 알아야 할 노동법 알려 줘',s:[
  ['근로계약서는 꼭 쓰고, 회사는 근로자에게 한 부를 줘야 합니다.',0],['4시간 일하면 30분 이상 쉬는 시간을 줘야 합니다.',0],
  ['수습 기간에는 최저임금을 주지 않아도 됩니다.',1,'수습이라도 최저임금은 지켜야 해요. 아주 제한된 조건에서만 일부 감액(90%)이 허용돼요.'],
  ['아르바이트생에게는 주휴수당이 없습니다.',1,'일주일에 15시간 이상 일하고 약속한 날을 다 나왔다면 알바생도 주휴수당을 받아요.'],
  ['만 15세 미만은 원칙적으로 근로자로 고용할 수 없습니다.',0]]},
 {t:'AI를 쓸 때 주의할 점 알려 줘',s:[
  ['AI는 그럴듯하지만 사실이 아닌 내용을 만들어 낼 수 있습니다. 이것을 "환각"이라고 합니다.',0],
  ['AI가 알려 준 출처와 링크는 항상 실제로 존재합니다.',1,'AI는 있지도 않은 책·기사·링크를 만들어 낼 때가 있어요. 출처는 꼭 직접 열어 확인하세요.'],
  ['AI는 학습한 시점 이후의 최신 소식을 모를 수 있습니다.',0],
  ['AI에 입력한 개인정보는 어디에도 남지 않으니 마음껏 넣어도 됩니다.',1,'서비스에 따라 입력 내용이 저장·학습에 쓰일 수 있어요. 개인정보는 넣지 않는 게 원칙이에요.'],
  ['같은 질문도 어떻게 묻느냐에 따라 답이 달라집니다.',0]]}
];
function lie(){
  var L=st.lie||(st.lie={i:0,sel:{},done:{},score:0});
  if(L.i>=LIE.length)return head('🕵️ AI 거짓말 찾기')+'<div class="card"><div class="big">'+L.score+'점</div><p style="text-align:center">맞게 찾은 거짓 문장 +1, 참인 문장을 거짓이라 하면 -1</p><div class="why"><b>오늘의 한 줄:</b> AI는 <b>틀린 말도 자신 있게</b> 해요. 숫자·사람·법·출처는 반드시 <b>다른 곳에서 한 번 더 확인</b>하세요.</div><button class="btn pri" data-a="lieRe">처음부터 다시</button></div>';
  var R=LIE[L.i],sel=L.sel[L.i]||{},done=L.done[L.i];
  var h=head('🕵️ AI 거짓말 찾기')+'<p class="soft">AI 답변 속에 <b>거짓 문장</b>이 숨어 있어요. 수상한 문장을 눌러 표시하고 "정답 확인"을 누르세요. ('+(L.i+1)+' / '+LIE.length+')</p>';
  h+='<div class="card"><div class="aibox"><div class="who">🙋 질문: '+esc(R.t)+'</div><div class="who">🤖 AI 답변</div><p>'+R.s.map(function(x,j){var c='sent';if(done){if(x[1]&&sel[j])c+=' hit';else if(x[1])c+=' false';else if(sel[j])c+=' miss'}return '<span class="'+c+'" data-s="'+j+'" aria-pressed="'+(!!sel[j]&&!done)+'" role="button">'+esc(x[0])+'</span> '}).join('')+'</p></div>';
  if(!done)h+='<button class="btn pri" data-a="lieCheck">정답 확인</button>';
  else{
    h+='<div class="list">'+R.s.map(function(x,j){if(!x[1])return '';return '<div class="side">'+(sel[j]?'✅ 찾았어요':'❌ 놓쳤어요')+' · <b>'+esc(x[0])+'</b><br>'+esc(x[2])+'</div>'}).join('')+'</div><button class="btn pri" data-a="lieNext">'+(L.i===LIE.length-1?'결과 보기':'다음 답변 →')+'</button>';
  }

    ETH.forEach(function(x){if(!qs.some(function(q){return q.text===x.q}))qs.push({type:'poll',text:x.q,opts:['👍 된다','👎 안 된다']})});
    try{localStorage.setItem('live-qs',JSON.stringify(qs))}catch(er){}location.href='live.html?host';return}
  if(d.a==='fut'){var F=st.fut;F.job=(document.getElementById('job').value||'').trim();if(!F.job){note='직무를 먼저 적어 주세요';render();return}
    lab({mode:'future',job:F.job}).then(function(r){F.r=r.text;save()},function(er){note=er.message}).then(render);return}
});
app.addEventListener('input',function(e){if(e.target.id==='pa'||e.target.id==='pb')readP()});
render();
})();
</script>
