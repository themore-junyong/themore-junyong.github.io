<title>창업 재도전 클리닉</title>

<link rel="stylesheet" href="font.css"><style>
/* 창업 재도전 클리닉 (2026-11-18)
   흐름: M1 사전 진단·재도전 방향 → M2 문제정의·페르소나·BM 캔버스 → M3 TAM·SAM·SOM·경쟁·인터뷰 설계
        → M4 AI 요청문(시장조사·사업계획서·예상 질문·노코드 시제품) → M5 보완계획·4주 로드맵·1:1 상담 → 사후 진단(전후 비교)
   탭은 #m1~#m5·#post·#all (강사가 누르면 학생 화면이 따라감). 내용은 이 휴대폰(localStorage su-v1)에만, '선생님께 보내기'를 누르면 방 강사 화면으로.
   강사 미리보기(?teach=1)에서는 사전·사후 진단 반 통계가 위에 보임 */
:root{
  --bg:#f6f6f6; --ink:#333; --soft:#6f7480; --card:#fff; --line:#e2e3e8; --field:#fbfbfc;
  --blue:#4e6bf1; --blue-ink:#fff; --blue-soft:#e9edfe; --ok:#2e8b4c; --bad:#c8432f; --warn:#b26a00; --warn-soft:#fff4d6;
  --f:"SCDream","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642; --field:#1a1d23;
  --blue:#7c93ff; --blue-ink:#10121a; --blue-soft:#262d4a; --ok:#5cc47c; --bad:#ff7a63; --warn:#ffc56b; --warn-soft:#3a3020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642; --field:#1a1d23;
  --blue:#7c93ff; --blue-ink:#10121a; --blue-soft:#262d4a; --ok:#5cc47c; --bad:#ff7a63; --warn:#ffc56b; --warn-soft:#3a3020; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 60px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.7rem;font-weight:900} h2{font-size:1.3rem;font-weight:900} h3{font-size:1.05rem;font-weight:700} h4{font-size:.98rem}
p{margin:0} .soft{color:var(--soft)}
button,input,textarea,select{font:inherit;color:inherit} button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top a{color:var(--blue);font-weight:700;text-decoration:none}
.brand small{letter-spacing:.12em;font-weight:700;color:var(--blue);font-size:.78rem}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.nav a{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap}
.nav a[aria-current="page"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.nav a.done::after{content:" ✔";color:var(--ok)} .nav a[aria-current="page"].done::after{color:var(--blue-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.why{background:var(--blue-soft);border-radius:4px;padding:12px 14px;font-size:.95rem} .why b{color:var(--blue)}
.warn{background:var(--warn-soft);border-radius:4px;padding:10px 14px;font-size:.92rem}
.note{font-size:.88rem;color:var(--soft)} .note.bad{color:var(--bad)} .note.ok{color:var(--ok)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:10px 16px;font-weight:700;color:var(--ink);text-decoration:none;text-align:center}
.btn.pri{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.f .lb{font-weight:700} .f .hint{font-size:.85rem;color:var(--soft)}
.f input,.f textarea,.f select{border:1px solid var(--line);background:var(--field);border-radius:4px;padding:10px 12px;width:100%;box-sizing:border-box}
.f textarea{min-height:76px;resize:vertical}
.cnt{font-size:.8rem;color:var(--soft);text-align:right}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 14px;font-size:.92rem;text-align:left}
.seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink);font-weight:700}
/* 진단 문항 */
.lk{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.lk .qn{font-weight:500}
.lk .sc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lk .sc button{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:8px 0;font-weight:800;font-size:1rem}
.lk .sc button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:.75rem;color:var(--soft);text-align:center;position:sticky;top:0;background:var(--card);padding:6px 0;z-index:2}
.area{font-weight:900;color:var(--blue);margin-top:6px}
/* 막대 */
.sb{display:grid;grid-template-columns:minmax(7.5em,10em) 1fr 4em;gap:8px;align-items:center;font-size:.92rem}
.sb .tr{height:14px;background:var(--line);border-radius:7px;overflow:hidden;position:relative}
.sb .tr i{display:block;height:100%;background:var(--blue);border-radius:7px}
.sb .tr i.post{background:var(--ok)}
.sb .tr i.pre2{position:absolute;left:0;top:0;height:100%;background:transparent;border-right:3px solid var(--ink);border-radius:0}
.sb b{text-align:right}
.sb.low span:first-child{color:var(--bad);font-weight:700}
/* BM 캔버스 */
.bm{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.bm{grid-template-columns:1fr 1fr}.bm .wide{grid-column:1/-1}}
.bm .cell{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--field)}
.bm .cell .n{font-size:.75rem;font-weight:800;color:var(--blue)}
.bm .cell textarea{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:8px 10px;width:100%;box-sizing:border-box;min-height:64px;resize:vertical}
.oneline{border:2px solid var(--blue);border-radius:6px;padding:12px 14px;font-weight:700;background:var(--card)}
/* 시장 규모 */
.mk{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mk .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.mk .sum{font-weight:900;font-size:1.15rem;color:var(--blue)}
.funnel{display:flex;flex-direction:column;align-items:center;gap:4px}
.funnel div{white-space:nowrap;background:var(--blue);color:var(--blue-ink);border-radius:6px;padding:8px 10px;text-align:center;font-weight:800;font-size:.9rem;box-sizing:border-box}
/* 경쟁 표 */
.cmp{display:flex;flex-direction:column;gap:10px}
.cmp .one{border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.cmp .one{grid-template-columns:1fr 1fr}}
.cmp .one.us{border:2px solid var(--blue)}
.qbank button{display:block;width:100%;text-align:left;border:1px dashed var(--line);background:var(--field);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:.92rem}
.qlist li{margin-bottom:6px}
.bad-q{border-left:4px solid var(--bad);background:var(--field);padding:8px 12px;font-size:.9rem;display:flex;flex-direction:column;gap:2px}
/* 요청문 */
.pr{white-space:pre-wrap;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:12px;font-size:.88rem;line-height:1.65;max-height:320px;overflow:auto}
.out{white-space:pre-wrap;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:14px;line-height:1.75}
.plan{border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.plan{grid-template-columns:1fr 1fr}}
.home{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.home{grid-template-columns:1fr 1fr}}
.home a{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:14px;text-decoration:none;color:var(--ink)}
.home a b{font-size:1.02rem} .home a span{font-size:.88rem;color:var(--soft)} .home a i{font-style:normal;font-size:.8rem;font-weight:800;color:var(--blue)}
.home a.done i{color:var(--ok)}
.stat{border:2px solid var(--blue);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.stat h3{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap} .stat h3 span{font-size:.85rem;color:var(--soft);font-weight:500}
details summary{cursor:pointer;font-weight:700}
.tm{font-variant-numeric:tabular-nums}
@media print{.btns,.nav,.top a,.stat{display:none!important} .card{break-inside:avoid}}
</style>

 ['cost','⑨ 비용 구조','돈이 가장 많이 나가는 곳','예: 재료비, 배송비, 주방 임대료']];
var GOODQ=['최근에 [문제]를 겪은 게 언제였어요? 그때 무슨 일이 있었어요?','그때 어떻게 해결하셨어요?','그 방법에서 가장 불편하거나 아까운 점은 뭐였어요?',
 '그 문제를 풀려고 돈이나 시간을 써 본 적 있어요? 얼마나요?','이 일이 얼마나 자주 생겨요?','이 문제로 가장 힘들어하는 사람을 소개해 주실 수 있어요?','제가 물어봤어야 하는데 안 물어본 게 있을까요?'];
var BADQ=[['이런 서비스가 있으면 쓰시겠어요?','앞으로 하겠다는 말은 믿기 어려워요. 지난번에 실제로 한 행동을 물어요.'],

 ['제 아이디어 어때요?','예의상 칭찬만 돌아와요. 내 아이디어 설명은 맨 마지막에, 짧게.']];
var TABS=[['','홈'],['m1','M1 진단'],['m2','M2 아이디어'],['m3','M3 시장 검증'],['m4','M4 AI 활용'],['m5','M5 로드맵'],['post','사후 진단'],['all','내 재도전 카드']];

/* ───── 저장 ───── */
function blank(){return {item:'',prev:'',target:'',due:'',
  pre:{a:[],f:[],dir:''},post:{a:[],best:'',next:''},
  m2:{who:'',when:'',pain:'',now:'',why:'',sol:'',p:{nick:'',age:'',scene:'',pain:'',gain:'',alt:'',spend:'',quote:''},bm:{}},
  m3:{tam:{n:'',p:'',src:''},sam:{n:'',p:'',src:''},som:{n:'',p:'',src:''},somWhy:'',comp:[{},{},{}],us:{},diff:'',iv:{goal:'',who:'',count:'5',qs:[],log:''}},
  m4:{memo:''},
  m5:{rows:[{},{},{}],weeks:['','','',''],next:'',due:'',money:'',ask:'',memo:''},sent:{}}}
var D=blank();
try{var sv=JSON.parse(localStorage.getItem('su-v1')||'null');if(sv)D=merge(blank(),sv)}catch(e){}
function merge(a,b){for(var k in b){if(!Object.prototype.hasOwnProperty.call(b,k))continue;
  if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))merge(a[k],b[k]);else a[k]=b[k]}return a}
function save(){try{localStorage.setItem('su-v1',JSON.stringify(D))}catch(e){}}
function get(p){return p.split('.').reduce(function(o,k){return o==null?'':o[k]},D)}
function set(p,v){var ks=p.split('.'),o=D;for(var i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=v;save()}

/* ───── 계산 ───── */
function score(ans){ // 영역마다 0~100 (4문항 × 1~5점)
  var r={};AREAS.forEach(function(A){var s=0,n=0;QS.forEach(function(q,i){if(q[0]===A.k&&ans[i]){s+=ans[i];n++}});r[A.k]=n?Math.round((s-n)/(n*4)*100):null});return r}
function doneCount(ans){return QS.filter(function(_,i){return ans[i]}).length}
function total(sc){var v=AREAS.map(function(A){return sc[A.k]}).filter(function(x){return x!=null});return v.length?Math.round(v.reduce(function(a,b){return a+b},0)/v.length):0}
function weak(){ // 약한 영역 2곳: 점수 낮은 곳 + 평가에서 지적받은 곳(1개당 15점 더 약하게 봄)
  var sc=score(D.pre.a),adj={};AREAS.forEach(function(A){adj[A.k]=(sc[A.k]==null?50:sc[A.k])});
  D.pre.f.forEach(function(i){var k=FEED[i]&&FEED[i][1];if(k)adj[k]-=15});
  return AREAS.slice().sort(function(a,b){return adj[a.k]-adj[b.k]}).slice(0,2)}
function num(v){var n=parseFloat(String(v||'').replace(/[^\d.]/g,''));return isFinite(n)?n:0}
function won(v){if(!v)return '-';if(v>=1e12)return (Math.round(v/1e11)/10)+'조 원';if(v>=1e8)return (Math.round(v/1e7)/10).toLocaleString('ko-KR')+'억 원';if(v>=1e4)return Math.round(v/1e4).toLocaleString('ko-KR')+'만 원';return Math.round(v).toLocaleString('ko-KR')+'원'}
function mkv(k){var x=D.m3[k];return num(x.n)*num(x.p)}
function oneLine(){var m=D.m2,bm=m.bm;var who=bm.cs||m.who,pain=m.pain,sol=m.sol||bm.vp,rs=bm.rs;
  if(!who&&!pain&&!sol)return '';return '고객: '+(who||'?')+' → 문제: '+(pain||'?')+' → 해결: '+(sol||'?')+' → 수익: '+(rs||'?')}
function problem(){var m=D.m2;if(!m.who&&!m.pain)return '';
  return ['누가: '+(m.who||'?'),m.when&&'언제: '+m.when,'불편: '+(m.pain||'?'),'지금 방법: '+(m.now||'?'),'부족한 점: '+(m.why||'?')].filter(Boolean).join(' / ')}

/* ───── 화면 조각 ───── */
var TEACH=!!(window.TM_ROOM&&TM_ROOM.teach);
function tab(){var h=(location.hash||'').slice(1);return TABS.some(function(t){return t[0]===h})?h:''}
function nav(){var c=tab();return '<nav class="nav" aria-label="단계">'+TABS.map(function(t){var d=t[0]&&D.sent[t[0]];return '<a href="#'+t[0]+'"'+(c===t[0]?' aria-current="page"':'')+(d?' class="done"':'')+'>'+t[1]+'</a>'}).join('')+'</nav>'}
function head(){return '<div class="top"><div class="brand"><small>위듀케이션 · 창업 재도전 클리닉</small></div><a href="./">← 도구 모음</a></div>'+nav()}
function field(p,label,hint,o){if(typeof hint!=='string')hint='';o=o||{};var v=get(p),id='f_'+p.replace(/\./g,'_'),mx=o.max||(o.area?300:80);
  return '<div class="f"><label for="'+id+'">'+label+(o.opt?' <span class="soft">(선택)</span>':'')+'</label>'+(hint?'<span class="hint">'+hint+'</span>':'')+
   (o.area?'<textarea id="'+id+'" data-k="'+p+'" maxlength="'+mx+'" placeholder="'+esc(o.ph||'')+'"'+(o.h?' style="min-height:'+o.h+'px"':'')+'>'+esc(v)+'</textarea>'
    :'<input id="'+id+'" data-k="'+p+'" maxlength="'+mx+'" value="'+esc(v)+'" placeholder="'+esc(o.ph||'')+'"'+(o.num?' inputmode="numeric"':'')+'>')+'</div>'}
function sendBtn(k,label){var t=D.sent[k];return '<div class="btns"><button class="btn pri" data-send="'+k+'">'+(label||'✔ 다 썼어요 · 선생님께 보내기')+'</button>'+
  (t?'<span class="note ok" style="align-self:center">보냄 '+new Date(t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' · 고친 뒤 다시 보내면 바뀌어요</span>':'')+'</div>'}
function bar(lab,v,cls,extra){return '<div class="sb'+(cls?' '+cls:'')+'"><span>'+lab+'</span><span class="tr"><i class="'+(extra&&extra.post?'post':'')+'" style="width:'+(v==null?0:Math.max(2,v))+'%"></i>'+
  (extra&&extra.pre!=null?'<i class="pre2" style="width:'+extra.pre+'%" title="사전 '+extra.pre+'점"></i>':'')+'</span><b>'+(v==null?'-':v+'점')+'</b></div>'}
function likert(key){var ans=D[key].a,lastA='';
  return '<div class="legend" aria-hidden="true">'+SCALE.map(function(s,i){return '<span>'+(i+1)+'<br>'+s+'</span>'}).join('')+'</div>'+
   QS.map(function(q,i){var A=AREAS.filter(function(x){return x.k===q[0]})[0],h='';
    if(lastA!==q[0]){lastA=q[0];h+='<div class="area">'+A.e+' '+A.n+' <span class="note">'+A.ps+'</span></div>'}
    return h+'<div class="lk"><span class="qn">'+(i+1)+'. '+esc(q[1])+'</span><div class="sc" role="group" aria-label="'+(i+1)+'번 답">'+
     [1,2,3,4,5].map(function(n){return '<button data-lk="'+key+'" data-i="'+i+'" data-v="'+n+'" aria-pressed="'+(ans[i]===n)+'" aria-label="'+SCALE[n-1]+'">'+n+'</button>'}).join('')+'</div></div>'}).join('')}

/* ───── 강사 미리보기: 사전·사후 진단 반 통계 ───── */
var SW=null,STM=[];
if(TEACH&&TM_ROOM.teachWork)TM_ROOM.teachWork(['su-m1','su-post'],function(A,T){if(T){STM=T;return}
  SW=A.map(function(x){var m=/⟦([\s\S]*)⟧\s*$/.exec(x.body||''),d=null;try{d=m&&JSON.parse(m[1])}catch(e){}return {tool:x.tool,nick:x.nick,team:x.team||'',d:d}}).filter(function(x){return x.d});
  var y=window.scrollY;render();window.scrollTo(0,y)});
function statBox(){if(!TEACH)return '';
  if(!SW)return '<div class="stat"><h3>📊 반 통계 (선생님만 보여요) <span>방을 연 노트북에서 보면 학생 진단이 모여요</span></h3></div>';
  var pre=SW.filter(function(x){return x.tool==='su-m1'}),post=SW.filter(function(x){return x.tool==='su-post'});
  var h='<div class="stat"><h3>📊 반 통계 (선생님만 보여요) <span>사전 '+pre.length+'명 · 사후 '+post.length+'명</span></h3>';
  if(!pre.length&&!post.length)return h+'<p class="note">학생이 진단을 마치고 보내면 여기 바로 모여요.</p></div>';
  var avg=function(L,k){var v=L.map(function(x){return x.d.s&&x.d.s[k]}).filter(function(v){return v!=null});return v.length?Math.round(v.reduce(function(a,b){return a+b},0)/v.length):null};
  h+='<b>영역별 반 평균'+(post.length?' (초록 = 사후, 검은 선 = 사전)':'')+'</b>';
  var low=AREAS.slice().sort(function(a,b){return (avg(pre,a.k)||0)-(avg(pre,b.k)||0)}).slice(0,2).map(function(a){return a.k});
  h+=AREAS.map(function(A){var a=avg(pre,A.k),b=avg(post,A.k);return post.length?bar(A.e+' '+A.n,b,'',{post:1,pre:a}):bar(A.e+' '+A.n,a,low.indexOf(A.k)>=0?'low':'')}).join('');
  var tavg=function(L){return L.length?Math.round(L.reduce(function(a,x){return a+total(x.d.s||{})},0)/L.length):null};
  if(post.length){var tp=tavg(pre),tq=tavg(post);h+='<p><b>전체 평균</b> 사전 '+(tp==null?'-':tp+'점')+' → 사후 '+(tq==null?'-':tq+'점')+(tp!=null&&tq!=null?' <b style="color:var(--ok)">('+(tq-tp>=0?'+':'')+(tq-tp)+')</b>':'')+'</p>'}
  var fc={};pre.forEach(function(x){(x.d.f||[]).forEach(function(i){fc[i]=(fc[i]||0)+1})});
  var fk=Object.keys(fc).sort(function(a,b){return fc[b]-fc[a]});
  if(fk.length)h+='<b>지난 평가에서 지적받은 점 (많은 순)</b>'+fk.slice(0,6).map(function(i){var n=fc[i],p=Math.round(n/pre.length*100);return '<div class="sb"><span>'+esc((FEED[i]||[''])[0])+'</span><span class="tr"><i style="width:'+p+'%"></i></span><b>'+n+'명</b></div>'}).join('');
  if(pre.length)h+='<details><summary>학생별 약한 영역 ('+pre.length+'명)</summary><div style="display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:.92rem">'+pre.map(function(x){var s=x.d.s||{},w=AREAS.slice().sort(function(a,b){return (s[a.k]==null?99:s[a.k])-(s[b.k]==null?99:s[b.k])}).slice(0,2);
    return '<span>'+(x.team?esc(x.team)+' · ':'')+'<b>'+esc(x.nick)+'</b> '+total(s)+'점 · 약한 곳: '+w.map(function(a){return a.e+' '+a.n+' '+s[a.k]}).join(', ')+'</span>'}).join('')+'</div></details>';
  return h+'<p class="note">1:1 상담 순서를 정할 때 쓰세요. 학생별 전체 내용은 강사 화면 "학생 결과"에 있어요.</p></div>'}

  var n=doneCount(D.pre.a),all=n===QS.length,sc=score(D.pre.a),w=weak();

    '<h4>먼저 고칠 곳 2곳</h4>'+w.map(function(A){var fs=D.pre.f.filter(function(i){return FEED[i][1]===A.k}).map(function(i){return FEED[i][0]});
      return '<div class="warn"><b>'+A.e+' '+A.n+' ('+A.ps+')</b> '+(sc[A.k]==null?'':sc[A.k]+'점')+(fs.length?' · 지적: '+esc(fs.join(', ')):'')+'<br>'+A.tip+'</div>'}).join('')+
    field('pre.dir','나의 재도전 방향 한 줄','위 두 곳을 어떻게 고칠지, 내 말로',{area:1,h:60,max:200,ph:'예: 고객을 1인 가구 직장인으로 좁히고, 인터뷰 10명으로 문제 근거와 시장 규모를 다시 세운다'})+

  return h;
}

function ctx(){ // 앞 단계에서 쓴 내용을 요청문에 넣을 한 덩어리로
  var m=D.m2,bm=m.bm,m3=D.m3,L=[];
  L.push('[내 창업 아이템] '+(D.item||'(아직 안 씀)'));
  var pb=problem().split(' / ').filter(function(x){return !/: \?$/.test(x)}).join(' / ');if(pb)L.push('[문제 정의] '+pb);
  if(m.sol)L.push('[해결책] '+m.sol);
  var p=m.p;if(p.nick||p.age)L.push('[핵심 고객] '+[p.nick,p.age,p.pain&&('힘든 점: '+p.pain),p.alt&&('지금 쓰는 방법: '+p.alt)].filter(Boolean).join(' / '));
  var bl=BM.filter(function(b){return bm[b[0]]}).map(function(b){return b[1].replace(/^\S+ /,'')+': '+bm[b[0]]});if(bl.length)L.push('[BM 캔버스] '+bl.join(' / '));
  var mk=['tam','sam','som'].filter(function(k){return mkv(k)}).map(function(k){return k.toUpperCase()+' '+won(mkv(k))+' ('+num(m3[k].n).toLocaleString('ko-KR')+'명 × '+num(m3[k].p).toLocaleString('ko-KR')+'원'+(m3[k].src?', 근거: '+m3[k].src:'')+')'});if(mk.length)L.push('[내가 잡은 시장 규모] '+mk.join(' / '));
  var cp=m3.comp.filter(function(c){return c.name}).map(function(c){return c.name+(c.type?'('+c.type+')':'')+(c.price?' 가격 '+c.price:'')+(c.good?' 강점 '+c.good:'')+(c.bad?' 약점 '+c.bad:'')});if(cp.length)L.push('[경쟁] '+cp.join(' / '));
  if(m3.diff)L.push('[우리 차별점] '+m3.diff);
  if(m3.iv.log)L.push('[고객 인터뷰 결과] '+m3.iv.log);
  var w=weak();if(doneCount(D.pre.a))L.push('[지난 평가에서 약했던 곳] '+w.map(function(a){return a.n}).join(', ')+(D.pre.f.length?' / 지적받은 점: '+D.pre.f.map(function(i){return FEED[i][0]}).join(', '):''));
  return L.join('\n');
}

function bodyOf(k){
  var L=[],m=D.m2,m3=D.m3,m5=D.m5,add=function(t,v){if(v&&String(v).trim())L.push(t+': '+String(v).trim())};
  if(k==='m1'||k==='post'){var a=D[k==='m1'?'pre':'post'].a,sc=score(a),pre=score(D.pre.a);
    L.push((k==='m1'?'[사전 진단] ':'[사후 진단] ')+'전체 '+total(sc)+'점 ('+doneCount(a)+'/'+QS.length+'문항)'+(k==='post'&&doneCount(D.pre.a)?' · 사전 '+total(pre)+'점 → '+(total(sc)-total(pre)>=0?'+':'')+(total(sc)-total(pre)):''));
    AREAS.forEach(function(A){L.push('- '+A.n+' '+(sc[A.k]==null?'-':sc[A.k])+(k==='post'&&pre[A.k]!=null?' (사전 '+pre[A.k]+')':''))});
    if(k==='m1'){add('아이템',D.item);add('지난 지원 사업',D.prev);if(D.pre.f.length)L.push('지적받은 점: '+D.pre.f.map(function(i){return FEED[i][0]}).join(', '));
      L.push('먼저 고칠 곳: '+weak().map(function(A){return A.n}).join(', '));add('재도전 방향',D.pre.dir)}
    else{add('가장 달라진 점',D.post.best);add('1주일 안에 할 일',D.post.next)}
    return L.join('\n')+'\n⟦'+JSON.stringify({k:k==='m1'?'pre':'post',s:sc,f:k==='m1'?D.pre.f:undefined})+'⟧'}
  if(k==='m2'){add('아이템',D.item);var pb=problem();add('문제 정의',pb);add('해결책',m.sol);
    var p=m.p;L.push('[페르소나]');add('별명',p.nick);add('나이·직업',p.age);add('하루 장면',p.scene);add('힘든 점',p.pain);add('바라는 것',p.gain);add('지금 쓰는 방법',p.alt);add('고객이 한 말',p.quote);

  if(k==='m3'){['tam','sam','som'].forEach(function(x){var v=mkv(x);if(v||m3[x].src)L.push(x.toUpperCase()+': '+won(v)+' ('+(m3[x].n||'-')+' × '+(m3[x].p||'-')+'원) 근거: '+(m3[x].src||'없음'))});add('SOM 이유',m3.somWhy);
    var cp=m3.comp.filter(function(c){return c.name});if(cp.length){L.push('[경쟁]');cp.forEach(function(c){L.push('- '+c.name+(c.type?' ('+c.type+')':'')+(c.price?' · '+c.price:'')+(c.good?' · 강점 '+c.good:'')+(c.bad?' · 약점 '+c.bad:''))})}
    if(m3.us.price||m3.us.good)L.push('- 우리'+(m3.us.price?' · '+m3.us.price:'')+(m3.us.good?' · 강점 '+m3.us.good:''));add('차별점',m3.diff);
    L.push('[인터뷰 설계]');add('가설',m3.iv.goal);add('대상',m3.iv.who);add('인원',m3.iv.count);m3.iv.qs.forEach(function(q,i){L.push((i+1)+'. '+q)});add('알게 된 것',m3.iv.log);return L.join('\n')}
  if(k==='m4'){add('AI로 알아낸 것',D.m4.memo);return L.join('\n')}
  if(k==='m5'){add('다음 지원',D.target);add('마감',D.due);L.push('[보완 계획]');m5.rows.forEach(function(r,i){if(r.what||r.how)L.push((i+1)+'. '+(r.what||'')+' → '+(r.how||'')+(r.when?' · '+r.when+'까지':'')+(r.check?' · 확인: '+r.check:''))});
    L.push('[4주 로드맵]');m5.weeks.forEach(function(w,i){if(w)L.push((i+1)+'주차: '+w)});add('지원금 쓸 곳',m5.money);add('상담 질문',m5.ask);add('상담 메모',m5.memo);return L.join('\n')}
  return ''}

  if(d.cdel!=null){D.m3.comp.splice(+d.cdel,1);save();render();window.scrollTo(0,y);return}
  if(d.gq!=null){D.m3.iv.qs.push(GOODQ[+d.gq]);save();render();window.scrollTo(0,y);return}
  if(d.qdel!=null){D.m3.iv.qs.splice(+d.qdel,1);save();render();window.scrollTo(0,y);return}
  if(d.rdel!=null){D.m5.rows.splice(+d.rdel,1);save();render();window.scrollTo(0,y);return}
  if(d.cp!=null){copy(prompts()[+d.cp][3],t,'복사됨 ✔ AI 창에 붙여 넣으세요');return}
  if(d.send){var k2=d.send,body=bodyOf(k2);
    if(k2==='m1'&&doneCount(D.pre.a)<QS.length&&!confirm('아직 '+(QS.length-doneCount(D.pre.a))+'문항이 남았어요. 이대로 보낼까요?'))return;
    if(!window.TM_ROOM||TEACH){toast(TEACH?'미리보기라 보내지 않아요':'수업 방에 들어와야 보낼 수 있어요',!TEACH);return}
    TM_ROOM.send('su-'+k2,'창업 '+TITLE[k2]+(D.item?' · '+D.item.slice(0,40):''),body).then(function(ok){if(ok){D.sent[k2]=Date.now();save();render();window.scrollTo(0,y)}});return}
  var a=d.a;
  if(a==='cadd'){D.m3.comp.push({});save();render();window.scrollTo(0,y);return}
  if(a==='qadd'){var q=document.getElementById('qnew'),v2=(q.value||'').trim();if(!v2)return;D.m3.iv.qs.push(v2.slice(0,120));save();render();window.scrollTo(0,y);return}
  if(a==='radd'){D.m5.rows.push({});save();render();window.scrollTo(0,y);return}
  if(a==='fill'){var w=weak();w.forEach(function(A,i){var r=D.m5.rows[i]||(D.m5.rows[i]={}),F=FIX[A.k];['what','how','check'].forEach(function(x){if(!r[x])r[x]=F[x]})});
    D.m5.weeks=D.m5.weeks.map(function(x,i){return x||WEEKS[i]});save();render();window.scrollTo(0,y);toast('✔ 빈칸만 채웠어요. 내 상황에 맞게 고쳐 주세요');return}
  if(a==='copyall'){copy(allText(),t);return}
  if(a==='print'){window.print();return}
  if(a==='wipe'){if(!confirm('이 휴대폰에 저장된 창업 재도전 내용을 모두 지울까요?'))return;D=blank();save();location.hash='';render();return}
});
render();
})();
