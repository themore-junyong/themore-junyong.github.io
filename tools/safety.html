<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>안전 징검다리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* Layout: 빔프로젝터 한 화면. 위 = 두 팀 징검다리 레인, 가운데 = 문제 카드, 아래 = 보기 버튼 */
:root{
  --bg:#f3f1e8; --ink:#1f2422; --soft:#55605b; --card:#fffef9; --line:rgba(31,36,34,.15);
  --water:#2c7f8c; --water2:#1d5e69; --stone:#c9c2ad; --stone-edge:#a39a80;
  --a:#e5522f; --b:#2f62d6; --hazard:#f5c518; --ok:#2e8b4c; --bad:#c8432f;
  --f-d:"Black Han Sans","Noto Sans KR",system-ui,sans-serif; --f-b:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a19; --ink:#eef2ef; --soft:#a8b3ae; --card:#1f2725; --line:rgba(238,242,239,.16);
  --water:#1d5c66; --water2:#123f46; --stone:#6d6758; --stone-edge:#4f4a3e; --a:#ff7a57; --b:#6c95ff; --ok:#5cc47c; --bad:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a19; --ink:#eef2ef; --soft:#a8b3ae; --card:#1f2725; --line:rgba(238,242,239,.16);
  --water:#1d5c66; --water2:#123f46; --stone:#6d6758; --stone-edge:#4f4a3e; --a:#ff7a57; --b:#6c95ff; --ok:#5cc47c; --bad:#ff7a63; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;padding-block:14px 24px;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--f-d);font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--hazard);outline-offset:3px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.top h1{font-size:clamp(1.8rem,4.5vw,3rem);display:flex;align-items:center;gap:12px}
.tape{display:inline-block;width:56px;height:18px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 10px,#1f2422 10px 20px);border-radius:3px}
.small{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:700}
.river{background:repeating-linear-gradient(175deg,var(--water) 0 24px,var(--water2) 24px 28px);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.lane{display:grid;grid-template-columns:76px repeat(9,1fr) 76px;gap:6px;align-items:center}
.shore{background:#d8c9a0;border-radius:10px;height:62px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.85rem;color:#3b3220;text-align:center;line-height:1.2}
.st{height:46px;border-radius:50%/45%;background:var(--stone);border:3px solid var(--stone-edge);position:relative;display:flex;align-items:center;justify-content:center}
.st .pl{position:absolute;font-size:2rem;top:-22px;transition:transform .3s}
.lane.turn .st, .lane.turn .shore{box-shadow:0 0 0 3px var(--hazard)}
.lane .who{font-family:var(--f-d);font-size:1.05rem;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.lane-head{display:flex;justify-content:space-between;color:#fff;font-weight:700;font-size:.95rem;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.qcard{background:var(--card);border-radius:16px;padding:20px 22px;border:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;color:var(--soft)}
.qmeta .turnTag{color:#fff;border-radius:999px;padding:4px 14px}
.q{font-size:clamp(1.35rem,3vw,2.05rem);font-weight:900;line-height:1.45;margin:0;text-wrap:pretty}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.opt{border:3px solid var(--line);background:var(--bg);border-radius:14px;padding:16px;font-size:clamp(1.1rem,2.3vw,1.45rem);font-weight:700;text-align:left;display:flex;gap:12px;align-items:center;min-width:0}
.opt .k{font-family:var(--f-d);font-size:1.6rem;min-width:1.4em;color:var(--soft)}
.opt:hover:not(:disabled){border-color:var(--hazard)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--bg))}
.opt:disabled{cursor:default}
.exp{border-left:6px solid var(--hazard);padding:10px 14px;background:var(--bg);border-radius:6px;font-size:1.1rem;line-height:1.65;margin:0}
.exp b.ok{color:var(--ok)} .exp b.bad{color:var(--bad)}
.next{align-self:flex-end;background:var(--hazard);color:#1f2422;border:0;border-radius:12px;padding:12px 26px;font-family:var(--f-d);font-size:1.3rem}
.over{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.over .card{background:var(--card);border-radius:18px;padding:26px;max-width:620px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto;box-sizing:border-box}
.over h2{font-size:2.4rem}
.over p{margin:0;font-size:1.15rem;line-height:1.7}
.foot{color:var(--soft);font-size:.9rem;line-height:1.6;margin:0}
@media (max-width:700px){.lane{grid-template-columns:44px repeat(9,1fr) 44px;gap:3px}.shore{height:48px;font-size:.62rem}.st{height:30px}.st .pl{font-size:1.4rem;top:-16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="wrap" id="app"></div>
<script>
(()=>{
/* 문제: 천안공고 4교시 PPT(위험요인 찾기·통제 5단계·표지 색·하인리히·지적확인·작업중지권·PPE·비상)에서만 출제 */
const QS=[
 {q:'천장 작업 중인 선배가 접이식 사다리 <u>맨 위 칸</u>에 서 있고, 아래에서 잡아 주는 사람이 없다. 가장 큰 위험은?',o:['떨어짐(추락)','감전','소음'],a:0,e:'건설업 사고사망 1위가 <b>떨어짐</b>이에요. 해결: 이동식 비계·작업대로 바꾸기, 2인 1조로 잡아 주기, 맨 위 칸 금지.'},
 {q:'피복이 벗겨진 전동공구 <u>연장선</u>이 통로를 가로지르고 있다. 위험 두 가지는?',o:['넘어짐 · 감전','추락 · 화재','분진 · 소음'],a:0,e:'<b>넘어짐 + 감전</b>. 연장선 정리·고정, 벗겨진 선은 바로 교체, 누전차단기 사용.'},
 {q:'계단 옆 바닥에 뚫어 둔 구멍(개구부)에 덮개도 난간도 없다. 가장 좋은 해결은?',o:['"조심하세요"라고 말해 준다','덮개·안전 난간을 설치한다','안전화를 신는다'],a:1,e:'<b>덮개·안전 난간</b>(공학적 대책)이 말이나 보호구보다 강해요. 표지판·출입 통제도 함께.'},
 {q:'석고보드를 자르던 실습생이 "잠깐이니까" 마스크와 보안경을 벗어 두었다. 괜찮다?',o:['O, 잠깐이면 괜찮다','X, 잠깐도 예외 없다'],a:1,e:'<b>X</b>. 분진 흡입·눈 부상 위험. 집진 장치 + 마스크·보안경, <b>"잠깐"도 예외 없음</b>.'},
 {q:'자재 박스가 <u>비상구 앞</u>에 사람 키만큼 쌓여 있다. 무엇이 문제?',o:['보기 안 좋다','비상 대피를 막는다','자재가 젖는다'],a:1,e:'<b>비상 대피 방해</b>. 비상구 앞 적치 금지, 자재 보관 구역을 정해요(5S의 "정돈").'},
 {q:'위험 통제 5단계 중 <u>가장 강한</u> 방법은?',o:['보호구 착용','관리적 대책(교육·표지)','제거(위험 자체를 없앰)'],a:2,e:'순서는 <b>제거 → 대체 → 공학적 → 관리적 → 보호구</b>. 보호구는 "마지막 방어선"이에요.'},
 {q:'"보호구 착용 의무"처럼 <u>반드시 해라</u>를 뜻하는 안전표지 색은?',o:['빨강','파랑','초록'],a:1,e:'<b>파랑 = 의무</b>. 빨강 = 금지·위험, 노랑 = 주의, 초록 = 안전·대피(비상구).'},
 {q:'비상구·피난 경로를 알려 주는 "이쪽으로 가라" 표지 색은?',o:['초록','노랑','빨강'],a:0,e:'<b>초록 = 안전·대피</b>. 비상구, 구호약 위치, AED도 초록이에요.'},
 {q:'하인리히 법칙 1 : 29 : 300에서 <u>300</u>은 무엇?',o:['큰 사고','가벼운 사고','다칠 뻔한 일(아차사고)'],a:2,e:'큰 사고 1건 전에 <b>아차사고 300건</b>이 먼저 온다는 관찰(1931). 그래서 아차사고는 기록하고 알려요.'},
 {q:'대상을 손가락으로 가리키고 "전원 차단 확인!" 하고 소리 내는 방법은?',o:['지적확인','TBM','LOTO'],a:0,e:'<b>지적확인</b>. 1994년 일본 철도종합기술연구소 실험에서 실수가 <b>약 85%</b> 줄었어요.'},
 {q:'작업 시작 전 공구함 앞에 모여 "오늘 할 일과 위험"을 나누는 짧은 모임은?',o:['LOTO','TBM','SOP'],a:1,e:'<b>TBM</b>(Tool Box Meeting). 실습생도 꼭 참석해서 듣고 메모해요.'},
 {q:'기계를 점검·청소하기 전 전원을 끄고 <u>자물쇠와 꼬리표</u>를 다는 절차는?',o:['TBM','5S','LOTO'],a:2,e:'<b>LOTO</b>(Lock Out, Tag Out). 남이 모르고 켜는 사고를 막아요.'},
 {q:'처음 보는 기계를 혼자 하라고 할 때, 실습생은 시키면 무조건 해야 한다?',o:['O','X'],a:1,e:'<b>X</b>. 산업안전보건법 제52조: 급박한 위험이 있으면 <b>작업을 멈추고 대피</b>할 수 있어요. 3문장으로 말하기: 상황 → 걱정 → 부탁.'},
 {q:'고릴라 실험에서 공 패스를 세던 사람 중 고릴라를 못 본 비율은?',o:['약 5%','약 46%','약 90%'],a:1,e:'<b>약 46%</b>(Simons & Chabris, 1999). 내 작업에만 집중하면 옆 위험이 안 보여요 = <b>무주의 맹시</b>.'},
 {q:'불이 나서 대피할 때 맞는 행동은?',o:['엘리베이터로 빨리 내려간다','지정 경로 계단으로 대피한다','짐부터 챙긴다'],a:1,e:'<b>지정 경로로 대피</b>, 엘리베이터는 쓰지 않아요. 침착 → 확인 → 보고 → 대피 → 집결 → 복귀.'},
 {q:'2024년 일하다 사고로 숨진 589명 중 건설업은 약 몇 %?',o:['약 15%','약 30%','약 47%'],a:2,e:'<b>276명, 약 47%</b>로 업종 중 가장 많았어요(고용노동부, 2025-03 발표). 우리 과 현장이 바로 여기예요.'}
];
const N=9; // 징검돌 수
let S, order, qi, answered;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function reset(){S={pos:[0,0],turn:0,score:[0,0]};order=shuffle(QS.map((_,i)=>i));qi=0;answered=null;draw()}
const app=document.getElementById('app');
const T=[{n:'A팀',c:'var(--a)',e:'🦺'},{n:'B팀',c:'var(--b)',e:'⛑️'}];
function lane(t){
  const p=S.pos[t];
  const cells=[`<div class="shore">${p===0?`<span style="font-size:1.8rem">${T[t].e}</span>`:'출발'}</div>`];
  for(let i=1;i<=N;i++) cells.push(`<div class="st">${p===i?`<span class="pl">${T[t].e}</span>`:''}</div>`);
  cells.push(`<div class="shore">${p>N?`<span style="font-size:1.8rem">${T[t].e}</span>`:'안전<br>현장'}</div>`);
  return `<div class="lane-head"><span style="color:#fff">${T[t].n} ${S.turn===t?'◀ 차례':''}</span><span>${Math.min(p,N+1)>N?'도착!':`${N+1-p}칸 남음`}</span></div>
    <div class="lane ${S.turn===t?'turn':''}">${cells.join('')}</div>`;
}
function draw(){
  const Q=QS[order[qi%order.length]];
  const keys=['①','②','③','④'];
  app.innerHTML=`
  <div class="top"><h1><span class="tape" aria-hidden="true"></span>안전 징검다리</h1>
    <div class="small"><button class="btn" id="skip">문제 넘기기</button><button class="btn" id="rs">처음부터</button></div></div>
  <div class="river">${lane(0)}${lane(1)}</div>
  <div class="qcard">
    <div class="qmeta"><span class="turnTag" style="background:${T[S.turn].c}">${T[S.turn].n} 차례</span><span>맞히면 한 칸 앞으로 · 틀리면 "아차!" 한 칸 뒤로</span></div>
    <p class="q">${Q.q}</p>
    <div class="opts">${Q.o.map((o,i)=>`<button class="opt ${answered!==null?(i===Q.a?'right':(i===answered?'wrong':'')):''}" data-i="${i}" ${answered!==null?'disabled':''}><span class="k">${keys[i]}</span><span>${o}</span></button>`).join('')}</div>
    ${answered!==null?`<p class="exp">${answered===Q.a?'<b class="ok">정답! 한 칸 전진 👣</b>':'<b class="bad">아차! 한 칸 뒤로 💦</b>'} ${Q.e}</p><button class="next" id="nx">다음 팀 ▶</button>`:''}
  </div>
  <p class="foot">진행: 차례인 팀이 상의해 답을 외치면 강사가 누릅니다. 먼저 "안전 현장"에 도착한 팀 승리. 문제는 오늘 4교시 화면 내용에서만 나옵니다.</p>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  const nx=document.getElementById('nx'); if(nx){nx.onclick=next;nx.focus();}
  document.getElementById('rs').onclick=reset;
  document.getElementById('skip').onclick=()=>{qi++;answered=null;draw()};
}
function pick(i){
  if(answered!==null) return;
  const Q=QS[order[qi%order.length]]; answered=i;
  if(i===Q.a){S.pos[S.turn]++;S.score[S.turn]++;}else{S.pos[S.turn]=Math.max(0,S.pos[S.turn]-1);}
  draw();
  if(S.pos[S.turn]>N) setTimeout(win,900);
}
function next(){qi++;answered=null;S.turn=1-S.turn;if(qi%order.length===0)order=shuffle(order);draw()}
function win(){
  const t=T[S.turn];
  const o=document.createElement('div');o.className='over';
  o.innerHTML=`<div class="card" role="dialog" aria-modal="true"><h2 style="color:${t.c}">${t.e} ${t.n} 안전 현장 도착!</h2>
   <p>오늘의 한 줄: <b>"안전은 속도를 줄이는 게 아니라 가장 빠른 길"</b>. 틀려서 뒤로 간 "아차"가 바로 아차사고예요. 기록하고 다시 가면 결국 건넙니다.</p>
   <p>🙋 마무리 질문: 현장실습 첫날, 작업 전 30초 동안 꼭 확인할 것 하나는?</p>
   <button class="next" id="again">한 판 더</button></div>`;
  document.body.appendChild(o);o.querySelector('#again').onclick=()=>{o.remove();reset()};
}
reset();
})();
</script>
