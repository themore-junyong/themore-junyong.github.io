<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>위듀케이션 취업 연구소 · 강의 모드</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="font.css"><style>
/* 강의 모드: PPT(PDF·그림)를 웹에서 넘기다가, 정해 둔 자리에서 취업 연구소 도구를 같은 화면에 열고 다시 슬라이드로 돌아옴.
   한 브라우저 전체화면 안에서 다 일어나서 Alt+Tab이 필요 없음. 리모컨(PageDown/PageUp)·화살표·마우스로 넘김 */
:root{
  --bg:#f6f6f6; --ink:#333; --soft:#6f7480; --card:#fff; --line:#e2e3e8; --field:#fbfbfc;
  --blue:#4e6bf1; --blue-ink:#fff; --blue-soft:#e9edfe; --ok:#2e8b4c; --bad:#c8432f; --tool:#f2a93b;
  --f:"SCDream","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642; --field:#1a1d23;
  --blue:#7c93ff; --blue-ink:#10121a; --blue-soft:#262d4a; --ok:#5cc47c; --bad:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642; --field:#1a1d23;
  --blue:#7c93ff; --blue-ink:#10121a; --blue-soft:#262d4a; --ok:#5cc47c; --bad:#ff7a63; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 60px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;line-height:1.3} h1{font-size:1.6rem;font-weight:900} h3{font-size:1.1rem}
p{margin:0} .soft{color:var(--soft)} .note{font-size:.88rem;color:var(--soft)} .bad{color:var(--bad)}
button,input{font:inherit;color:inherit} button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top a{color:var(--blue);font-weight:700;text-decoration:none}
.brand small{letter-spacing:.12em;font-weight:700;color:var(--blue);font-size:.78rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:10px 16px;font-weight:700;color:var(--ink)}
.btn.pri{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn.big{font-size:1.2rem;padding:14px 28px}
.btn.sm{padding:5px 10px;font-size:.88rem}
.drop{border:2px dashed var(--line);border-radius:8px;padding:26px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--field);cursor:pointer}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop b{font-size:1.15rem}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:2px}
.decks{display:flex;flex-direction:column;gap:8px}
.deck{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.deck[data-on]{border-color:var(--blue);background:var(--blue-soft)}
.roomline{border-radius:6px;padding:10px 14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.roomline.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ink)}
.roomline.no{background:var(--field);border:1px solid var(--line)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.sc{display:flex;flex-direction:column;gap:6px;min-width:0}
.th{position:relative;aspect-ratio:16/9;background:#111;border-radius:4px;overflow:hidden;border:1px solid var(--line);cursor:pointer}
.th img{width:100%;height:100%;object-fit:contain;display:block}
.th .no{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.7);color:#fff;font-weight:800;font-size:.8rem;padding:1px 8px;border-radius:999px}
.tc{aspect-ratio:16/9;border-radius:4px;border:2px solid var(--tool);background:color-mix(in srgb,var(--tool) 16%,var(--card));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center;box-sizing:border-box}
.tc b{font-size:.98rem;line-height:1.3;word-break:keep-all}
.tc .row{gap:4px;justify-content:center}
.add{border:1px dashed var(--line);background:none;border-radius:4px;padding:5px;font-weight:700;color:var(--soft);font-size:.86rem}
.add:hover{border-color:var(--tool);color:var(--ink)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.keys kbd{font-family:inherit;font-weight:800;background:var(--field);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 6px;white-space:nowrap}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:700}
.chk input{width:20px;height:20px;margin-top:3px}
/* 도구 고르기 창 */
#pick{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#pick[hidden]{display:none}
#pick .box{background:var(--card);color:var(--ink);border-radius:10px;width:min(760px,100%);max-height:88vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.pi{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:10px 12px}
.pi:hover{border-color:var(--blue)} .pi span{color:var(--soft);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem}
.chips button:hover{border-color:var(--blue)}
.glabel{font-weight:800;color:var(--soft);font-size:.92rem}
input.w{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--field);border-radius:4px;padding:10px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:200;background:#2e8b4c;color:#fff;font:700 15px var(--f);padding:10px 18px;border-radius:999px;max-width:90vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none;transition:opacity .3s;opacity:0}
#toast.on{opacity:1} #toast.bad{background:#c8432f}

/* 발표 화면 */
#show{position:fixed;inset:0;z-index:100;background:#000;display:none;overflow:hidden}
#show.on{display:block}
#show.idle{cursor:none}
#show .sl{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;visibility:hidden}
#show .sl.on{visibility:visible}
#show iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
#show iframe.on{display:block}
#wait{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#aaa;font:700 20px var(--f)}
#wait.on{display:flex}
#cover{position:absolute;inset:0;z-index:5;display:none}
#cover.b{display:block;background:#000} #cover.w{display:block;background:#fff}
#qrp{position:absolute;inset:0;background:#fff;color:#222;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;font-family:var(--f)}
#qrp.on{display:flex}
#qrp h2{font-size:clamp(1.4rem,4vw,2.8rem);font-weight:900}
#qrp .p{font-size:clamp(2rem,6vw,4.2rem);font-weight:900;color:#4e6bf1;letter-spacing:.1em}
#qrb{width:min(56vh,80vw);height:min(56vh,80vw)} #qrb img,#qrb canvas{width:100%!important;height:100%!important}
#bar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:8;display:flex;gap:2px;align-items:center;background:rgba(20,22,28,.88);color:#fff;border-radius:999px;padding:5px 6px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 24px);overflow-x:auto}
#show.ui #bar{opacity:1;pointer-events:auto}
#bar button{background:none;border:0;color:#fff;font:700 15px var(--f);padding:8px 12px;border-radius:999px}
#bar button:hover{background:rgba(255,255,255,.16)}
#bar .lab{padding:0 10px;font:800 15px var(--f);font-variant-numeric:tabular-nums}
#pill{position:absolute;left:12px;top:12px;z-index:7;background:rgba(20,22,28,.86);color:#fff;font:700 14px var(--f);padding:7px 14px;border-radius:999px;opacity:0;transition:opacity .4s;pointer-events:none}
#pill.on{opacity:1}
#ext{position:absolute;right:12px;top:12px;z-index:7;display:none;background:rgba(20,22,28,.86);color:#fff;font:700 14px var(--f);padding:7px 14px;border-radius:999px;text-decoration:none}
#ext.on{display:block}
#jump{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;background:rgba(20,22,28,.9);color:#fff;border-radius:14px;padding:18px 34px;text-align:center;font-family:var(--f);display:none}
#jump.on{display:block} #jump b{display:block;font-size:4rem;line-height:1.1;font-variant-numeric:tabular-nums}
#ov{position:absolute;inset:0;z-index:10;background:rgba(10,12,16,.95);overflow:auto;padding:24px;display:none;box-sizing:border-box}
#ov.on{display:block}
#ov .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;max-width:1500px;margin:0 auto}
#ov .it{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#222;border:3px solid transparent;cursor:pointer;color:#fff;padding:0}
#ov .it.cur{border-color:#7c93ff}
#ov .it img{width:100%;height:100%;object-fit:contain;display:block}
#ov .it .no{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.7);font-weight:800;font-size:.8rem;padding:1px 8px;border-radius:999px}
#ov .it.t{background:#4a3a1a;border-color:#f2a93b;display:flex;align-items:center;justify-content:center;font:800 1rem var(--f);text-align:center;padding:8px}
#ov .it.t.cur{border-color:#7c93ff}
#ov h2{color:#fff;font-family:var(--f);text-align:center;margin-bottom:14px;font-size:1.2rem}
</style>
</head><body>
<div class="wrap" id="app"><p class="soft">불러오는 중…</p></div>

<div id="pick" hidden role="dialog" aria-modal="true" aria-label="도구 끼우기"><div class="box" id="pickBox"></div></div>

<div id="show" aria-label="강의 화면">
  <img class="sl" id="slA" alt=""><img class="sl" id="slB" alt="">
  <div id="frames"></div>
  <div id="qrp"><h2>📱 휴대폰 카메라로 찍고 들어오세요</h2><div class="p" id="qrPin"></div><div id="qrb"></div><div id="qrU" style="font-weight:700"></div></div>
  <div id="wait">슬라이드 준비 중…</div>
  <div id="cover"></div>

  <a id="ext" href="#" target="_blank" rel="noopener">↗ 새 탭으로 열기</a>

  <div id="ov"></div>
  <div id="bar" role="toolbar" aria-label="강의 화면 조작">
    <button data-c="prev" title="이전 (← · PageUp)">◀</button><span class="lab" id="lab"></span><button data-c="next" title="다음 (→ · PageDown)">▶</button>
    <button data-c="grid" title="전체 보기 (G)">⊞ 전체</button><button data-c="black" title="화면 끄기 (B)">■ 화면 끄기</button>
    <button data-c="fs" title="전체화면 (F)">⛶</button><button data-c="end" title="끝내기 (Esc)">✕ 끝내기</button>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
'use strict';
const V='10.12.2', G='https://www.gstatic.com/firebasejs/'+V;
const SITE='https://themore-junyong.github.io/tools/';
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const $=id=>document.getElementById(id);
const app=$('app'), show=$('show');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lsGet=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';

/* 끼울 수 있는 도구 (teacher.html 활동 목록과 같은 묶음)
   q: 학생 도구(같은 화면에 강사 미리보기 + 학생 화면도 그 도구로) · live: 마인드맵 진행 화면 · b: 빔 게임(학생 폰은 play.html) */
const GROUPS=[
 ['자소서 · 면접 준비',[
  ['q','#jaso','📝 AI 자소서 만들기','8단계 질문 → AI 초안 5항목'],
  ['q','interview.html','🎤 AI 모의면접','질문 → 피드백 → 꼬리질문'],
  ['q','color.html','🎨 퍼스널컬러 진단','옷 색 · 립 색'],
  ['q','intro.html','🗣 1분 자기소개 꼬꼬무','질문에 답하면 1분 멘트']]],
 ['수업 게임 · 참여',[
  ['live','live.html','📊 실시간 마인드맵 · 투표','진행 화면 · 학생은 폰으로 답하기'],
  ['b','icebreak.html','🎲 아이스브레이킹','밸런스 · 초성 · 이모지 · 몸으로 말해요'],
  ['b','river.html','🚣 문제해결 강건너기','3단계 퍼즐'],
  ['b','line.html','🔢 스트림 게임','숫자 줄 세우기'],
  ['b','class.html','👥 교실 도구','팀 나누기 · 한 명 뽑기 · 타이머']]],
 ['나를 알아보는 검사',[
  ['q','test.html','🧭 검사 목록 (학생이 고르기)','자가진단 검사 전체'],
  ['q','health.html','💪 생활습관 점검','33문항 → 약점 2곳']]],
 ['비즈니스',[
  ['q','sme.html','🏭 중소기업 이해','오해 깨기 O/X 10문제'],
  ['q','company.html','🔎 좋은 회사 찾기','조건 경매 → 기업 탐정 보고서'],
  ['q','manner.html','🤝 비즈니스 매너','첫 출근 상황 퀴즈 13문제']]],
 ['AI 수업',[
  ['q','ai.html','🤖 AI 수업 도구 6종','프롬프트 연습장 · AI 거짓말 찾기 등']]]
];
const TST=[['riasec','직업흥미'],['big5','Big Five 성격'],['enneagram','에니어그램'],['values','직업가치관'],['strength','강점 24'],['conflict','갈등 대처'],['resil','회복탄력성'],['coping','스트레스 대처'],['mindset','성장 마인드셋'],['literacy','직장 문해력'],['mbti','MBTI형 16유형'],['animal','DISC 행동유형'],['teamrole','팀 역할'],['eq','감성지능 EQ'],['attach','관계 애착'],['appreciate','인정의 언어'],['selfesteem','자존감'],['grit','그릿(끈기)'],['burnout','번아웃'],['stressidx','스트레스 지수'],['study','공부 스타일'],['timetype','시간 관리']];

/* ── 이 노트북에 슬라이드 저장 (IndexedDB tm-slides) : 인터넷에 올리지 않음 ── */
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('tm-slides',1);r.onupgradeneeded=()=>r.result.createObjectStore('decks',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function tx(mode,fn){return idb().then(db=>new Promise((ok,no)=>{const t=db.transaction('decks',mode),r=fn(t.objectStore('decks'));let out;if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>ok(out);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error||new Error('저장 공간이 모자라요'))}))}
const dbAll=()=>tx('readonly',s=>s.getAll()), dbPut=d=>tx('readwrite',s=>s.put(d)), dbDel=id=>tx('readwrite',s=>s.delete(id));

const S={decks:[],deck:null,n:0,pdf:null,imgs:null,thumbs:{},full:{},seq:[],pos:0,showing:false,pickAt:null,cover:'',jump:'',frames:{},grid:false,follow:lsGet('tm-slides-follow',true)};
const R={ok:false,pin:'',st:'',F:null,db:null,hbT:null};

/* ── 수업 방 연결: teacher.html에서 이 노트북으로 만든 방(live-host)이 살아 있으면, 도구 차례에 학생 화면도 바꿈 ── */
function roomBoot(){
  const h=lsGet('live-host',null);if(!h||!h.pin){R.ok=false;R.st='none';return Promise.resolve()}
  return Promise.all([import('./firebase-config.js'),import(G+'/firebase-app.js'),import(G+'/firebase-auth.js'),import(G+'/firebase-firestore.js')]).then(m=>{
    const a=m[1].getApps().filter(x=>x.name==='[DEFAULT]')[0]||m[1].initializeApp(m[0].firebaseConfig),auth=m[2].getAuth(a);
    return auth.authStateReady().then(()=>auth.currentUser||m[2].signInAnonymously(auth)).then(()=>{
      const F=m[3],db=F.getFirestore(a);return F.getDoc(F.doc(db,'rooms',h.pin)).then(d=>{const r=d.exists()?d.data():null;
        if(r&&r.owner===auth.currentUser.uid&&!r.closed&&r.exp&&r.exp.toMillis()>Date.now()){R.ok=true;R.pin=h.pin;R.F=F;R.db=db;R.st='';beat();clearInterval(R.hbT);R.hbT=setInterval(beat,60e3)}
        else{R.ok=false;R.st='old'}})})
  }).catch(()=>{R.ok=false;R.st='err'});
}
function beat(){if(R.ok)R.F.updateDoc(R.F.doc(R.db,'rooms',R.pin),{hb:R.F.serverTimestamp()}).catch(()=>{})}
function pushGo(to,name){
  if(!R.ok||!S.follow||!to)return;
  R.F.updateDoc(R.F.doc(R.db,'rooms',R.pin),{go:{to:to,t:R.F.serverTimestamp()}}).then(()=>toast('✔ 학생 화면도 「'+name+'」(으)로 바꿨어요'),()=>toast('학생 화면은 바꾸지 못했어요 (방이 끝났을 수 있어요)',true));
}

let tT=null;
function toast(t,bad){const d=$('toast');d.textContent=t;d.className='on'+(bad?' bad':'');clearTimeout(tT);tT=setTimeout(()=>{d.className=bad?'bad':''},2600)}

/* ── 슬라이드 그리기: PDF는 pdf.js로 화면 크기에 맞춰 그림으로, 그림 파일은 그대로 ── */
let fullQ=Promise.resolve(), thumbQ=Promise.resolve();
function renderPdf(i,w,h,qual){
  return S.pdf.getPage(i+1).then(pg=>{const v=pg.getViewport({scale:1}),sc=Math.min(w/v.width,h/v.height),vp=pg.getViewport({scale:sc});
    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
    return pg.render({canvasContext:ctx,viewport:vp}).promise.then(()=>new Promise(ok=>c.toBlob(b=>ok(URL.createObjectURL(b)),'image/jpeg',qual)))});
}
function full(i){
  if(S.full[i])return S.full[i];
  if(S.imgs)return S.full[i]=Promise.resolve(S.imgs[i]);
  const d=window.devicePixelRatio||1,w=Math.min(3840,Math.round(Math.max(screen.width,innerWidth)*d)),h=Math.min(2400,Math.round(Math.max(screen.height,innerHeight)*d));
  const p=fullQ.then(()=>renderPdf(i,w,h,.92));fullQ=p.catch(()=>{});S.full[i]=p;p.catch(()=>{delete S.full[i]});return p;
}
function thumb(i){
  if(S.thumbs[i])return Promise.resolve(S.thumbs[i]);
  if(S.imgs){S.thumbs[i]=S.imgs[i];return Promise.resolve(S.imgs[i])}
  const p=thumbQ.then(()=>S.thumbs[i]||renderPdf(i,400,400,.8).then(u=>S.thumbs[i]=u));thumbQ=p.catch(()=>{});return p;
}
function fillThumbs(){document.querySelectorAll('img[data-th]').forEach(im=>{const i=+im.dataset.th;if(im.getAttribute('src'))return;const d=S.deck;thumb(i).then(u=>{if(S.deck===d)im.src=u}).catch(()=>{})})}

/* ── 슬라이드 묶음 열기·닫기 ── */
function closeDeck(){
  Object.values(S.full).forEach(p=>p.then(u=>{if(!S.imgs)URL.revokeObjectURL(u)}).catch(()=>{}));
  Object.values(S.thumbs).forEach(u=>{if(!S.imgs)try{URL.revokeObjectURL(u)}catch(e){}});
  if(S.imgs)S.imgs.forEach(u=>URL.revokeObjectURL(u));
  if(S.pdf)try{S.pdf.destroy()}catch(e){}
  S.deck=null;S.pdf=null;S.imgs=null;S.full={};S.thumbs={};S.n=0;S.seq=[];
}
function openDeck(d){
  closeDeck();S.deck=d;render();
  if(d.kind==='img'){S.imgs=d.imgs.map(b=>URL.createObjectURL(b));S.n=S.imgs.length;return afterOpen()}
  if(!window.pdfjsLib){toast('PDF 보기 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로 고침해 주세요',true);return Promise.resolve()}
  return d.pdf.arrayBuffer().then(buf=>pdfjsLib.getDocument({data:buf,cMapUrl:PDFJS+'cmaps/',cMapPacked:true,standardFontDataUrl:PDFJS+'standard_fonts/'}).promise)
    .then(pdf=>{if(S.deck!==d){pdf.destroy();return}S.pdf=pdf;S.n=pdf.numPages;return afterOpen()})
    .catch(e=>{toast('PDF를 열지 못했어요: '+(e&&e.message||e),true);closeDeck();render()});
}
function afterOpen(){const d=S.deck;if(d.n!==S.n){d.n=S.n;dbPut(d).catch(()=>{})}lsSet('tm-slides-last',d.id);buildSeq();render()}
function buildSeq(){
  const c=(S.deck&&S.deck.cues||[]).slice().sort((a,b)=>a.after-b.after),q=[];
  c.filter(x=>x.after<0).forEach(x=>q.push({t:x}));
  for(let i=0;i<S.n;i++){q.push({s:i});c.filter(x=>x.after===i).forEach(x=>q.push({t:x}))}
  c.filter(x=>x.after>=S.n).forEach(x=>q.push({t:x}));
  S.seq=q;
}
function saveDeck(){if(S.deck)return dbPut(S.deck).catch(e=>toast('저장하지 못했어요: '+(e&&e.message||e),true))}
function addFiles(list){
  const files=Array.from(list||[]);if(!files.length)return;
  const pdf=files.filter(f=>/\.pdf$/i.test(f.name)||f.type==='application/pdf')[0];let d;
  if(pdf)d={id:uid(),name:pdf.name.replace(/\.pdf$/i,''),t:Date.now(),kind:'pdf',pdf:pdf,cues:[],pos:0};
  else{const im=files.filter(f=>/^image\//.test(f.type)).sort((a,b)=>a.name.localeCompare(b.name,'ko',{numeric:true}));
    if(!im.length){toast('PDF 파일이나 그림 파일(PNG·JPG)을 넣어 주세요',true);return}
    d={id:uid(),name:'그림 슬라이드 '+new Date().toLocaleDateString('ko-KR'),t:Date.now(),kind:'img',imgs:im,cues:[],pos:0}}
  dbPut(d).then(()=>loadList()).then(()=>openDeck(d)).then(()=>toast('✔ 불러왔어요. 이제 슬라이드 사이에 도구를 끼워 보세요'))
    .catch(e=>toast('저장하지 못했어요: '+(e&&e.message||e),true));
}
function deckById(id){return S.deck&&S.deck.id===id?S.deck:S.decks.filter(x=>x.id===id)[0]}
function loadList(){return dbAll().then(a=>{S.decks=(a||[]).sort((x,y)=>y.t-x.t)}).catch(()=>{S.decks=[]})}

function cueFrame(c){

}

/* ── 발표 ── */
let front=$('slA'),back=$('slB'),posT=null;
function cur(){return S.seq[S.pos]||{}}
function start(p){
  if(!S.deck||!S.n)return;buildSeq();S.showing=true;show.classList.add('on');document.body.style.overflow='hidden';
  fs(true);S.pos=-1;go(Math.max(0,Math.min(p,S.seq.length-1)));ui();
  setTimeout(prefetchAll,1500);
}
function end(){
  S.showing=false;show.classList.remove('on','ui','idle');document.body.style.overflow='';setCover('');closeGrid();
  Object.keys(S.frames).forEach(k=>{S.frames[k].remove();delete S.frames[k]});
  $('qrp').classList.remove('on');front.classList.remove('on');back.classList.remove('on');
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  if(S.deck){S.deck.pos=S.pos;saveDeck()}render();
}
function fs(on){
  if(on&&!document.fullscreenElement){const el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen().catch(()=>{})}
  else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});
}
function next(){if(S.cover){setCover('');return}if(S.pos<S.seq.length-1)go(S.pos+1);else pill('마지막 장이에요',2000)}
function prev(){if(S.cover){setCover('');return}if(S.pos>0)go(S.pos-1)}
function goSlide(n){const p=S.seq.findIndex(x=>x.s===n-1);if(p>=0)go(p);else pill(n+'번 슬라이드는 없어요',2000)}
function go(p){
  p=Math.max(0,Math.min(S.seq.length-1,p));const was=S.seq[S.pos],it=S.seq[p];S.pos=p;
  if(was&&was.t&&was!==it)leaveTool(was.t);
  if(it.s!=null){
    hideTools();const want=p;$('wait').classList.toggle('on',!S.full[it.s]);
    full(it.s).then(u=>{if(S.pos!==want||!S.showing)return;back.src=u;return (back.decode?back.decode():Promise.resolve()).catch(()=>{}).then(()=>{if(S.pos!==want)return;
      back.classList.add('on');front.classList.remove('on');const x=front;front=back;back=x;$('wait').classList.remove('on')})}).catch(()=>{$('wait').textContent='이 슬라이드를 그리지 못했어요';});
    [1,2,-1].forEach(o=>{const q=S.seq[p+o];if(q&&q.s!=null)full(q.s)});
    try{window.focus()}catch(e){}
  }else enterTool(it.t);
  label();if(S.grid)drawGrid();
  clearTimeout(posT);posT=setTimeout(()=>{if(S.deck){S.deck.pos=S.pos;saveDeck()}},1500);
}
function prefetchAll(){if(!S.showing||S.imgs)return;let i=0;const step=()=>{if(!S.showing||!S.pdf||i>=S.n)return;const k=i++;(S.full[k]||full(k)).then(()=>setTimeout(step,30),()=>setTimeout(step,30))};step()}
function hideTools(){Object.values(S.frames).forEach(f=>f.classList.remove('on'));$('qrp').classList.remove('on');$('ext').classList.remove('on')}
function enterTool(c){
  hideTools();front.classList.remove('on');$('wait').classList.remove('on');
  if(c.k==='qr'){drawQR();$('qrp').classList.add('on');pill('📱 학생 입장 QR',3000);return}
  let f=S.frames[c.id];
  if(!f){f=document.createElement('iframe');f.src=cueFrame(c);f.title=c.name;
    f.setAttribute('allow','autoplay; fullscreen; camera; microphone; clipboard-read; clipboard-write; encrypted-media; picture-in-picture');f.setAttribute('allowfullscreen','');
    f.addEventListener('load',()=>hookFrame(f));$('frames').appendChild(f);S.frames[c.id]=f}
  f.classList.add('on');
  if(c.k==='url'){const x=$('ext');x.href=c.raw||c.to;x.classList.add('on')}
  pill('🧩 '+c.name+' · 다음 슬라이드: 리모컨 ▶ (PageDown)',4500);
  const to=cueGo(c);if(to)pushGo(to,c.name);
}
function leaveTool(c){const f=S.frames[c.id];if(!f)return;if(c.k==='url'){f.remove();delete S.frames[c.id]}else f.classList.remove('on')}
/* 도구(같은 주소라 들여다볼 수 있음) 안에서 누른 리모컨 키도 받기. 도구 안에서 다른 화면으로 넘어가도 load마다 다시 붙임 */
function hookFrame(f){try{const w=f.contentWindow;if(!w||w.__tmHook)return;w.__tmHook=1;
  w.addEventListener('keydown',e=>onKey(e,true),true);
  w.addEventListener('mousemove',e=>{if(e.clientY>w.innerHeight-90)ui();},{passive:true})}catch(e){}}
function label(){const it=cur();$('lab').textContent=it.t?'🧩 '+it.t.name:'슬라이드 '+(it.s+1)+' / '+S.n}
let pT=null;function pill(t,ms){const p=$('pill');p.textContent=t;p.classList.add('on');clearTimeout(pT);pT=setTimeout(()=>p.classList.remove('on'),ms||3000)}
function setCover(k){S.cover=S.cover===k?'':k;$('cover').className=S.cover}
function drawQR(){
  const b=$('qrb');b.innerHTML='';
  if(!R.ok){$('qrPin').textContent='';$('qrU').textContent='아직 연결된 수업 방이 없어요. 선생님 화면에서 방을 먼저 만들어 주세요.';return}
  const u=SITE+'?r='+R.pin;$('qrPin').textContent='방 번호 '+R.pin;$('qrU').textContent=u.replace('https://','');
  if(window.QRCode)new QRCode(b,{text:u,width:600,height:600,correctLevel:QRCode.CorrectLevel.M});else b.textContent='QR을 불러오지 못했어요. 위 주소를 칠판에 적어 주세요.';
}
function drawGrid(){
  const o=$('ov');
  o.innerHTML='<h2>가고 싶은 곳을 누르세요 · Esc 닫기</h2><div class="g">'+S.seq.map((it,p)=>it.t?'<button class="it t'+(p===S.pos?' cur':'')+'" data-p="'+p+'">🧩 '+esc(it.t.name)+'</button>':
    '<button class="it'+(p===S.pos?' cur':'')+'" data-p="'+p+'"><img data-th="'+it.s+'"'+(S.thumbs[it.s]?' src="'+S.thumbs[it.s]+'"':'')+' alt=""><span class="no">'+(it.s+1)+'</span></button>').join('')+'</div>';
  o.querySelectorAll('img[data-th]').forEach(im=>{if(!im.getAttribute('src'))thumb(+im.dataset.th).then(u=>im.src=u).catch(()=>{})});
  const c=o.querySelector('.cur');if(c)c.scrollIntoView({block:'center'});
}
function openGrid(){S.grid=true;$('ov').classList.add('on');drawGrid()}
function closeGrid(){S.grid=false;$('ov').classList.remove('on')}
$('ov').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b){closeGrid();go(+b.dataset.p)}else closeGrid()});
function cmd(c,n){
  if(!S.showing)return false;
  if(c==='next')next();else if(c==='prev')prev();else if(c==='go')goSlide(n);else if(c==='black')setCover('b');else if(c==='white')setCover('w');
  else if(c==='grid')S.grid?closeGrid():openGrid();else if(c==='fs')fs(!document.fullscreenElement);else if(c==='end')end();else return false;
  return true;
}
$('bar').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b){cmd(b.dataset.c);b.blur()}});

/* 키보드·리모컨 */
let jT=null;
function onKey(e,inFrame){
  if(!S.showing)return;
  const k=e.key,t=e.target||{},typing=/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName||'')||t.isContentEditable;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(k==='F5'){e.preventDefault();fs(true);return}
  if(k==='PageDown'){e.preventDefault();next();return}
  if(k==='PageUp'){e.preventDefault();prev();return}
  if(inFrame||typing)return; // 도구 안에서는 리모컨 두 키만 가로챔(나머지 키는 도구가 씀)
  if(/^[0-9]$/.test(k)){S.jump=(S.jump+k).slice(-3);$('jumpN').textContent=S.jump;$('jump').classList.add('on');clearTimeout(jT);jT=setTimeout(clearJump,4000);e.preventDefault();return}
  if(S.jump&&k==='Enter'){e.preventDefault();const n=+S.jump;clearJump();goSlide(n);return}
  if(S.jump&&k==='Backspace'){e.preventDefault();S.jump=S.jump.slice(0,-1);$('jumpN').textContent=S.jump;if(!S.jump)clearJump();return}
  if(S.jump&&k==='Escape'){clearJump();return}
  const K=k.length===1?k.toLowerCase():k;
  if(['ArrowRight','ArrowDown',' ','Enter','n'].indexOf(K)>=0){e.preventDefault();if(S.grid)return;next();return}
  if(['ArrowLeft','ArrowUp','Backspace','p'].indexOf(K)>=0){e.preventDefault();if(S.grid)return;prev();return}
  if(K==='b'||K==='.'){setCover('b');return}
  if(K==='w'||K===','){setCover('w');return}
  if(K==='g'){S.grid?closeGrid():openGrid();return}
  if(K==='f'){fs(!document.fullscreenElement);return}
  if(K==='Home'){e.preventDefault();go(0);return}
  if(K==='End'){e.preventDefault();go(S.seq.length-1);return}
  if(K==='Escape'){if(S.grid)closeGrid();else if(S.cover)setCover('');else if(!document.fullscreenElement)end();return}
}
function clearJump(){S.jump='';$('jump').classList.remove('on')}
document.addEventListener('keydown',e=>onKey(e,false));
/* 마우스: 슬라이드를 누르면 다음, 오른쪽 버튼은 이전, 휠로도 넘김. 움직이면 아래 버튼 줄이 잠깐 나옴 */
let uT=null;function ui(){show.classList.add('ui');show.classList.remove('idle');clearTimeout(uT);uT=setTimeout(()=>{show.classList.remove('ui');if(!cur().t)show.classList.add('idle')},2500)}
show.addEventListener('mousemove',ui,{passive:true});
show.addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('sl')||e.target.id==='cover'||e.target.id==='wait')next()});
show.addEventListener('contextmenu',e=>{if(e.target.classList&&e.target.classList.contains('sl')){e.preventDefault();prev()}});
let wT=0;show.addEventListener('wheel',e=>{if(cur().t||S.grid)return;const now=Date.now();if(now-wT<400)return;wT=now;if(e.deltaY>0)next();else if(e.deltaY<0)prev()},{passive:true});
document.addEventListener('fullscreenchange',()=>{if(S.showing&&!document.fullscreenElement)pill('전체화면이 풀렸어요 · F 다시 전체화면 · Esc 끝내기',3500)});

/* 나중에 음성·AI 안경·폰 리모컨을 붙일 자리: 같은 노트북의 다른 탭/창에서 명령을 보냄
   BroadcastChannel('tm-slides') 또는 postMessage({tm:'slides',c:'next'|'prev'|'go'|'black'|'white'|'grid'|'end',n}) */
window.TM_SLIDES={cmd:cmd,next:()=>cmd('next'),prev:()=>cmd('prev'),go:n=>cmd('go',n),state:()=>({showing:S.showing,pos:S.pos,total:S.seq.length,now:seqLabel(S.pos)})};
const onMsg=d=>{if(d&&d.tm==='slides'&&typeof d.c==='string')cmd(d.c,+d.n||0)};
window.addEventListener('message',e=>{if(e.origin===location.origin)onMsg(e.data)});
try{new BroadcastChannel('tm-slides').onmessage=e=>onMsg(e.data)}catch(e){}

/* 방이 나중에 생기면(선생님 화면에서 만들고 돌아오면) 다시 확인 */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!R.ok&&!S.showing)roomBoot().then(render)});

loadList().then(()=>{render();const last=lsGet('tm-slides-last','');const d=S.decks.filter(x=>x.id===last)[0];if(d)openDeck(d)}).catch(()=>render());
roomBoot().then(render);
})();
</script>
</body></html>
