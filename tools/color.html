<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>퍼스널컬러 진단</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 휴대폰 우선. 위 = 단계 막대, 가운데 = 지금 단계 카드, 아래 = 이전/다음 고정 바.
   사진은 이 휴대폰 화면 안에서만 쓰고 저장·전송하지 않는다. */
:root{
  --bg:#f6f6f6; --ink:#333; --soft:#6f7480; --card:#fff; --line:#e2e3e8; --field:#fbfbfc;
  --blue:#4e6bf1; --blue-ink:#fff; --blue-soft:#e9edfe; --ok:#2e8b4c; --bad:#c8432f;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642; --field:#1a1d23;
  --blue:#7c93ff; --blue-ink:#10121a; --blue-soft:#262d4a; --ok:#5cc47c; --bad:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642; --field:#1a1d23;
  --blue:#7c93ff; --blue-ink:#10121a; --blue-soft:#262d4a; --ok:#5cc47c; --bad:#ff7a63; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.75rem;font-weight:900}
h2{font-size:1.35rem;font-weight:900}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.soft{color:var(--soft)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top a{color:var(--blue);font-weight:700;text-decoration:none}
.brand small{letter-spacing:.12em;font-weight:700;color:var(--blue);font-size:.78rem}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.steps i{height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--blue)}
.stephead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.stephead .no{font-weight:700;color:var(--blue);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.why{background:var(--blue-soft);border-radius:4px;padding:12px 14px;font-size:.95rem}
.why b{color:var(--blue)}
.note{font-size:.9rem;color:var(--soft)}
.note.bad{color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:10px 16px;font-weight:700}
.btn.pri{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.checks{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.checks label{display:flex;gap:10px;align-items:flex-start}
.checks input{width:20px;height:20px;margin-top:3px;flex:none}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-weight:700}
.f input{border:1px solid var(--line);background:var(--field);border-radius:4px;padding:10px 12px}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--field);padding:10px 4px;font-size:.95rem}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink);font-weight:700}

/* 촬영·드레이핑 */
.stage{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:3/4;background:#111;border-radius:6px;overflow:hidden}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage video{transform:scaleX(-1)}
.stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;font-weight:900;border-radius:4px;padding:4px 10px;font-size:.95rem}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab button{border:2px solid var(--line);background:var(--field);border-radius:6px;padding:10px;display:flex;align-items:center;gap:10px;text-align:left}
.ab button[aria-pressed="true"]{border-color:var(--blue)}
.sw{width:28px;height:28px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.pick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pick button{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:12px 4px;font-weight:700}
.look{font-size:.92rem;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.look b{color:var(--blue)}
.meter{display:flex;flex-direction:column;gap:4px}
.meter .row{display:flex;justify-content:space-between;font-size:.85rem;color:var(--soft)}
.meter .track{position:relative;height:10px;border-radius:5px;background:var(--line)}
.meter .dot{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid var(--card);transform:translateX(-50%)}

/* 진단서 */
.report{border:2px solid var(--ink);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:16px;background:var(--card)}
.report .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:10px;gap:8px;flex-wrap:wrap}
.type{font-size:2rem;font-weight:900;line-height:1.2}
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pal div{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--soft);text-align:center}
.pal i{display:block;aspect-ratio:1;border-radius:4px;border:1px solid rgba(0,0,0,.1)}
.pal.bad i{position:relative}
.pal.bad i::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 47%,var(--bad) 48%,var(--bad) 52%,transparent 53%)}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumbs figure{margin:0;display:flex;flex-direction:column;gap:4px;text-align:center;font-size:.85rem;font-weight:700}
.thumbs img{width:100%;border-radius:4px;aspect-ratio:3/4;object-fit:cover}
dl.dress{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin:0}
dl.dress dt{font-weight:700;color:var(--blue)}
dl.dress dd{margin:0}
.skin{display:flex;align-items:center;gap:12px}
.skin i{width:44px;height:44px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:8px;justify-content:space-between}
.bar .btn{flex:1;max-width:220px;padding:12px}
@media print{.bar,.noprint{display:none!important}body{background:#fff}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

function lab(r,g,b){
  function l(c){c/=255;return c>.04045?Math.pow((c+.055)/1.055,2.4):c/12.92}
  r=l(r);g=l(g);b=l(b);
  var X=(r*.4124+g*.3576+b*.1805)/.95047,Y=r*.2126+g*.7152+b*.0722,Z=(r*.0193+g*.1192+b*.9505)/1.08883;
  function f(t){return t>.008856?Math.cbrt(t):7.787*t+16/116}
  var L=116*f(Y)-16,A=500*(f(X)-f(Y)),B=200*(f(Y)-f(Z));
  return {L:L,a:A,b:B,h:Math.atan2(B,A)*180/Math.PI,C:Math.sqrt(A*A+B*B)};
}
function sample(px,py){
  var x=PH.getContext('2d'),r=Math.round(PH.width*.035),d=x.getImageData(Math.round(px-r),Math.round(py-r),r*2,r*2).data,n=0,R=0,G=0,B=0;

  if(!n)return null;return [R/n,G/n,B/n];
}

function step0(){
  return stepbar()+'<div class="card"><h2>진단 전 준비</h2><p class="soft">전문 진단실도 조명과 화장부터 맞춰요. 4가지 이상 체크하면 시작할 수 있어요.</p><ul class="checks">'+
   READY.map(function(t,i){return '<li><label><input type="checkbox" data-ready="'+i+'"'+(S.ready.indexOf(i)>=0?' checked':'')+'><span>'+t+'</span></label></li>'}).join('')+'</ul></div>';
}
function step1(){
  var h=stepbar()+'<div class="card"><h2>얼굴 촬영</h2><p class="soft">점선 타원 안에 얼굴을, 아래 점선에 어깨를 맞추고 정면을 봐 주세요. 무표정이 좋아요.</p>';
  if(S.cam)h+='<div class="stage"><video id="vid" autoplay playsinline muted></video>'+GUIDE+'</div><div class="btns"><button class="btn pri" data-go="shoot">📸 찍기</button></div>';
  else h+='<div class="stage" style="display:flex;align-items:center;justify-content:center;color:#fff">카메라 꺼짐</div><div class="btns"><button class="btn pri" data-go="cam">카메라 켜기</button></div>';
  if(note)h+='<p class="note bad">'+esc(note)+'</p>';
  return h+'<p class="note">카메라를 못 쓰면 <button class="btn" data-go="nocam" style="padding:4px 10px">문진만으로 진단</button> (정확도가 낮아져요)</p></div>';
}
function step2(){
  var h=stepbar()+'<div class="card"><h2>피부 측정</h2><p class="soft">두 원이 <b>양쪽 볼의 가장 환한 곳</b>에 있는지 보세요. 아니면 사진에서 볼을 눌러 원을 옮겨요(왼쪽 → 오른쪽 순서).</p><div class="stage"><canvas id="cv"></canvas></div>';
  if(S.skin){
    var s=S.skin, warm=s.h>=58;
    h+='<div class="skin"><i style="background:rgb('+s.rgb.join(',')+')"></i><div><b>측정한 피부색</b><br><span class="soft">밝기 L* '+s.L+' · 색상각 '+s.h+'° · 채도 '+s.C+'</span></div></div>'+
      '<div class="why">색상각이 클수록 <b>노란 기(웜)</b>, 작을수록 <b>붉은 기(쿨)</b>예요. 측정값은 <b>'+(warm?'노란 기 쪽':'붉은 기 쪽')+'</b>이에요. 조명 영향이 커서 최종 진단에는 '+(WP?'15%':'8%(흰 종이 보정 안 함)')+'만 반영해요.</div>';
  }else h+='<p class="note bad">측정이 안 됐어요. 볼 위치를 눌러 다시 재 보세요. 그래도 안 되면 "다음"으로 넘어가도 돼요(피부 측정 없이 진단).</p>';
  h+='<div class="look">📄 <b>조명 보정(선택)</b> · 찍을 때 흰 종이(A4)를 턱 아래나 옆에 들고 찍었다면, 아래 버튼을 누른 뒤 사진 속 종이를 눌러 주세요. 조명 색을 빼고 피부색을 더 정확히 재요. '+(WP?'<b style="color:var(--ok)">✔ 보정됨</b>':'')+'</div>';
  if(note)h+='<p class="note bad">'+esc(note)+'</p>';
  return h+'<div class="btns"><button class="btn" data-go="wp"'+(wpMode?' style="border-color:var(--blue);color:var(--blue)"':'')+'>'+(wpMode?'사진 속 흰 종이를 누르세요':'📄 흰 종이 찍기')+'</button><button class="btn" data-go="retake">다시 찍기</button></div></div>';
}
function drapeStep(){
  var R=disp(),n=S.step===3?S.r1.length:S.step===4?S.r2.length:S.r3.length,tot=S.step===3?5:3;
  var title=['','','','온도 진단 · 웜 vs 쿨','명도 진단 · 밝음 vs 깊음','채도 진단 · 선명 vs 부드러움'][S.step];
  var look=S.step===3?R.look:(S.step===4?R2L:R3L)[n];
  var h=stepbar()+'<div class="card"><div class="top"><h2>'+title+'</h2><span class="soft">'+(n+1)+' / '+tot+'</span></div>';
  if(PH){
    h+='<div class="stage"><canvas id="cv"></canvas><span class="tag" id="tg"></span></div>'+
     '<div class="ab">'+['a','b'].map(function(k){var c=R[k][1],bg=c===GOLD?'linear-gradient(135deg,#8a6a1f,#fff1b0,#c9a13a)':c===SILVER?'linear-gradient(135deg,#6f747c,#fff,#b0b6be)':c;
       return '<button data-ab="'+k+'" aria-pressed="'+(cur===k)+'"><span class="sw" style="background:'+bg+'"></span><span><b>천 '+k.toUpperCase()+'</b></span></button>'}).join('')+'</div>'+
     '<div class="btns"><button class="btn" data-go="flick">'+(flick?'⏸ 멈추기':'▶ 번갈아 보기')+'</button></div>';
  }else{
    h+='<div class="ab">'+['a','b'].map(function(k){var c=R[k][1];return '<div style="height:120px;border-radius:6px;border:1px solid var(--line);background:'+(c===GOLD?'linear-gradient(135deg,#8a6a1f,#fff1b0,#c9a13a)':c===SILVER?'linear-gradient(135deg,#6f747c,#fff,#b0b6be)':c)+';display:flex;align-items:flex-end;padding:8px;font-weight:700;color:#333;text-shadow:0 0 4px #fff">천 '+k.toUpperCase()+'</div>'}).join('')+'</div><p class="note">거울 앞에서 두 색 옷이나 종이를 얼굴 아래에 대 보고 골라 주세요.</p>';
  }
  h+='<div class="look">👀 <b>볼 곳</b> · '+look+'<br><span class="soft">천 이름은 선입견이 생기지 않게 숨겨 두었어요. 결과지에서 공개돼요.</span></div><div class="pick"><button data-pick="1">A가 낫다</button><button data-pick="0">비슷하다</button><button data-pick="-1">B가 낫다</button></div>';
  return h+'</div>';
}
function step6(){
  var h=stepbar()+'<div class="card"><h2>문진</h2><p class="soft">평소 모습을 떠올리며 골라 주세요. ('+S.qa.filter(function(v){return v!=null}).length+' / 10)</p>';
  QS.forEach(function(q,i){
    h+='<div class="f"><label>'+(i+1)+'. '+q[0]+'</label><div class="seg" style="flex-wrap:wrap">'+q[1].map(function(a,j){return '<button style="flex:1 1 45%" data-qa="'+i+'_'+j+'" aria-pressed="'+(S.qa[i]===j)+'">'+a[0]+'</button>'}).join('')+'</div></div>';
  });
  return h+'</div>';
}
function report(){
  var r=res,t=T[r.type],h=head();
  h+='<div class="report"><div class="hd"><div><small class="soft">PERSONAL COLOR REPORT</small><h2>퍼스널컬러 진단서</h2></div><div class="soft" style="text-align:right;font-size:.9rem">'+esc(r.nick||'')+'<br>'+r.date+'</div></div>'+
   '<div><span class="soft">진단 결과</span><div class="type">'+r.type+'</div><p><b>'+t.k+'</b> · 진단 일치도 '+r.conf+'%</p></div><p>'+t.d+'</p>'+
   '<div style="display:flex;flex-direction:column;gap:10px">'+meter(pct(r.T,'웜','쿨'),'웜(노란 기)','쿨(붉은·푸른 기)',r.T)+meter(pct(r.V,'라이트','딥'),'라이트(밝음)','딥(깊음)',r.V)+meter(pct(r.C,'브라이트','뮤트'),'브라이트(선명)','뮤트(부드러움)',r.C)+'</div>';
  if(r.skin)h+='<div class="skin"><i style="background:rgb('+r.skin.rgb.join(',')+')"></i><div><b>측정 피부색</b><br><span class="soft">밝기 L* '+r.skin.L+' · 색상각 '+r.skin.h+'°</span></div></div>';
  if(PH)h+='<div class="thumbs"><figure><img id="best" alt="베스트 컬러를 댄 얼굴"><span style="color:var(--ok)">✔ 베스트 · '+t.best[0][0]+'</span></figure><figure><img id="worst" alt="워스트 컬러를 댄 얼굴"><span style="color:var(--bad)">✘ 워스트 · '+t.worst[0][0]+'</span></figure></div>';
  if(r.log&&r.log.length)h+='<details><summary><b>내가 고른 천 (진단 근거)</b></summary><ul style="margin:8px 0 0;padding-left:20px">'+r.log.map(function(l){return '<li>'+esc(l)+'</li>'}).join('')+'</ul></details>';
  h+='<div><h3>베스트 컬러</h3></div><div class="pal">'+t.best.map(function(c){return '<div><i style="background:'+c[1]+'"></i>'+c[0]+'</div>'}).join('')+'</div>'+
   '<div><h3>피하면 좋은 색</h3></div><div class="pal bad">'+t.worst.map(function(c){return '<div><i style="background:'+c[1]+'"></i>'+c[0]+'</div>'}).join('')+'</div>'+
   '<div><h3>면접 복장 추천</h3></div><dl class="dress"><dt>정장</dt><dd>'+t.suit+'</dd><dt>셔츠</dt><dd>'+t.shirt+'</dd>'+
   (r.sex!=='여'?'<dt>넥타이</dt><dd>'+t.tie+'</dd>':'')+(r.sex!=='남'?'<dt>블라우스</dt><dd>'+t.blouse+'</dd><dt>립</dt><dd>'+t.lip+'</dd>':'')+
   '<dt>액세서리</dt><dd>'+t.metal+'</dd><dt>헤어</dt><dd>'+t.hair+'</dd></dl>'+
   '<div class="why"><b>오늘의 한 줄</b><br>면접 첫인상은 비싼 옷이 아니라 <b>나한테 맞는 색</b>이 만든다. 지금 옷장에서 베스트 컬러 옷 한 벌을 찾아보세요.</div>'+
   '<p class="note">이 진단은 휴대폰 화면·조명으로 하는 <b>참고용</b>이에요. 정확한 진단은 자연광 아래 실제 천으로 전문가에게 받으세요.</p></div>'+
   '<div class="btns noprint"><button class="btn pri" data-go="again">다시 진단하기</button><button class="btn" data-go="print">진단서 인쇄·PDF</button></div><p class="note noprint">휴대폰은 화면을 캡처해서 저장하세요.</p>';
  return h;
}
function render(){
  if(flick&&!(S.step>=3&&S.step<=5)){clearInterval(flick);flick=null}
  var h;
  if(S.step==='report')h=report();
  else if(S.step<0)h=home();
  else h=[step0,step1,step2,drapeStep,drapeStep,drapeStep,step6][S.step]();
  app.innerHTML=h;
  var bar=document.getElementById('bar');if(bar)bar.remove();
  if(S.step!=='report'&&S.step>=0){
    var can=S.step===0?S.ready.length>=4:S.step===2?true:S.step===6?S.qa.filter(function(v){return v!=null}).length===10:false;
    var nx=S.step===6?'진단 결과 보기':'다음';
    if(S.step===0||S.step===2||S.step===6){
      var b=document.createElement('div');b.className='bar';b.id='bar';
      b.innerHTML='<div class="in"><button class="btn" data-go="prev">이전</button><button class="btn pri" data-go="next"'+(can?'':' disabled')+'>'+nx+'</button></div>';
      document.body.appendChild(b);
    }
  }
  if(S.step===1&&S.cam&&stream){var v=document.getElementById('vid');v.srcObject=stream;v.play&&v.play().catch(function(){})}
  if(S.step===2&&PH)drawSkin();
  if(S.step>=3&&S.step<=5)paint();
  if(S.step==='report'&&PH){var t=T[res.type];document.getElementById('best').src=drape(t.best[0][1],300).toDataURL('image/jpeg',.85);document.getElementById('worst').src=drape(t.worst[0][1],300).toDataURL('image/jpeg',.85)}
  window.scrollTo(0,0);
}
function go(k){
  if(k==='start'){S.nick=(document.getElementById('nick')||{}).value||S.nick;S.step=0;S.ready=[];S.r1=[];S.r2=[];S.r3=[];S.qa=[];S.skin=null;PH=null}
  else if(k==='report'){S.step='report'}
  else if(k==='cam')camOn();
  else if(k==='shoot'){shoot();return}
  else if(k==='nocam'){camOff();PH=null;S.skin=null;S.step=3}
  else if(k==='wp'){wpMode=!wpMode;note=''}
  else if(k==='retake'){PH=null;S.skin=null;S.step=1;camOn()}
  else if(k==='flick'){if(flick){clearInterval(flick);flick=null}else flick=setInterval(function(){cur=cur==='a'?'b':'a';paint()},900);var fb=document.querySelector('[data-go="flick"]');if(fb)fb.textContent=flick?'⏸ 멈추기':'▶ 번갈아 보기';return}
  else if(k==='prev'){if(S.step===0)S.step=-1;else if(S.step===2){S.step=1;PH=null;camOn()}else if(S.step===6){S.step=5;S.r3.pop()}else S.step--}
  else if(k==='next'){
    if(S.step===0){S.step=1;camOn()}
    else if(S.step===2)S.step=3;
    else if(S.step===6){res=result();try{localStorage.setItem('color-v1',JSON.stringify(res))}catch(e){}S.step='report'}
  }
  else if(k==='again'){res=null;try{localStorage.removeItem('color-v1')}catch(e){}S.step=-1;PH=null}
  else if(k==='print'){window.print();return}
  render();
}
app.addEventListener('click',function(e){
  var b=e.target.closest('button');
  if(b&&b.dataset.go){go(b.dataset.go);return}
  if(b&&b.dataset.sex){S.sex=b.dataset.sex;S.nick=(document.getElementById('nick')||{}).value||S.nick;render();return}
  if(b&&b.dataset.ab){cur=b.dataset.ab;if(flick){clearInterval(flick);flick=null;var fb=document.querySelector('[data-go="flick"]');if(fb)fb.textContent='▶ 번갈아 보기'}paint();return}
  if(b&&b.dataset.pick!=null){
    var v=+b.dataset.pick*(SW?-1:1);cur='a';SW=Math.random()<.5;
    if(S.step===3){S.r1.push(v);if(S.r1.length===5)S.step=4}
    else if(S.step===4){S.r2.push(v);if(S.r2.length===3)S.step=5}
    else if(S.step===5){S.r3.push(v);if(S.r3.length===3)S.step=6}
    render();return;
  }
  if(b&&b.dataset.qa){var p=b.dataset.qa.split('_');S.qa[+p[0]]=+p[1];var y=window.scrollY;render();window.scrollTo(0,y);return}
  if(e.target.id==='cv'&&S.step===2&&PH){
    var cv=e.target,rc=cv.getBoundingClientRect(),px=(e.clientX-rc.left)/rc.width*PH.width,py=(e.clientY-rc.top)/rc.height*PH.height;
    if(wpMode){var w=sample(px,py);if(w&&w[0]+w[1]+w[2]>360){WP=w;note=''}else note='흰 종이가 아니거나 너무 어두워요. 종이 한가운데를 눌러 주세요.';wpMode=false}
    else PTS[px<PH.width/2?0:1]=[px,py];
    measure();render();
  }
});
app.addEventListener('change',function(e){
  if(e.target.dataset.ready!=null){var i=+e.target.dataset.ready,k=S.ready.indexOf(i);if(e.target.checked&&k<0)S.ready.push(i);if(!e.target.checked&&k>=0)S.ready.splice(k,1);render()}
});
document.body.addEventListener('click',function(e){var b=e.target.closest('.bar button');if(b)go(b.dataset.go)});
render();
})();
</script>
</body></html>
