<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>더모어 취업 연구소</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 휴대폰 우선 한 줄 흐름. 위 = 단계 막대, 가운데 = 지금 단계 카드, 아래 = 이전/다음 고정 바 */
:root{
  --bg:#f6f6f6; --ink:#333; --soft:#6f7480; --card:#fff; --line:#e2e3e8; --field:#fbfbfc;
  --blue:#4e6bf1; --blue-ink:#fff; --blue-soft:#e9edfe; --yel:#ffd164; --ok:#2e8b4c; --bad:#c8432f;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642; --field:#1a1d23;
  --blue:#7c93ff; --blue-ink:#10121a; --blue-soft:#262d4a; --ok:#5cc47c; --bad:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642; --field:#1a1d23;
  --blue:#7c93ff; --blue-ink:#10121a; --blue-soft:#262d4a; --ok:#5cc47c; --bad:#ff7a63; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.75rem;font-weight:900}
h2{font-size:1.35rem;font-weight:900}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.soft{color:var(--soft)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* 홈 */
.brand{display:flex;flex-direction:column;gap:4px}
.brand small{letter-spacing:.12em;font-weight:700;color:var(--blue);font-size:.78rem}
.hero{background:var(--blue);color:var(--blue-ink);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:10px;text-align:left;border:0}
.hero b{font-size:1.4rem;font-weight:900}
.hero span{opacity:.9}
.hero .go{align-self:flex-start;background:var(--blue-ink);color:var(--blue);font-weight:900;border-radius:4px;padding:8px 16px}
.list{display:flex;flex-direction:column;gap:10px}
a.g{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:4px;padding:14px 16px;color:var(--ink);text-decoration:none}
a.g b{font-size:1.1rem}
a.g span{color:var(--soft);font-size:.92rem}
.label{font-size:.8rem;font-weight:700;letter-spacing:.08em;color:var(--soft)}

/* 단계 막대 */
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.steps i{height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--blue)}
.stephead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.stephead .no{font-weight:700;color:var(--blue);font-size:.9rem}

.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:16px}
.why{background:var(--blue-soft);border-radius:4px;padding:12px 14px;font-size:.95rem}
.why b{color:var(--blue)}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.f .lb{font-weight:700}
.f .hint{font-size:.85rem;color:var(--soft)}
input[type=text],textarea,select{width:100%;box-sizing:border-box;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
.count{font-size:.8rem;color:var(--soft);text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 14px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink);font-weight:700}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pair .mid{font-size:.8rem;color:var(--soft)}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--field);padding:8px 4px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink);font-weight:700}
.exp{border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--field)}
.exp .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.star{display:grid;grid-template-columns:auto 1fr;gap:10px 10px;align-items:start}
.star .tag{background:var(--blue);color:var(--blue-ink);font-weight:900;border-radius:4px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;margin-top:28px}
.ghost{background:none;border:1px dashed var(--line);border-radius:4px;padding:10px;color:var(--soft);font-weight:700}
.del{background:none;border:0;color:var(--bad);font-size:.9rem}

/* 결과 */
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:10px 16px;font-weight:700}
.btn.pri{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn:disabled{opacity:.45;cursor:not-allowed}
pre.out{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:14px;margin:0;font-family:var(--f);font-size:.98rem;line-height:1.75;max-height:60vh;overflow:auto}
.note{font-size:.9rem;color:var(--soft)}
.note.ok{color:var(--ok)} .note.bad{color:var(--bad)}
.checks{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.checks label{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.checks input{width:20px;height:20px;margin-top:3px;flex:none}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:8px;justify-content:space-between}
.bar .btn{flex:1;max-width:220px;padding:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<div class="wrap" id="app"></div>
<div class="bar" id="bar" hidden><div class="in"><button class="btn" id="prev">← 이전</button><button class="btn pri" id="next">다음 →</button></div></div>

<script>
(function(){
var h=(location.hash||'').slice(1), m={safety:'safety.html',river:'river.html'};
if(m[h]){location.replace(m[h]);return;}

/* ───── 선택지 ───── */
var TRAITS=['꼼꼼함','끈기','책임감','성실함','소통','팀워크','배려','리더십','도전정신','창의성','적응력','분석력','긍정적','침착함','손재주','체력'];
var VALUES=['안정','성장','인정','사람','재미','보상','안전','봉사'];
var STYLE=[['혼자 집중','여럿이 함께'],['계획 먼저','일단 해 보기'],['몸으로 하는 일','머리로 하는 일'],['정해진 방법','새로운 방법']];
var KINDS=['현장실습','아르바이트','동아리','프로젝트·수행평가','대회·공모전','자격증','봉사','학생회·반장','기타'];

var EMPTY={school:'',dept:'',company:'',job:'',jobwhy:'',traits:[],values:[],style:[-1,-1,-1,-1],core:[],
  exps:[{kind:'',title:'',s:'',t:'',a:'',r:'',learn:''}],good:'',goodEx:'',bad:'',badFix:'',grow:'',
  motive:'',know:'',plan:'',draft:''};
var D;
try{D=JSON.parse(localStorage.getItem('jaso-v1')||'null')}catch(e){D=null}
if(!D){D=JSON.parse(JSON.stringify(EMPTY))}
for(var k in EMPTY) if(D[k]===undefined) D[k]=JSON.parse(JSON.stringify(EMPTY[k]));
var saveT; function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem('jaso-v1',JSON.stringify(D))}catch(e){}},300)}

var app=document.getElementById('app'), bar=document.getElementById('bar');
var step=-1; // -1 = 홈
var NSTEP=8;
/* 서버 AI (ai.js가 준비되면 TM_AI). 초대코드는 QR 주소 ?c=코드 로 받거나 직접 입력, 이 휴대폰에 기억 */
var AI=window.TM_AI||null, CODE={code:'',name:'',left:null};
try{CODE=JSON.parse(localStorage.getItem('tm-code')||'null')||CODE}catch(e){}
var qc=(new URLSearchParams(location.search).get('c')||'').trim().toUpperCase();
if(qc&&qc!==CODE.code)CODE={code:qc,name:'',left:null,fresh:1};
function saveCode(){try{localStorage.setItem('tm-code',JSON.stringify(CODE))}catch(e){}}
function checkCode(){if(!AI||!CODE.code)return;AI.check(CODE.code).then(function(r){CODE.name=r.name;CODE.ok=1;delete CODE.fresh;saveCode();if(step===7)render()},
  function(e){CODE.ok=0;CODE.err=e.message;if(step===7)render()})}
window.addEventListener('tm-ai',function(){AI=window.TM_AI;if(CODE.fresh||CODE.code&&!CODE.ok)checkCode();if(step===7)render()});
if(AI&&(CODE.fresh))checkCode();

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function field(id,label,hint,opt){opt=opt||{};var v=esc(get(id));
  var input=opt.area?'<textarea id="'+id+'" data-k="'+id+'" placeholder="'+esc(opt.ph||'')+'">'+v+'</textarea>'
    :'<input type="text" id="'+id+'" data-k="'+id+'" value="'+v+'" placeholder="'+esc(opt.ph||'')+'">';
  return '<div class="f"><label for="'+id+'">'+label+'</label>'+(hint?'<span class="hint">'+hint+'</span>':'')+input+(opt.area?'<span class="count" data-c="'+id+'">'+(get(id)||'').length+'자</span>':'')+'</div>'}
function get(path){var p=path.split('.'),o=D;for(var i=0;i<p.length;i++){if(o==null)return'';o=o[p[i]]}return o==null?'':o}
function set(path,v){var p=path.split('.'),o=D;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v;save()}
function chips(key,list,max){return '<div class="chips" role="group">'+list.map(function(t){var on=D[key].indexOf(t)>=0;
  return '<button class="chip" data-chip="'+key+'" data-max="'+max+'" aria-pressed="'+on+'">'+esc(t)+'</button>'}).join('')+'</div>'}

/* ───── 화면들 ───── */
var STEPS=[
 {t:'기본 정보',why:'회사와 직무가 정해져야 자소서 방향이 잡혀요. 아직 못 정했다면 <b>가고 싶은 업종</b>이라도 적어 보세요. 이름·연락처·주민번호는 <b>절대 적지 마세요</b>.',
  body:function(){return field('school','학교 · 학과','예: OO공고 건축디자인과 / OO대 보컬K-POP콘텐츠과',{ph:'학교와 학과'})+
   field('company','지원 회사(기관)','정확한 이름. 아직이면 "인테리어 시공 회사"처럼',{ph:'예: (주)OO건설'})+
   field('job','지원 직무','하는 일 이름. 예: 실내건축 시공관리, 생산관리, 보컬 트레이너',{ph:'예: 실내건축 시공관리'})+
   field('jobwhy','이 직무를 알게 된 계기 (한 줄)','',{ph:'예: 2학년 실습 때 현장 소장님을 보고'})}},
 {t:'나를 아는 질문',why:'자소서는 "나는 이런 사람"을 <b>증거(경험)</b>로 보여 주는 글이에요. 먼저 내 성격 단어를 골라 두면 뒤에서 경험과 연결하기 쉬워요.',
  body:function(){return '<div class="f"><span class="lb">나를 설명하는 단어 (최대 3개)</span><span class="hint">친구가 나를 소개한다면 어떤 단어를 쓸까요?</span>'+chips('traits',TRAITS,3)+'</div>'+
   '<div class="f"><span class="lb">일할 때 가장 중요한 것 (최대 2개)</span>'+chips('values',VALUES,2)+'</div>'}},
 {t:'일하는 스타일',why:'정답은 없어요. 둘 중 <b>조금이라도 더 가까운 쪽</b>을 고르세요. 직무와 잘 맞는 성향은 자소서에서 강점이 돼요.',
  body:function(){return STYLE.map(function(p,i){return '<div class="f"><span class="lb">'+(i+1)+'. 나는 어느 쪽?</span><div class="seg" role="group">'+
   [0,1].map(function(j){return '<button data-style="'+i+'" data-v="'+j+'" aria-pressed="'+(D.style[i]===j)+'">'+esc(p[j])+'</button>'}).join('')+'</div></div>'}).join('')}},
 {t:'직무 핵심 역량',why:'회사는 "이 직무에 꼭 필요한 힘"이 있는 사람을 뽑아요. 지원 직무에 <b>꼭 필요한 역량 1~2개</b>를 고르세요. 아래 경험은 이 역량을 증명하는 쪽으로 쓰면 돼요.',
  body:function(){return '<div class="f"><span class="lb">핵심 역량 (최대 2개)</span><span class="hint">예: 시공관리 → 꼼꼼함·소통 / 생산 → 책임감·분석력</span>'+chips('core',TRAITS,2)+'</div>'}},
 {t:'경험 카드',why:'AI 결과는 <b>여기 쓴 만큼만</b> 좋아져요. 현장실습·알바·동아리·수행평가·봉사, 작아도 괜찮아요. <b>내 역할, 내가 한 행동, 숫자로 된 결과, 배운 점</b>이 핵심이에요.',
  body:function(){return D.exps.map(function(e,i){var p='exps.'+i+'.';return '<div class="exp"><div class="top"><h3>경험 '+(i+1)+'</h3>'+(D.exps.length>1?'<button class="del" data-del="'+i+'">삭제</button>':'')+'</div>'+
   '<div class="f"><label for="k'+i+'">종류</label><select id="k'+i+'" data-k="'+p+'kind"><option value="">고르세요</option>'+KINDS.map(function(k){return '<option'+(e.kind===k?' selected':'')+'>'+k+'</option>'}).join('')+'</select></div>'+
   field(p+'title','한 줄 제목','',{ph:'예: 2학년 인테리어 현장실습'})+
   '<div class="star"><span class="tag">S</span>'+field(p+'s','상황','언제, 어디서, 어떤 일이었나요?',{area:1,ph:'예: 상가 2층 인테리어 현장에서 3주 실습'})+
   '<span class="tag">T</span>'+field(p+'t','내 역할·목표','내가 맡은 일은?',{area:1,ph:'예: 자재 정리와 도면 확인 보조'})+
   '<span class="tag">A</span>'+field(p+'a','내가 한 행동','"우리"가 아니라 "내가" 한 것. 구체적으로',{area:1,ph:'예: 자재마다 위치표를 붙이고 매일 아침 수량을 체크'})+
   '<span class="tag">R</span>'+field(p+'r','결과','숫자가 있으면 꼭! (몇 %, 몇 분, 몇 개)',{area:1,ph:'예: 자재 찾는 시간이 10분에서 2분으로 줄어 칭찬받음'})+'</div>'+
   field(p+'learn','배운 점 · 발휘한 강점','',{area:1,ph:'예: 정리정돈이 곧 속도이자 안전이라는 것'})+'</div>'}).join('')+
   (D.exps.length<3?'<button class="ghost" id="addExp">+ 경험 하나 더 (최대 3개)</button>':'')}},
 {t:'장점과 단점',why:'장점은 <b>직무 역량과 연결</b>하고 사례를 붙여요. 단점은 솔직하게, 대신 <b>지금 고치려고 하는 행동</b>을 꼭 같이 써요.',
  body:function(){return field('good','나의 장점','',{ph:'예: 꼼꼼함'})+field('goodEx','장점이 드러난 사례','',{area:1,ph:'예: 도면 치수를 두 번 확인해 재단 실수를 막음'})+
   field('bad','나의 단점','치명적인 것(지각, 거짓말 등)은 피하기',{ph:'예: 결정이 느림'})+field('badFix','단점을 고치려는 노력','',{area:1,ph:'예: 선택지를 3개로 줄여 메모하고 10분 안에 정하기 연습'})+
   field('grow','나를 바꾼 고등학교(대학) 경험 한 가지','성장과정 문항에 들어가요',{area:1,ph:'예: 동아리 부장을 맡아 갈등을 조율한 경험'})}},
 {t:'지원동기와 포부',why:'"왜 하필 이 회사?"에 답하는 칸이에요. 회사 홈페이지의 <b>인재상·주요 사업·최근 소식</b> 하나를 찾아 내 경험과 이어 보세요.',
  body:function(){return field('know','회사에 대해 알아본 것','홈페이지 인재상, 주요 제품·사업, 최근 뉴스',{area:1,ph:'예: 인재상 "안전·신뢰", 상업 공간 인테리어가 주력'})+
   field('motive','지원하는 이유','',{area:1,ph:'예: 현장실습에서 배운 정리정돈 습관을 시공 현장에서 키우고 싶어서'})+
   field('plan','입사 후 목표 (1년 · 5년)','',{area:1,ph:'예: 1년 안에 실내건축기능사 취득, 5년 뒤 현장을 맡는 관리자'})}},
 {t:'AI 초안 만들기',why:'',body:function(){return resultView()}}
];

function home(){
  step=-1; bar.hidden=true;
  var started=D.company||D.job||D.exps[0].title;
  app.innerHTML='<header class="brand"><small>THE MORE · 김준용 강사</small><h1>더모어 취업 연구소</h1><p class="soft">내 경험으로 쓰는 자기소개서, 그리고 수업 게임</p></header>'+
   '<button class="hero" id="startJaso"><b>내 자소서 만들기</b><span>8단계 질문에 답하면 성장과정 · 장단점 · 직무경험 · 지원동기 초안이 나와요. 입력한 내용은 이 휴대폰에만 저장되고, AI 초안을 만들 때만 서버를 거쳐요(서버에 남지 않아요).</span><span class="go">'+(started?'이어서 쓰기 →':'시작하기 →')+'</span></button>'+
   '<span class="label">수업 게임</span><div class="list">'+
   '<a class="g" href="safety.html" id="g-safety"><b>안전 징검다리</b><span>현장 안전 팀 대결 · 맞히면 한 칸 앞으로, 틀리면 "아차!" 한 칸 뒤로</span></a>'+
   '<a class="g" href="river.html" id="g-river"><b>문제해결 강건너기</b><span>3단계 퍼즐 · 농부와 늑대, 모범생과 장난꾸러기, 17분 다리</span></a></div>';
  document.getElementById('startJaso').onclick=function(){go(0)};
}

function go(n){step=Math.max(0,Math.min(NSTEP-1,n));render();window.scrollTo(0,0)}
function render(){
  if(step<0){home();return}
  var S=STEPS[step]; bar.hidden=false;
  app.innerHTML='<div class="stephead"><button class="btn" id="toHome" style="padding:6px 10px">홈</button><span class="no">'+(step+1)+' / '+NSTEP+'</span></div>'+
   '<div class="steps" aria-hidden="true">'+STEPS.map(function(_,i){return '<i class="'+(i<=step?'on':'')+'"></i>'}).join('')+'</div>'+
   '<h2>'+S.t+'</h2>'+(S.why?'<p class="why">'+S.why+'</p>':'')+'<div class="card">'+S.body()+'</div>';
  document.getElementById('prev').disabled=step===0;
  var nx=document.getElementById('next'); nx.textContent=step===NSTEP-1?'처음으로':(step===NSTEP-2?'AI 초안 만들기 →':'다음 →');
  bind();
}
document.getElementById('prev').onclick=function(){go(step-1)};
document.getElementById('next').onclick=function(){if(step===NSTEP-1)home();else go(step+1)};

function bind(){
  document.getElementById('toHome').onclick=home;
  app.querySelectorAll('[data-k]').forEach(function(el){
    el.addEventListener(el.tagName==='SELECT'?'change':'input',function(){set(el.dataset.k,el.value);
      var c=app.querySelector('[data-c="'+el.dataset.k+'"]'); if(c) c.textContent=el.value.length+'자';});
  });
  app.querySelectorAll('[data-chip]').forEach(function(b){b.onclick=function(){
    var key=b.dataset.chip,max=+b.dataset.max,arr=D[key],t=b.textContent,i=arr.indexOf(t);
    if(i>=0)arr.splice(i,1);else{if(arr.length>=max)arr.shift();arr.push(t)}
    save();render();}});
  app.querySelectorAll('[data-style]').forEach(function(b){b.onclick=function(){D.style[+b.dataset.style]=+b.dataset.v;save();render()}});
  var add=document.getElementById('addExp'); if(add) add.onclick=function(){D.exps.push({kind:'',title:'',s:'',t:'',a:'',r:'',learn:''});save();render()};
  app.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){D.exps.splice(+b.dataset.del,1);save();render()}});
  if(step===NSTEP-1) bindResult();
}

/* ───── 프롬프트 ───── */
var BR='\u0001';
function lines(){return Array.prototype.slice.call(arguments).filter(function(x){return x===BR||(x&&String(x).trim())}).map(function(x){return x===BR?'':x}).join('\n')}
function buildPrompt(){
  var style=STYLE.map(function(p,i){return D.style[i]>=0?p[D.style[i]]:''}).filter(Boolean).join(', ');
  var exps=D.exps.filter(function(e){return e.title||e.a||e.s}).map(function(e,i){
    return lines('['+(i+1)+'] '+(e.kind?e.kind+' · ':'')+(e.title||'(제목 없음)'),
      e.s&&'- 상황(S): '+e.s, e.t&&'- 역할·목표(T): '+e.t, e.a&&'- 행동(A): '+e.a, e.r&&'- 결과(R): '+e.r, e.learn&&'- 배운 점·강점: '+e.learn)}).join('\n\n');
  return lines(
'너는 고등학생·대학생의 첫 취업을 돕는 자기소개서 전문가야. 아래 [내 정보]만 근거로, 실제 회사에 낼 수 있는 자기소개서 초안을 써 줘.',
BR,
'[쓰는 규칙]',
'1. 말투: 친근하지만 정중하고 전문적인 "~습니다"체.',
'2. 내 정보에 없는 경험·숫자·자격증·회사 정보는 절대 지어내지 마. 내용이 모자라면 그 자리에 [추가 필요: 무엇을 쓰면 좋을지]라고 표시해.',
'3. 각 항목 첫 문장은 핵심 한 줄(소제목처럼)로 시작해.',
'4. 글자 수(공백 포함)를 넘기지 마.',
'5. 맨 끝에 "고쳐 쓸 점" 3가지를 짧게 적어 줘.',
BR,
'[내 정보]',
'- 학교·학과: '+(D.school||'(미입력)'),
'- 지원 회사: '+(D.company||'(미입력)'),
'- 지원 직무: '+(D.job||'(미입력)'),
D.jobwhy&&'- 직무를 알게 된 계기: '+D.jobwhy,
D.traits.length&&'- 나를 설명하는 단어: '+D.traits.join(', '),
D.values.length&&'- 일할 때 중요하게 여기는 것: '+D.values.join(', '),
style&&'- 일하는 스타일: '+style,
D.core.length&&'- 직무 핵심 역량: '+D.core.join(', '),
D.grow&&'- 나를 바꾼 경험: '+D.grow,
D.good&&'- 장점: '+D.good+(D.goodEx?' / 사례: '+D.goodEx:''),
D.bad&&'- 단점: '+D.bad+(D.badFix?' / 고치려는 노력: '+D.badFix:''),
D.know&&'- 회사에 대해 알아본 것: '+D.know,
D.motive&&'- 지원 이유: '+D.motive,
D.plan&&'- 입사 후 목표: '+D.plan,
BR,
exps?'[경험]\n'+exps:'[경험] (미입력)',
BR,
'[써야 할 항목]',
'1. 성장과정 (700자 이내): 성격·가치관을 만든 경험 1~2가지와 배운 점.',
'2. 성격의 장단점 (500자 이내): 직무 역량과 이어지는 장점 1개와 사례, 단점 1개와 고치려는 구체적 노력.',
'3. 직무 관련 경험 (1000자 이내): 경험 1~2개를 STAR(상황-과제-행동-결과) 순서로. 결과의 숫자는 내 정보에 있는 것만.',
'4. 지원동기와 입사 후 포부 (700자 이내): 이 회사·직무를 고른 이유를 내 경험과 연결하고, 1년·5년 목표.',
BR,
'출력 형식: 항목마다 "## 1. 성장과정 (OOO자)"처럼 제목과 실제 글자 수를 쓰고 본문. 그 밖의 설명은 쓰지 마.');
}

/* ───── 결과 화면 ───── */
var busy=false;
function resultView(){
  var filled=[D.company,D.job,D.exps[0]&&(D.exps[0].a||D.exps[0].s)].filter(Boolean).length;
  return '<p class="why" style="margin:0">'+(filled<3?'<b>잠깐!</b> 회사·직무·경험 행동(A) 중 비어 있는 칸이 있어요. 채울수록 결과가 좋아져요. ':'')+
   'AI는 <b>내가 쓴 내용만</b> 씁니다. 모자란 곳은 <b>[추가 필요]</b>로 표시되니 그 칸을 채워 가며 고치세요.</p>'+
   '<div class="f"><span class="lb">방법 ① 초대코드로 바로 만들기</span>'+codeView()+'</div>'+
   '<div class="f"><span class="lb">방법 ② 질문지를 복사해서 AI에 붙여넣기</span><span class="hint">뤼튼 · ChatGPT · 제미나이 아무 곳이나 붙여넣고 보내면 돼요.</span>'+
   '<div class="btns"><button class="btn'+(ok()?'':' pri')+'" id="copyPrompt">📋 질문지 복사</button><button class="btn" id="showPrompt">질문지 보기</button></div>'+
   '<pre class="out" id="promptBox" hidden></pre></div>'+
   '<div class="f"><span class="lb">AI 초안</span><span class="hint">방법 ②로 받은 답도 여기에 붙여넣어 두면 이 휴대폰에 저장돼요.</span>'+
   '<textarea id="draft" data-k="draft" style="min-height:260px" placeholder="여기에 초안이 나와요">'+esc(D.draft)+'</textarea><span class="count" data-c="draft">'+(D.draft||'').length+'자</span>'+
   '<p class="note" id="genNote" role="status"></p><div class="btns"><button class="btn" id="copyDraft">초안 복사</button></div></div>'+
   '<div class="f"><span class="lb">고쳐 쓰기 체크 (제출 전 꼭!)</span><ul class="checks">'+
   ['내 말투로 바꿨다 (소리 내 읽어서 어색한 문장 고치기)','[추가 필요] 칸을 모두 채웠다','숫자·자격증·활동이 전부 사실이다','실제 회사 문항과 글자 수에 맞게 골라 다시 짰다','맞춤법 검사를 했다 (네이버 맞춤법 검사기 등)']
    .map(function(t,i){return '<li><label><input type="checkbox" id="ck'+i+'"> '+t+'</label></li>'}).join('')+'</ul></div>';
}
function ok(){return !!(AI&&CODE.code&&CODE.ok)}
function codeView(){
  if(!AI)return '<span class="hint">지금은 준비 중이에요. 아래 방법 ②를 쓰세요.</span>';
  if(!ok())return '<span class="hint">선생님이 알려 준 초대코드를 넣으세요. 코드가 없으면 방법 ②를 쓰세요.</span>'+
    '<div class="btns"><input type="text" id="codeIn" value="'+esc(CODE.code)+'" placeholder="예: OSAN-1106" autocapitalize="characters" style="flex:1;min-width:0;max-width:220px"><button class="btn" id="codeBtn">확인</button></div>'+
    (CODE.err?'<p class="note bad">'+esc(CODE.err)+'</p>':'');
  return '<span class="hint">'+esc(CODE.name||'초대코드 확인됨')+(CODE.left!=null?' · 오늘 '+CODE.left+'번 더 만들 수 있어요':'')+' · <button class="link" id="codeOut" style="background:none;border:0;padding:0;color:var(--blue);text-decoration:underline">코드 바꾸기</button></span>'+
    '<div class="btns"><button class="btn pri" id="gen" '+(busy?'disabled':'')+'>✨ AI 초안 만들기</button></div>';
}
function payload(){var d=JSON.parse(JSON.stringify(D));delete d.draft;delete d.dept;
  d.style=D.style.map(function(v,i){return v<0?'':STYLE[i][v]}).filter(Boolean);return d}
function copy(text,btn){
  var done=function(){var o=btn.textContent;btn.textContent='✔ 복사됐어요';setTimeout(function(){btn.textContent=o},1600)};
  try{navigator.clipboard.writeText(text).then(done,function(){fallback()})}catch(e){fallback()}
  function fallback(){var pb=document.getElementById('promptBox');pb.hidden=false;pb.textContent=text;
    var r=document.createRange();r.selectNodeContents(pb);var s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='길게 눌러 복사하세요'}
}
function bindResult(){
  document.getElementById('copyPrompt').onclick=function(){copy(buildPrompt(),this)};
  document.getElementById('showPrompt').onclick=function(){var pb=document.getElementById('promptBox');pb.hidden=!pb.hidden;pb.textContent=buildPrompt()};
  document.getElementById('copyDraft').onclick=function(){var t=D.draft;if(!t)return;var b=this;
    try{navigator.clipboard.writeText(t).then(function(){b.textContent='✔ 복사됐어요';setTimeout(function(){b.textContent='초안 복사'},1600)},function(){document.getElementById('draft').select()})}catch(e){document.getElementById('draft').select()}};
  var note=document.getElementById('genNote'), out=document.getElementById('draft');
  var cb=document.getElementById('codeBtn'), ci=document.getElementById('codeIn'), co=document.getElementById('codeOut');
  if(cb)cb.onclick=function(){var v=(ci.value||'').trim().toUpperCase();if(!v)return;CODE={code:v,name:'',left:null};cb.disabled=true;cb.textContent='확인 중…';checkCode()};
  if(ci)ci.onkeydown=function(e){if(e.key==='Enter')cb.click()};
  if(co)co.onclick=function(){CODE={code:'',name:'',left:null};saveCode();render()};
  var gen=document.getElementById('gen'); if(!gen)return;
  gen.onclick=function(){
    if(!ok()||busy)return;
    if(D.draft&&!confirm('지금 초안을 새 초안으로 바꿀까요? (오늘 횟수 1번을 써요)'))return;
    busy=true;gen.disabled=true;note.className='note';note.textContent='AI가 쓰는 중… (30초~1분 걸려요. 화면을 끄지 마세요)';
    AI.draft(CODE.code,payload())
     .then(function(r){out.value=r.text;D.draft=r.text;save();CODE.left=r.left;saveCode();note.className='note ok';
       note.textContent=r.cut?'길이 제한으로 끝이 잘렸어요. 경험을 줄여 다시 해 보세요.':'완성! 이제 아래 체크리스트대로 고쳐 쓰세요.'},
      function(e){note.className='note bad';note.textContent=e.message;if(/초대코드|기간/.test(e.message)){CODE.ok=0;saveCode()}})
     .then(function(){busy=false;gen.disabled=false;out.dispatchEvent(new Event('input'))});
  };
}

if(h==='jaso') go(0); else home();
})();
</script>
