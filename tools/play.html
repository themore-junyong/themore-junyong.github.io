<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>위듀케이션 취업 연구소 · 수업 게임</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 학생 폰: 강사가 빔에 띄운 게임(아이스브레이킹·징검다리·강건너기·교실 도구)을 실시간으로 같이 봄. 정답은 강사가 공개했을 때만 보임 */
:root{
  --bg:#f6f6f6; --ink:#333; --soft:#6f7480; --card:#fff; --line:#e2e3e8;
  --blue:#4e6bf1; --blue-ink:#fff; --ok:#2e8b4c; --bad:#c8432f;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642;
  --blue:#7c93ff; --blue-ink:#10121a; --ok:#5cc47c; --bad:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642;
  --blue:#7c93ff; --blue-ink:#10121a; --ok:#5cc47c; --bad:#ff7a63; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;padding:52px 0 40px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px}
.game{font-weight:900;color:var(--blue);font-size:.95rem;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.game span{color:var(--soft);font-weight:700}
.turn{align-self:flex-start;color:#fff;font-weight:900;padding:4px 14px;border-radius:999px}
.big{font-size:clamp(1.6rem,8vw,2.6rem);font-weight:900;text-align:center;line-height:1.3;overflow-wrap:anywhere}
.big.huge{font-size:clamp(2.6rem,16vw,4.6rem);letter-spacing:.08em}
.sub{text-align:center;color:var(--soft)}
.q{font-size:1.3rem;font-weight:900;line-height:1.45;margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:2px solid var(--line);border-radius:8px;padding:12px 14px;font-weight:700;font-size:1.05rem}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.reveal{border-radius:8px;padding:12px 14px;background:color-mix(in srgb,var(--ok) 14%,transparent);font-weight:700}
.clock{text-align:center;font-size:clamp(2.4rem,14vw,4rem);font-weight:900;font-variant-numeric:tabular-nums}
.clock.warn{color:var(--bad)}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.sc{border-left:6px solid var(--c);background:var(--card);border-radius:6px;padding:8px 12px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sc b{display:block}.sc .n{font-size:1.6rem;font-weight:900}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.grp{border-top:6px solid var(--c);background:var(--card);border-radius:6px;padding:10px 12px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.grp b{display:block;margin-bottom:4px}
ol.list{margin:0;padding-left:1.4em;font-size:1.1rem;font-weight:700}
.wait{text-align:center;padding:36px 16px;background:var(--blue);color:var(--blue-ink);border-radius:8px;display:flex;flex-direction:column;gap:8px;align-items:center}
.wait b{font-size:1.3rem}
.note{color:var(--soft);font-size:.9rem;text-align:center}
.home{color:var(--soft);font-size:.85rem;text-align:center}
</style></head><body>
<script src="room.js?v=188" data-guard></script>
<main class="wrap" id="app"><div class="wait"><span style="font-size:2.4rem" aria-hidden="true">👀</span><b>선생님 화면과 연결하는 중…</b></div></main>
<script>
(function(){
var app=document.getElementById('app'),M=null,tick=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function left(){return M&&M.end?Math.max(0,(M.end-Date.now())/1000):null}
function fmt(s){if(M.clock==='mmss'){s=Math.ceil(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}return Math.ceil(s)+'초'}
function render(){
  if(!M){app.innerHTML='<div class="wait"><span style="font-size:2.4rem" aria-hidden="true">👀</span><b>지금은 앞 화면(빔)을 보세요</b><span>선생님이 게임을 시작하면 여기에도 똑같이 보여요.</span></div>';return}
  var h='<div class="card"><div class="game">'+esc(M.game)+(M.num?'<span>'+esc(M.num)+'</span>':'')+'</div>';
  if(M.turn)h+='<span class="turn" style="background:'+esc(M.turn.c)+'">'+esc(M.turn.n)+'</span>';
  if(M.cat)h+='<span class="sub">'+esc(M.cat)+'</span>';
  if(M.q)h+='<p class="q">'+esc(M.q)+'</p>';
  if(M.big!=null)h+='<div class="big'+(M.huge?' huge':'')+'">'+esc(M.big)+'</div>';
  if(M.sub)h+='<p class="sub">'+esc(M.sub)+'</p>';
  if(M.end||M.clockText)h+='<div class="clock" id="clk">'+(M.end?fmt(left()):esc(M.clockText))+'</div>';
  if(M.opts)h+='<div class="opts">'+M.opts.map(function(o){return '<div class="opt'+(o.ok?' ok':o.bad?' bad':'')+'">'+esc(o.t)+(o.ok?' ✔':'')+'</div>'}).join('')+'</div>';
  if(M.reveal)h+='<div class="reveal">'+esc(M.reveal)+'</div>';
  if(M.list)h+='<ol class="list">'+M.list.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>';
  h+='</div>';
  if(M.groups)h+='<div class="groups">'+M.groups.map(function(g){return '<div class="grp" style="--c:'+esc(g.c)+'"><b>'+esc(g.n)+'</b>'+esc(g.m.join(', '))+'</div>'}).join('')+'</div>';
  if(M.score)h+='<div class="score">'+M.score.map(function(s){return '<div class="sc" style="--c:'+esc(s.c)+'"><b>'+esc(s.n)+'</b><span class="n">'+esc(s.v)+'</span></div>'}).join('')+'</div>';
  if(M.note)h+='<p class="note">'+esc(M.note)+'</p>';
  app.innerHTML=h;
}
setInterval(function(){var c=document.getElementById('clk');if(c&&M&&M.end){var l=left();c.textContent=fmt(l);c.className='clock'+(l<=10?' warn':'')}},250);
if(window.TM_ROOM&&TM_ROOM.onRoom)TM_ROOM.onRoom(function(r){
  var g=r&&r.g;M=null;
  if(g&&g.s&&g.t&&g.t.toMillis&&Date.now()-g.t.toMillis()<6*3600e3){try{M=JSON.parse(g.s)}catch(e){M=null}}
  render();
});
})();
</script>
</body></html>
