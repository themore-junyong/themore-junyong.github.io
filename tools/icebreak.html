 if(!s){app.innerHTML=h+'<div class="card"><p>이 창은 노트북 화면에 두고, 원래 창(문제 화면)을 빔(2번 모니터)으로 옮겨 전체 화면으로 띄우세요.</p></div>';return}
 h+='<div class="card">';
 var tm='';if(s.V==='chosung'||s.V==='emoji'){var l=s.T.run?Math.max(0,Math.ceil((s.T.end-Date.now())/1000)):(s.T.left==null?s.T.sec:Math.ceil(s.T.left));tm='<span class="mini" id="htm">'+l+'초</span>'}
 if(s.end&&s.V!=='body'){
  h+='<div class="stage">🎉 마지막 문제까지 끝났어요 ('+s.tot+'개)</div><div class="row" style="justify-content:center"><button class="btn pri big" data-h="again">🔀 다시 섞어서 처음부터</button></div>';
 }else if(s.V==='chosung'||s.V==='emoji'){
  h+='<div class="row" style="justify-content:space-between"><span class="cat">'+esc(s.qcat)+'</span><b style="font-size:1.6rem">'+s.num+'번 / '+s.tot+'</b></div>'+
   '<div style="text-align:center;font-size:2.4rem;font-weight:900">'+esc(s.q)+'</div>'+
   '<div class="ans" style="font-size:3rem">'+esc(s.ans)+'</div><p class="note" style="text-align:center">'+(s.show?'빔에 정답이 보이는 중':'빔에는 아직 정답이 안 보여요')+'</p>'+
   '<div class="row" style="justify-content:center">'+tm+'<button class="btn" data-h="qt">'+(s.T.run?'⏸ 타이머 멈춤':'⏱ 타이머')+'</button><button class="btn big" data-h="show">'+(s.show?'정답 가리기':'빔에 정답 공개')+'</button><button class="btn pri big" data-h="next">다음 문제 →</button></div>'+
   '<div class="hit">'+s.tname.map(function(n,i){return '<button data-hh="'+i+'" style="--c:'+COLORS[i]+'">'+esc(n)+' 정답 +1 → 다음</button>'}).join('')+'</div>';
 }else if(s.V==='balance'){
  h+='<div style="text-align:center"><span class="cat">'+esc(s.qcat)+'</span> <b>'+s.num+' / '+s.tot+'</b></div><div style="text-align:center;font-size:1.8rem;font-weight:900">'+esc(s.q)+'</div><div class="row" style="justify-content:center"><button class="btn pri big" data-h="next">다음 질문 →</button></div>';
 }else if(s.V==='body'){
  var bl=s.B.run?Math.max(0,Math.ceil((s.B.end-Date.now())/1000)):s.bodySec;
  h+='<p class="note">이번 차례: <b style="color:'+COLORS[s.sel]+'">'+esc(s.tname[s.sel])+'</b></p>';
  if(s.B.run)h+='<div class="mini" id="hbt">'+bl+'초</div><div class="big" style="font-size:4rem;letter-spacing:0">'+esc(s.ans)+'</div><div class="row" style="justify-content:center"><button class="btn pri big" data-h="bok">⭕ 맞혔다 ('+s.B.ok+')</button><button class="btn big" data-h="bpass">패스 ('+s.B.pass+')</button><button class="btn" data-h="bhide">빔에서 단어 가리기/보이기</button><button class="btn" data-h="bstop">끝내기</button></div>';
  else if(s.B.over)h+='<div class="stage">'+s.B.ok+'개 맞힘</div><div class="row" style="justify-content:center"><button class="btn pri big" data-h="bnext">다음 팀 준비 →</button></div>';
  else h+='<div class="chips">'+s.tname.map(function(n,i){return '<button data-hsel="'+i+'" style="'+(s.sel===i?'background:'+COLORS[i]+';color:#fff':'')+'">'+esc(n)+'</button>'}).join('')+'</div><div class="row" style="justify-content:center"><button class="btn pri big" data-h="bgo">▶ '+esc(s.tname[s.sel])+' 시작 ('+s.bodySec+'초)</button></div>';
 }
 h+='</div><div class="card"><h3>팀 점수</h3><div class="score">'+s.tname.map(function(n,i){return '<div class="sc" style="--c:'+COLORS[i]+'"><b>'+esc(n)+'</b><div class="n">'+s.score[i]+'</div><div class="row"><button class="btn" data-hsc="'+i+'" data-d="-1">−</button><button class="btn" data-hsc="'+i+'" data-d="1">+</button></div></div>'}).join('')+'</div></div>'+
  '<p class="note">키보드: → 다음 · 스페이스 정답 공개. 이 창은 학생에게 보이지 않는 노트북 화면에 두세요.</p>';
 app.innerHTML=h;
}
function hostInit(){document.title='진행자 화면 · 아이스브레이킹';hostRender();if(BC)BC.postMessage({hello:1});
 HIV=setInterval(function(){if(!HS)return;var a=document.getElementById('htm'),b=document.getElementById('hbt');
  if(a&&HS.T.run)a.textContent=Math.max(0,Math.ceil((HS.T.end-Date.now())/1000))+'초';if(b&&HS.B.run)b.textContent=Math.max(0,Math.ceil((HS.B.end-Date.now())/1000))+'초'},250);
 setInterval(function(){if(BC)BC.postMessage({hello:1})},3000);
 app.addEventListener('click',function(e){var t=e.target.closest('[data-h],[data-hh],[data-hsc],[data-hsel],[data-hgo]');if(!t)return;e.preventDefault();var d=t.dataset;
  if(d.h)send({a:d.h});else if(d.hh!=null)send({hit:d.hh});else if(d.hsc!=null)send({sc:d.hsc,d:d.d});else if(d.hsel!=null)send({sel:d.hsel});else if(d.hgo)send({go:d.hgo})});
 document.addEventListener('keydown',function(e){if(!HS)return;if(e.key==='ArrowRight'){e.preventDefault();send({a:HS.V==='body'?'bok':'next'})}else if(e.key===' '&&(HS.V==='chosung'||HS.V==='emoji')){e.preventDefault();send({a:'show'})}});
}
function render(){if(HOST)return;if(V.indexOf('ans/')===0){app.innerHTML=answers();return}var f={balance:balance,chosung:chosung,emoji:emoji,body:body}[V];if(!f){V='balance';f=balance}if(ED===V){app.innerHTML=editor(V);return}ED=null;app.innerHTML=f();pub()}

app.addEventListener('click',function(e){
 if(HOST)return;var t=e.target.closest('button,[data-side],[data-ren]');if(!t)return;act(t.dataset);
});
function act(d){
 if(d.go){location.hash=d.go;return}
 if(d.a==='host'){window.open(location.href.split('#')[0]+'#host','ice-host','width=1000,height=760');return}
 if(d.cat){st.cat[V]=d.cat;save();deal(V);resetQ();return render()}
 if(d.side!=null){var g=G.balance;g.pick=g.pick===+d.side?null:+d.side;return render()}
 if(d.ren!=null){var n=prompt('팀 이름',st.tname[+d.ren]);if(n&&n.trim()){st.tname[+d.ren]=n.trim().slice(0,12);save();render()}return}
 if(d.sc!=null){st.score[+d.sc]=Math.max(0,st.score[+d.sc]+(+d.d));save();return render()}
 if(d.tn){st.teams=+d.tn;if(st.sel>=st.teams)st.sel=0;save();return render()}
 if(d.hit!=null){st.score[+d.hit]++;save();next(V);resetQ();return render()}
 if(d.sel!=null){st.sel=+d.sel;save();return render()}
 if(d.bs){st.bodySec=+d.bs;save();return render()}
 if(d.qs!=null){var qs=+d.qs;if(!qs){qs=parseInt(prompt('문제마다 몇 초? (5~300)',st.qSec[V]||30),10);if(!(qs>=5&&qs<=300))return}
  st.qSec[V]=qs;save();if(!T.run)T.left=null;return render()} /* 초성·이모지 문제 시간 바꾸기(게임마다 따로 기억) */
 switch(d.a){
  case 'fs':if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();break;
  case 'zero':if(confirm('모든 팀 점수를 0점으로 할까요?')){st.score=[0,0,0,0,0,0];save();render()}break;
  case 'next':next(V);resetQ();render();break;
  case 'again':deal(V);resetQ();render();break;
  case 'key':keyOpen(V);break;
  case 'edit':ED=V;clearInterval(T.iv);T.run=false;render();var ta=document.getElementById('myta');if(ta)ta.focus();break;
  case 'ecancel':ED=null;render();break;
  case 'esave':var r=myParse(V,(document.getElementById('myta')||{}).value||'');if(r.bad.length&&!confirm('형식이 맞지 않는 줄 '+r.bad.length+'개는 빼고 저장할까요?\n(예: '+r.bad[0]+')\n두 가지는 / 로 나눠 주세요.'))break;
   MY[V]=r.items;try{localStorage.setItem('ice-my',JSON.stringify(MY))}catch(e){}applyMy();myPush();if(r.items.length)st.cat[V]=MYC;save();ED=null;deal(V);resetQ();render();break;
  case 'stat':statOpen();break;
  case 'sclose':document.getElementById('sov').hidden=true;break;
  case 'sreset':if(confirm('학생 응답 기록(조별 통계)을 모두 지울까요?')){R={};rSave();statOpen();render()}break;
  case 'show':G[V].show=!G[V].show;if(G[V].show){clearInterval(T.iv);T.run=false}render();break;
  case 'qt':unlock();if(T.run){clearInterval(T.iv);T.run=false}else{var l=T.left==null||T.left<=0?T.sec:T.left;T.end=Date.now()+l*1000;T.left=l;T.run=true;T.iv=setInterval(qtick,200)}render();break;
  case 'bgo':unlock();B={run:true,end:Date.now()+st.bodySec*1000,ok:0,pass:0,hide:false,over:false};next('body');B.iv=setInterval(btick,200);render();break;
  case 'bok':B.ok++;st.score[st.sel]++;save();next('body');render();break;
  case 'bpass':B.pass++;next('body');render();break;
  case 'bhide':B.hide=!B.hide;render();break;
  case 'bstop':clearInterval(B.iv);B.run=false;B.over=true;render();break;
  case 'bnext':B.over=false;st.sel=(st.sel+1)%st.teams;save();render();break;
 }
}
document.addEventListener('keydown',function(e){
 if(HOST||e.target.closest('input,textarea'))return;
 if(e.key==='Escape'){document.getElementById('kov').hidden=true;return}
 if(V.indexOf('ans/')===0)return;
 if(V==='body'){if(B.run&&e.key==='ArrowRight'){e.preventDefault();app.querySelector('[data-a="bok"]').click()}return}
 if(e.key==='ArrowRight'){e.preventDefault();next(V);resetQ();render()}
 else if(e.key===' '&&V!=='balance'){e.preventDefault();G[V].show=!G[V].show;render()}
});
document.getElementById('sov').addEventListener('click',function(e){var t=e.target.closest('button');if(t)act(t.dataset);else if(e.target.id==='sov')e.currentTarget.hidden=true});
document.getElementById('kX').addEventListener('click',function(){document.getElementById('kov').hidden=true});
if(HOST)hostInit();else render();
/* 강사가 방을 만들 때 정한 조 이름이 있으면 점수판·학생 폰 조를 그 이름으로 (방 연결된 노트북) */
function roomTeams(){if(!HOST&&window.TM_SYNC&&TM_SYNC.teams)TM_SYNC.teams(function(T){if(!T||T.length<2)return;var n=Math.min(8,T.length),ch=st.teams!==n;
 for(var i=0;i<n;i++){if(st.tname[i]!==T[i])ch=true;st.tname[i]=String(T[i]).slice(0,12)}st.teams=n;if(st.sel>=n)st.sel=0;if(ch){st.score=[0,0,0,0,0,0,0,0];save();render()}})}
roomTeams();setInterval(roomTeams,20000); /* 강사가 수업 중 조 이름을 바꿔도 따라감 */
})();
</script>
</body></html>
