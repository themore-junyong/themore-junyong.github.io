:root{

:root[data-theme="dark"]{

p{margin:0} .soft{color:var(--soft)}

.brand small{letter-spacing:.12em;font-weight:700;color:var(--blue);font-size:.78rem}

.btn{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:10px 16px;font-weight:700;color:var(--ink)}
.btn.pri{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}

textarea,input{border:1px solid var(--line);background:var(--field);border-radius:4px;padding:10px 12px;box-sizing:border-box}
textarea{width:100%;min-height:150px;resize:vertical}
input[type=number]{width:80px}
.split{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;align-items:start}

.order li{background:var(--field);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:1.1rem;animation:pop .3s both}
.order li b{color:var(--blue);margin-right:6px}
.order li.done{opacity:.45;text-decoration:line-through}
.clock{font-size:clamp(5rem,22vw,15rem);font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.clock.warn{color:var(--bad);animation:blink 1s infinite}
.clock.over{color:var(--bad)}
@keyframes blink{50%{opacity:.55}}
.pbar{height:14px;background:var(--line);border-radius:7px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--blue);transition:width .3s linear}
.pbar.warn i{background:var(--bad)}
.label{font-size:clamp(1.2rem,3vw,2rem);font-weight:900;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.note{font-size:.88rem;color:var(--soft)}

.vs .side.on{background:var(--c);color:#fff;transform:scale(1.03)}
.vs .mid{display:flex;align-items:center;font-size:clamp(1.6rem,4vw,3rem);font-weight:900;color:var(--soft)}

.cat{display:inline-block;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:4px 14px;font-weight:900;font-size:1rem}
.big{font-size:clamp(3rem,13vw,9rem);font-weight:900;text-align:center;line-height:1.15;letter-spacing:.06em;word-break:keep-all}
.emo{font-size:clamp(3.2rem,12vw,8rem);text-align:center;line-height:1.2;letter-spacing:.08em}
.ans{font-size:clamp(1.6rem,4.5vw,3rem);font-weight:900;text-align:center;color:var(--ok);animation:pop .3s both}

var COLORS=['#e5484d','#2f80ed','#2e9e5b','#f2a20c','#8e4ec6','#12a4b5'];
var st={teams:4,score:[0,0,0,0,0,0],tname:['A팀','B팀','C팀','D팀','E팀','F팀'],sel:0,cat:{balance:'전체',chosung:'전체',emoji:'전체',body:'전체'},bodySec:60};
try{var sv=JSON.parse(localStorage.getItem('ice-v1')||'{}');st=Object.assign(st,sv);st.cat=Object.assign({balance:'전체',chosung:'전체',emoji:'전체',body:'전체'},sv.cat||{})}catch(e){}
function save(){try{localStorage.setItem('ice-v1',JSON.stringify(st))}catch(e){}}
var BANK={balance:BAL,chosung:CHO,emoji:EMO,body:BODY};
var G={}; /* 게임별 덱·현재 문제 */
function pool(v){var b=BANK[v],c=st.cat[v];var out=[];Object.keys(b).forEach(function(k){if(c==='전체'||c===k)b[k].forEach(function(x){out.push({cat:k,x:x})})});return out}
function deal(v){var g=G[v]||(G[v]={});g.deck=shuffle(pool(v));g.i=0;g.show=false;g.pick=null;g.done=0}
function cur(v){var g=G[v];if(!g||!g.deck)deal(v);g=G[v];return g.deck[g.i]}
function next(v){var g=G[v];g.i++;g.show=false;g.pick=null;if(g.i>=g.deck.length){deal(v);G[v].done=1}}

var V=(location.hash||'').slice(1)||'balance';
window.addEventListener('hashchange',function(){V=(location.hash||'').slice(1)||'balance';stopT();render()});
var TABS=[['balance','⚖️ 밸런스 게임'],['chosung','🔤 초성 퀴즈'],['emoji','😀 이모지 퀴즈'],['body','🙆 몸으로 말해요']];

function head(){return '<div class="top"><div class="brand"><small>위듀케이션 · 아이스브레이킹</small></div><div class="row"><button class="btn" data-a="fs">⛶ 전체 화면</button><a href="./">← 도구 모음</a></div></div>'+
 '<div class="tabs">'+TABS.map(function(x){return '<a href="#'+x[0]+'"'+(V===x[0]?' aria-current="page"':'')+'>'+x[1]+'</a>'}).join('')+'</div>'}
function cats(v){return '<div class="chips">'+['전체'].concat(Object.keys(BANK[v])).map(function(k){var on=st.cat[v]===k;return '<button data-cat="'+esc(k)+'" style="'+(on?'background:var(--blue);color:var(--blue-ink)':'')+'">'+esc(k)+'</button>'}).join('')+'</div>'}
function count(v){var g=G[v];return '<span class="note">'+(g.i+1)+' / '+g.deck.length+(g.done?' · 한 바퀴 돌아서 다시 섞었어요':'')+'</span>'}
function hit(){var h='<div class="hit">';for(var i=0;i<st.teams;i++)h+='<button data-hit="'+i+'" style="--c:'+COLORS[i]+'">'+esc(st.tname[i])+' +1</button>';return h+'</div>'}
function board(){
 var h='<div class="card"><div class="row" style="justify-content:space-between"><h3>팀 점수</h3><div class="row" style="gap:6px"><span class="note">팀 수</span>'+[2,3,4,5,6].map(function(n){return '<button class="btn" data-tn="'+n+'" style="padding:4px 12px;'+(st.teams===n?'background:var(--blue);color:var(--blue-ink);border-color:var(--blue)':'')+'">'+n+'</button>'}).join('')+'<button class="btn" data-a="zero" style="padding:4px 12px">0점으로</button></div></div><div class="score">';
 for(var i=0;i<st.teams;i++)h+='<div class="sc'+(V==='body'&&st.sel===i?' sel':'')+'" style="--c:'+COLORS[i]+'"><b data-ren="'+i+'" title="눌러서 이름 바꾸기">'+esc(st.tname[i])+'</b><div class="n">'+st.score[i]+'</div><div class="row"><button class="btn" data-sc="'+i+'" data-d="-1">−</button><button class="btn" data-sc="'+i+'" data-d="1">+</button></div></div>';
 return h+'</div><p class="note">팀 이름을 누르면 바꿀 수 있어요. 점수는 이 기기에만 저장돼요.</p></div>';
}

/* ───── 밸런스 게임 ───── */
function balance(){
 var q=cur('balance'),g=G.balance,p=q.x;
 return head()+'<div class="card"><div class="row" style="justify-content:space-between">'+cats('balance')+count('balance')+'</div>'+
  '<div style="text-align:center"><span class="cat">'+esc(q.cat)+'</span></div>'+
  '<div class="vs"><div class="side'+(g.pick===0?' on':'')+'" data-side="0" style="--c:#e5484d">'+esc(p[0])+'</div><div class="mid">VS</div><div class="side'+(g.pick===1?' on':'')+'" data-side="1" style="--c:#2f80ed">'+esc(p[1])+'</div></div>'+
  '<div class="rule">진행: 셋 세면 동시에 손으로 고르기(왼손 = 왼쪽, 오른손 = 오른쪽) → 적은 쪽에서 한 명이 이유 한마디 → 많은 쪽에서 한 명이 반박 한마디. 화면의 칸을 누르면 많이 고른 쪽이 표시돼요.</div>'+
  '<div class="row" style="justify-content:center"><button class="btn pri big" data-a="next">다음 질문 →</button></div></div>'+board();
}
/* ───── 초성 퀴즈 ───── */
function chosung(){
 var q=cur('chosung'),g=G.chosung,w=q.x;
 return head()+'<div class="card"><div class="row" style="justify-content:space-between">'+cats('chosung')+count('chosung')+'</div>'+
  '<div style="text-align:center"><span class="cat">'+esc(q.cat)+' · '+w.replace(/\s/g,'').length+'글자</span></div>'+
  '<div class="big">'+esc(cho(w))+'</div>'+
  '<div class="ans'+(g.show?'':' hide')+'">'+esc(w)+'</div>'+timerBox(30)+
  '<div class="row" style="justify-content:center"><button class="btn big" data-a="show">'+(g.show?'정답 가리기':'정답 보기')+'</button><button class="btn pri big" data-a="next">다음 문제 →</button></div>'+
  (g.show?hit():'')+'<p class="note" style="text-align:center">손 먼저 든 팀이 답해요. 틀리면 다른 팀에게 기회가 넘어가요. 키보드: 스페이스 = 정답 보기, → = 다음</p></div>'+board();
}
/* ───── 이모지 퀴즈 ───── */
function emoji(){
 var q=cur('emoji'),g=G.emoji;
 return head()+'<div class="card"><div class="row" style="justify-content:space-between">'+cats('emoji')+count('emoji')+'</div>'+
  '<div style="text-align:center"><span class="cat">'+esc(q.cat)+'</span></div>'+
  '<div class="emo">'+esc(q.x[0])+'</div>'+
  '<div class="ans'+(g.show?'':' hide')+'">'+esc(q.x[1])+'</div>'+timerBox(30)+
  '<div class="row" style="justify-content:center"><button class="btn big" data-a="show">'+(g.show?'정답 가리기':'정답 보기')+'</button><button class="btn pri big" data-a="next">다음 문제 →</button></div>'+
  (g.show?hit():'')+'<p class="note" style="text-align:center">이모지만 보고 맞히기. 비슷하게 말해도 강사가 인정하면 정답이에요.</p></div>'+board();
}
/* ───── 몸으로 말해요 ───── */
var B={run:false,end:0,iv:null,ok:0,pass:0,hide:false,over:false};
function body(){
 var q=cur('body'),left=B.run?Math.max(0,(B.end-Date.now())/1000):st.bodySec,tn=esc(st.tname[st.sel]);
 var h=head()+'<div class="card"><div class="row" style="justify-content:space-between">'+cats('body')+'<span class="note">이번 차례: <b style="color:'+COLORS[st.sel]+'">'+tn+'</b></span></div>';
 if(!B.run&&!B.over){
  h+='<div class="rule">진행: 설명하는 사람 한 명만 화면을 보고, 같은 팀은 그 사람을 봐요. 말과 소리는 금지, 몸으로만! 맞히면 [맞혔다], 어려우면 [패스]. 시간 안에 많이 맞힌 팀이 이겨요.</div>'+
   '<div class="chips" style="justify-content:center">'+[...Array(st.teams).keys()].map(function(i){return '<button data-sel="'+i+'" style="border-color:'+COLORS[i]+';'+(st.sel===i?'background:'+COLORS[i]+';color:#fff':'')+'">'+esc(st.tname[i])+'</button>'}).join('')+'</div>'+
   '<div class="chips" style="justify-content:center">'+[60,90,120].map(function(s){return '<button data-bs="'+s+'" style="'+(st.bodySec===s?'background:var(--blue);color:var(--blue-ink)':'')+'">'+s+'초</button>'}).join('')+'</div>'+
   '<div class="row" style="justify-content:center"><button class="btn pri big" data-a="bgo">▶ '+tn+' 시작</button></div>';
 }else if(B.run){
  h+='<div class="mini'+(left<=10?' warn':'')+'" id="bclock">'+Math.ceil(left)+'초</div>'+
   '<div style="text-align:center"><span class="cat">'+esc(q.cat)+'</span></div>'+
   '<div class="big'+(B.hide?' blank':'')+'" style="letter-spacing:0">'+esc(q.x)+'</div>'+
   '<div class="row" style="justify-content:center"><button class="btn pri big" data-a="bok">⭕ 맞혔다 ('+B.ok+')</button><button class="btn big" data-a="bpass">패스 ('+B.pass+')</button><button class="btn" data-a="bhide">'+(B.hide?'단어 보이기':'단어 가리기')+'</button><button class="btn" data-a="bstop">끝내기</button></div>';
 }else{
  h+='<div class="stage" style="flex-direction:column;gap:8px"><div style="font-size:.45em;color:var(--ink)">'+tn+'</div>'+B.ok+'개 맞힘!</div>'+
   '<p class="note" style="text-align:center">맞힌 개수만큼 '+tn+' 점수에 더했어요. 패스 '+B.pass+'개.</p>'+
   '<div class="row" style="justify-content:center"><button class="btn pri big" data-a="bnext">다음 팀 준비 →</button></div>';
 }
 return h+'</div>'+board();
}
function btick(){var l=(B.end-Date.now())/1000,c=document.getElementById('bclock');
 if(l<=0){stopT();B.run=false;B.over=true;beep();render();return}
 if(c){c.textContent=Math.ceil(l)+'초';c.className='mini'+(l<=10?' warn':'')}}

/* 작은 타이머(초성·이모지) */
var T={left:null,run:false,end:0,iv:null};
function timerBox(sec){var l=T.left==null?sec:T.left;T.sec=sec;
 return '<div class="row" style="justify-content:center"><span class="mini'+(T.left!=null&&l<=5?' warn':'')+'" id="qclock">'+(T.left==null?'⏱ '+sec+'초':Math.max(0,Math.ceil(l))+'초')+'</span><button class="btn" data-a="qt">'+(T.run?'멈춤':'⏱ '+sec+'초 재기')+'</button></div>'}
function qtick(){T.left=(T.end-Date.now())/1000;var c=document.getElementById('qclock');
 if(T.left<=0){stopT();T.left=0;beep();render();return}
 if(c){c.textContent=Math.ceil(T.left)+'초';c.className='mini'+(T.left<=5?' warn':'')}}
function stopT(){clearInterval(T.iv);T.run=false;clearInterval(B.iv)}
function resetQ(){clearInterval(T.iv);T.run=false;T.left=null}

var AC=null;
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(function(d){var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.0001,AC.currentTime+d);g.gain.exponentialRampToValueAtTime(.4,AC.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d+.3);o.start(AC.currentTime+d);o.stop(AC.currentTime+d+.32)})}catch(e){}}
function unlock(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}

function render(){var f={balance:balance,chosung:chosung,emoji:emoji,body:body}[V];if(!f){V='balance';f=balance}app.innerHTML=f()}

app.addEventListener('click',function(e){
 var t=e.target.closest('button,[data-side],[data-ren]');if(!t)return;var d=t.dataset;
 if(d.cat){st.cat[V]=d.cat;save();deal(V);resetQ();return render()}
 if(d.side!=null){var g=G.balance;g.pick=g.pick===+d.side?null:+d.side;return render()}
 if(d.ren!=null){var n=prompt('팀 이름',st.tname[+d.ren]);if(n&&n.trim()){st.tname[+d.ren]=n.trim().slice(0,12);save();render()}return}
 if(d.sc!=null){st.score[+d.sc]=Math.max(0,st.score[+d.sc]+(+d.d));save();return render()}
 if(d.tn){st.teams=+d.tn;if(st.sel>=st.teams)st.sel=0;save();return render()}
 if(d.hit!=null){st.score[+d.hit]++;save();next(V);resetQ();return render()}
 if(d.sel!=null){st.sel=+d.sel;save();return render()}
 if(d.bs){st.bodySec=+d.bs;save();return render()}
 switch(d.a){
  case 'fs':if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();break;
  case 'zero':if(confirm('모든 팀 점수를 0점으로 할까요?')){st.score=[0,0,0,0,0,0];save();render()}break;
  case 'next':next(V);resetQ();render();break;
  case 'show':G[V].show=!G[V].show;if(G[V].show){clearInterval(T.iv);T.run=false}render();break;
  case 'qt':unlock();if(T.run){clearInterval(T.iv);T.run=false}else{var l=T.left==null||T.left<=0?T.sec:T.left;T.end=Date.now()+l*1000;T.left=l;T.run=true;T.iv=setInterval(qtick,200)}render();break;
  case 'bgo':unlock();B={run:true,end:Date.now()+st.bodySec*1000,ok:0,pass:0,hide:false,over:false};next('body');B.iv=setInterval(btick,200);render();break;
  case 'bok':B.ok++;st.score[st.sel]++;save();next('body');render();break;
  case 'bpass':B.pass++;next('body');render();break;
  case 'bhide':B.hide=!B.hide;render();break;
  case 'bstop':clearInterval(B.iv);B.run=false;B.over=true;render();break;
  case 'bnext':B.over=false;st.sel=(st.sel+1)%st.teams;save();render();break;
 }
});
document.addEventListener('keydown',function(e){
 if(e.target.closest('input,textarea'))return;
 if(V==='body'){if(B.run&&e.key==='ArrowRight'){e.preventDefault();app.querySelector('[data-a="bok"]').click()}return}
 if(e.key==='ArrowRight'){e.preventDefault();next(V);resetQ();render()}
 else if(e.key===' '&&V!=='balance'){e.preventDefault();G[V].show=!G[V].show;render()}
});
render();
})();
</script>
</body></html>
