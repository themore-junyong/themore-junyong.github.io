<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>위듀케이션 취업 연구소 · 선생님</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="font.css"><style>
/* 강사 입구: 방 만들기(필수) → 방 번호·학생 QR·수업 활동 모음 */
:root{
  --bg:#f6f6f6; --ink:#333; --soft:#6f7480; --card:#fff; --line:#e2e3e8; --field:#fbfbfc;
  --blue:#4e6bf1; --blue-ink:#fff; --blue-soft:#e9edfe; --ok:#2e8b4c; --bad:#c8432f;
  --f:"SCDream","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642; --field:#1a1d23;
  --blue:#7c93ff; --blue-ink:#10121a; --blue-soft:#262d4a; --ok:#5cc47c; --bad:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642; --field:#1a1d23;
  --blue:#7c93ff; --blue-ink:#10121a; --blue-soft:#262d4a; --ok:#5cc47c; --bad:#ff7a63; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;line-height:1.3} h1{font-size:1.6rem;font-weight:900} h3{font-size:1.05rem}
p{margin:0} .soft{color:var(--soft)}
button,input,textarea{font:inherit;color:inherit} button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top a{color:var(--blue);font-weight:700;text-decoration:none}
.brand small{letter-spacing:.12em;font-weight:700;color:var(--blue);font-size:.78rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs a{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;font-weight:700;color:var(--ink);text-decoration:none}
.tabs a[aria-current="page"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:10px 16px;font-weight:700;color:var(--ink)}
.btn.pri{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn.big{font-size:1.2rem;padding:14px 28px}
.btn:disabled{opacity:.45;cursor:not-allowed}
textarea,input{border:1px solid var(--line);background:var(--field);border-radius:4px;padding:10px 12px;box-sizing:border-box}
textarea{width:100%;min-height:150px;resize:vertical}
input[type=number]{width:80px}
.split{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.team{border-radius:10px;padding:14px;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card))}
.team h3{color:var(--c);font-size:1.3rem;font-weight:900;display:flex;justify-content:space-between}
.team ul{margin:8px 0 0;padding:0;list-style:none;font-size:1.25rem;font-weight:700;line-height:1.7}
.team li{animation:pop .35s both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.stage{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(2.4rem,9vw,6rem);font-weight:900;color:var(--blue);border-radius:10px;background:var(--blue-soft);padding:20px}
.stage.spin{color:var(--soft)}
.order{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.order li{background:var(--field);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:1.1rem;animation:pop .3s both}
.order li b{color:var(--blue);margin-right:6px}
.order li.done{opacity:.45;text-decoration:line-through}
.clock{font-size:clamp(5rem,22vw,15rem);font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.clock.warn{color:var(--bad);animation:blink 1s infinite}
.clock.over{color:var(--bad)}
@keyframes blink{50%{opacity:.55}}
.pbar{height:14px;background:var(--line);border-radius:7px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--blue);transition:width .3s linear}
.pbar.warn i{background:var(--bad)}
.label{font-size:clamp(1.2rem,3vw,2rem);font-weight:900;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:8px 16px;font-weight:700}
.chips button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.note{font-size:.88rem;color:var(--soft)}
:fullscreen .wrap{max-width:none;padding:24px}
:fullscreen{background:var(--bg)}

.pinbig{font-size:clamp(4rem,14vw,8rem);font-weight:900;letter-spacing:.12em;color:var(--blue);line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.g{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:14px;color:var(--ink);text-decoration:none}
.g b{font-size:1.05rem}.g span{color:var(--soft);font-size:.9rem}.g:hover{border-color:var(--blue)}
input.w{width:100%}
.glabel{font-weight:800;font-size:.95rem;color:var(--soft);margin-top:6px}
.gfold{border-bottom:1px solid var(--line);padding-bottom:6px}.gfold>summary.glabel{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:8px 2px;font-size:1.02rem;color:var(--ink)}
.gfold>summary::-webkit-details-marker{display:none}.gfold>summary::before{content:'▶';font-size:.75rem;color:var(--soft);transition:transform .15s}
.gfold[open]>summary::before{transform:rotate(90deg)}.gfold[open]>.list{margin-bottom:8px}
.g[data-on]{border-color:var(--blue)}
.list{display:flex;flex-direction:column;gap:8px}.list .g{width:100%;box-sizing:border-box}
.bad{color:var(--bad)}
#qrov{position:fixed;inset:0;z-index:50;background:#fff;color:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
#qrov[hidden]{display:none}
#qrov h2{font-size:clamp(1.4rem,4vw,2.6rem);font-weight:900}
#qrov .p{font-size:clamp(2rem,6vw,4rem);font-weight:900;color:#4e6bf1;letter-spacing:.1em}
#qrbox{width:min(58vh,86vw);height:min(58vh,86vw)}#qrbox img,#qrbox canvas{width:100%!important;height:100%!important}
#qrov .x{position:absolute;top:12px;right:16px;font-size:2rem;background:none;border:0;cursor:pointer;color:#222}
.tnames{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tnames input{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:4px;padding:8px 10px;font:inherit;font-weight:700;min-width:0}
</style>
</head><body>
<div class="wrap" id="app"><p class="soft">불러오는 중…</p></div>
<div id="qrov" hidden role="dialog" aria-label="학생 입장 QR"><button class="x" id="qrX" aria-label="닫기">✕</button><h2 id="qrH">📱 휴대폰 카메라로 찍고 들어오세요</h2><div class="p" id="qrP"></div><div id="qrbox"></div><div id="qrU" style="font-weight:700"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="tests.js"></script>
<script type="module">
import { firebaseConfig } from './firebase-config.js';
const V='10.12.2', G=`https://www.gstatic.com/firebasejs/${V}`;
const SITE='https://themore-junyong.github.io/tools/';
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let F,db,me,call;
async function boot(){
  const { initializeApp } = await import(`${G}/firebase-app.js`);
  const A=await import(`${G}/firebase-auth.js`), D=await import(`${G}/firebase-firestore.js`), Fn=await import(`${G}/firebase-functions.js`);
  const fa=initializeApp(firebaseConfig), auth=A.getAuth(fa);
  await auth.authStateReady(); if(!auth.currentUser)await A.signInAnonymously(auth);
  me=auth.currentUser.uid; db=D.getFirestore(fa); F=D;
  call=(name,data)=>Fn.httpsCallable(Fn.getFunctions(fa,'asia-northeast3'),name,{timeout:20000})(data).then(r=>r.data);
}
const msg=e=>(e&&e.message&&!/^(internal|INTERNAL)$/.test(e.message))?e.message:'연결이 끊겼어요. 다시 눌러 주세요';
/* 학생 AI 초대코드: 방을 만든 강사 코드(ak)를 방 문서에 둠 → 방에 들어온 학생은 코드 입력 없이 AI 도구를 씀 (room.js) */
/* 방 = 실시간 마인드맵과 같은 rooms/{번호}. 이 노트북에 기억(live-host)해서 마인드맵 강사 화면도 같은 방을 씀 */
/* 조: 강사가 방을 만들 때 조 개수·이름을 정함 → 방 문서 teams. 학생은 들어올 때 그중에서 고름 */
const dflT=n=>Array.from({length:n},(_,i)=>(i+1)+'조');
let TM=(()=>{const t=lsGet('tm-teams',null);return Array.isArray(t)&&t.length>=2&&t.length<=8?t:dflT(4)})();
function teamsForm(){
  return '<div class="f"><b>조 나누기</b><span class="note">학생이 들어올 때 "나는 몇 조?"를 골라요. 결과·게임 통계가 조별로 모여요.</span>'+
   '<div class="chips" role="group" aria-label="조 개수"><span class="note" style="align-self:center">조 개수</span>'+[0,2,3,4,5,6,7,8].map(n=>'<button data-tn="'+n+'" aria-pressed="'+(n===TM.length)+'">'+(n?n+'개':'조 없음')+'</button>').join('')+'</div>'+
   (TM.length?'<div class="tnames">'+TM.map((n,i)=>'<input data-ti="'+i+'" value="'+esc(n)+'" maxlength="12" aria-label="'+(i+1)+'번째 조 이름">').join('')+'</div><span class="note">칸을 눌러 조 이름을 바꿀 수 있어요. 예: 열정조, 1모둠</span>':'')+'</div>'}
function readTM(){document.querySelectorAll('[data-ti]').forEach(x=>{const v=x.value.trim().slice(0,12);TM[+x.dataset.ti]=v||((+x.dataset.ti+1)+'조')});
  const seen={};TM=TM.map((n,i)=>seen[n]?n+'-'+(i+1):(seen[n]=1,n))}
function saveTeams(){readTM();lsSet('tm-teams',TM);mySave({teams:TM});return F.updateDoc(F.doc(db,'rooms',S.pin),{teams:TM})}
const S={name:lsGet('tm-teacher',''),code:(lsGet('tm-code',{})||{}).code||'',pin:'',exp:0,note:'',busy:false};
/* 내 수업함(teachers/{초대코드}): 강사마다 자기 초대코드로 저장 → 같은 코드면 어느 컴퓨터에서나 그대로, 다른 강사(다른 코드)와는 섞이지 않음.
   여기엔 ⭐ 자주 쓰는 활동·조 이름, 실시간 마인드맵(live.html)엔 질문 묶음을 저장 */
let MY=null;
async function myLoad(){if(!S.code||!F)return;try{const d=await F.getDoc(F.doc(db,'teachers',S.code));MY=d.exists()?d.data():{};
  if(Array.isArray(MY.teams)&&!S.pin&&(MY.teams.length===0||MY.teams.length>=2))TM=MY.teams.slice(0,8);
  if(!S.name&&MY.name)S.name=MY.name;render()}catch(e){MY=null}}
function mySave(p){if(!MY||!S.code||!F)return;Object.assign(MY,p);F.setDoc(F.doc(db,'teachers',S.code),Object.assign({},p,{t:F.serverTimestamp()}),{merge:true}).catch(()=>{})}
/* 활동 묶음 접기·펴기 상태(이 노트북 tm-gopen) */
const GOPEN=lsGet('tm-gopen',{})||{};
const FAV=()=>(MY&&Array.isArray(MY.fav))?MY.fav:[];
/* 수업 활동 목록(학생 첫 화면과 같은 묶음). 누르면 방에 들어온 학생 화면이 따라오고, 강사 노트북엔 같은 화면이 새 탭으로 열림
   q: 학생 도구(학생 화면 전환 + 강사 미리보기 탭) · live: 마인드맵(진행 화면 새 탭 + 학생은 답하기 화면) · b: 빔으로 하는 게임(게임 화면 새 탭 + 학생 폰은 play.html로 같은 문제·점수를 실시간으로) · pick: 검사 고르기 */
const GROUPS=[
 ['자소서 · 면접 준비',[
  ['q','#jaso','📝 AI 자소서 만들기','8단계 질문 → AI 초안 · 완성본이 학생 결과로'],
  ['q','interview.html','🎤 AI 모의면접','질문 → 피드백 → 꼬리질문 · 점수표가 학생 결과로'],
  ['q','color.html','🎨 퍼스널컬러 진단','옷 색(천 드레이핑) · 립 색(사진 속 입술 색 바꾸기) 두 가지 → 진단서가 학생 결과로'],
  ['q','intro.html','🗣 1분 자기소개 꼬꼬무','질문에 답하면 1분 멘트 완성']]],
 ['수업 게임 · 참여',[
  ['live','live.html?host','📊 실시간 마인드맵 · 투표','진행 화면이 새 탭으로 · 학생은 휴대폰으로 답하기'],
  ['b','icebreak.html','🎲 아이스브레이킹','밸런스 · 초성 · 이모지 · 몸으로 말해요 · 학생 폰에도 같은 문제'],
  ['b','river.html','🚣 문제해결 강건너기','3단계 퍼즐 · 학생 폰에도 같은 상황'],
  ['b','line.html','🔢 스트림 게임','숫자 줄 세우기 · 강사가 숫자를 부르면 학생은 폰 칸에 하나씩 · 이어 커지는 줄 점수 · 조별 순위'],
  ['b','class.html','👥 교실 도구','팀 나누기 · 한 명 뽑기 · 타이머 · 학생 폰에도 같이']]],
 ['나를 알아보는 검사',[
  ['pick','','🧭 자가진단 검사 10종','누르면 검사를 골라요 · 결과가 학생 결과로'],
  ['q','health.html','💪 생활습관 점검','33문항 → 내 약점 2곳 · 7일 실천']]],
 ['비즈니스',[
  ['q','sme.html','🏭 중소기업 이해','오해 깨기 O/X 10문제 · 반·조별 정답률 · 회사 조사 체크'],
  ['q','company.html','🔎 좋은 회사 찾기','조건 경매(조마다 100만 원) → 기업 탐정 보고서 · 조별 보고서를 빔에 크게'],
  ['q','manner.html','🤝 비즈니스 매너','첫 출근 상황 퀴즈 13문제(인사·전화·명함·소개·상석) · 3코스 확인표']]],
 ['AI 수업',[
  ['q','ai.html','🤖 AI 수업 도구 6종','프롬프트 연습장 · AI 거짓말 찾기 · 요청문 만들기 등']]]
];
function item(a){
  const [k,to,t,d]=a,st=' style="text-align:left;font:inherit"';
  if(S.favEdit){const key=to||'pick',on=FAV().indexOf(key)>=0;return '<button class="g" data-fv="'+esc(key)+'" aria-pressed="'+on+'"'+st+(on?' data-on="1"':'')+'><b>'+(on?'⭐ ':'☆ ')+t+'</b><span>'+(on?'자주 쓰는 것에 들어 있어요 · 누르면 빼요':'누르면 자주 쓰는 것에 넣어요')+'</span></button>'}

  if(k==='pick')return '<button class="g" data-pick="1" aria-expanded="'+!!S.pick+'"'+st+(S.pick?' data-on="1"':'')+'><b>'+t+(S.pick?' ▲':' ▼')+'</b><span>'+d+'</span></button>';
  return '<a class="g" href="'+to+'" target="_blank" rel="noopener" data-live="'+to+'" data-qn="'+esc(t)+'">'+in_+'</a>';
}
const TST=[['riasec','직업흥미'],['big5','Big Five 성격'],['enneagram','에니어그램'],['values','직업가치관'],['strength','강점 24'],['conflict','갈등 대처'],['resil','회복탄력성'],['coping','스트레스 대처'],['mindset','성장 마인드셋'],['literacy','직장 문해력'],['mbti','MBTI형 16유형'],['animal','DISC 행동유형'],['teamrole','팀 역할'],['eq','감성지능 EQ'],['attach','관계 애착'],['appreciate','인정의 언어'],['selfesteem','자존감'],['grit','그릿(끈기)'],['burnout','번아웃'],['stressidx','스트레스 지수'],['study','공부 스타일'],['timetype','시간 관리']];
function render(){
  let h='<div class="top"><div class="brand"><small>위듀케이션 취업 연구소</small></div><a href="./">학생 첫 화면 보기 →</a></div>';
  if(!S.pin){
    h+='<div class="card"><h1>오늘 수업 방 만들기</h1><p class="soft">여러 반이 동시에 써도 섞이지 않도록 <b>수업마다 방을 먼저 만들어요.</b> 학생은 빔에 띄운 QR(방 번호가 들어 있어요)로 들어와요. 방은 8시간 뒤 자동으로 닫혀요.</p>'+
     '<div class="f"><label for="who"><b>강사 이름</b></label><input id="who" class="w" placeholder="예: 김준용" value="'+esc(S.name)+'" maxlength="12"></div>'+
     '<div class="f"><label for="code"><b>초대코드</b> <span class="note">(위듀케이션에서 받은 코드. 맞아야 방이 열려요)</span></label><input id="code" class="w" value="'+esc(S.code)+'" placeholder="예: WEDU-0000" autocomplete="off"></div>'+
     teamsForm()+
     '<button class="btn pri big" data-a="make"'+(S.busy?' disabled':'')+'>'+(S.busy?'만드는 중…':'🏠 방 만들기')+'</button>'+(S.note?'<p class="bad">'+esc(S.note)+'</p>':'')+'</div>';

  const teams=(S.teams||[]).concat(['조 없음']);
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
  const bar=(lab,v,max,txt,hi)=>'<div style="display:grid;grid-template-columns:minmax(7em,11em) 1fr 4.5em;gap:8px;align-items:center;font-size:.92rem"><span>'+lab+'</span><span style="height:14px;background:var(--line);border-radius:7px;overflow:hidden"><i style="display:block;height:100%;width:'+(max&&v?Math.max(2,v/max*100):0)+'%;background:'+(hi?'var(--ok,#2e8b4c)':'var(--blue)')+';border-radius:7px"></i></span><b style="text-align:right">'+txt+'</b></div>';
  const count=(L,f)=>{const c={};L.forEach(x=>{const k=f(x);if(k!=null)c[k]=(c[k]||0)+1});return c};
  const teamTable=(L,cols,val,fmt)=>{const T2=teams.filter(t=>L.some(x=>x.team===t));if(T2.length<2)return '';
    return '<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:.9rem"><thead><tr><th style="text-align:left;padding:6px">조</th><th style="padding:6px">인원</th>'+cols.map(c=>'<th style="padding:6px">'+c[1]+'</th>').join('')+'</tr></thead><tbody>'+
      T2.map(t=>{const M=L.filter(x=>x.team===t);return '<tr style="border-top:1px solid var(--line)"><td style="padding:6px;font-weight:700">'+esc(t)+'</td><td style="padding:6px;text-align:center">'+M.length+'</td>'+cols.map(c=>'<td style="padding:6px;text-align:center">'+fmt(M,c[0])+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>'};
  let h='<div class="card"><div class="row" style="justify-content:space-between"><h3>📊 검사 반 통계</h3><span class="note">검사를 마친 학생 점수를 모아 보여 줘요. 학생이 마칠 때마다 바로 바뀌어요.</span></div>';

    let b='';
    if(T.kind==='quiz'){const pc=L.map(x=>Math.round(x.s.ok/x.s.n*100));
      b+=bar('반 평균 정답률',avg(pc),100,avg(pc)+'%')+'<p class="note">최고 '+Math.max(...pc)+'% · 최저 '+Math.min(...pc)+'%</p>'+teamTable(L,[['p','평균 정답률']],0,(M)=>avg(M.map(x=>Math.round(x.s.ok/x.s.n*100)))+'%');
    }else if(T.show==='type16'){const c=count(L,x=>x.c),top=Object.keys(c).sort((a,b)=>c[b]-c[a]),mx=c[top[0]]||1;
      b+='<b>유형별 인원</b>'+top.map((t,i)=>bar(t+' '+esc((T.types[t]||{}).nick||''),c[t],mx,c[t]+'명',i===0)).join('');
      b+='<b>네 가지 기준 (반 전체)</b>'+dk.map(d=>{const D=T.dims[d],na=L.filter(x=>x.s[d]>=50).length;return bar(D.emoji+' '+D.a+' '+D.an+' / '+D.b+' '+D.bn,na,n,D.a+' '+na+' · '+D.b+' '+(n-na))}).join('');
      b+=teamTable(L,dk.map(d=>[d,T.dims[d].a+'/'+T.dims[d].b]),0,(M,d)=>{const na=M.filter(x=>x.s[d]>=50).length;return T.dims[d].a+na+' · '+T.dims[d].b+(M.length-na)});
    }else if(T.show==='level'){const d=dk[0],v=L.map(x=>x.s[d]),lv=x=>(T.levels.filter(l=>x>=l[0])[0]||[])[1],c=count(L,x=>lv(x.s[d]));
      b+=bar('반 평균',avg(v),100,avg(v)+'점')+'<b>수준별 인원</b>'+T.levels.map(l=>bar(l[1],c[l[1]]||0,n,(c[l[1]]||0)+'명')).join('')+teamTable(L,[[d,'평균']],0,(M,dd)=>avg(M.map(x=>x.s[dd]))+'점');
    }else{const av={};dk.forEach(d=>av[d]=avg(L.map(x=>x.s[d]||0)));const order=dk.slice().sort((a,b)=>av[b]-av[a]);
      if(T.show!=='profile'){const c=count(L,x=>x.c),mx=Math.max(1,...Object.values(c));b+='<b>1위 유형별 인원</b>'+order.filter(d=>c[d]).sort((a,b)=>c[b]-c[a]).map((d,i)=>bar((T.dims[d].emoji||'')+' '+esc(T.dims[d].name),c[d],mx,c[d]+'명',i===0)).join('')}
      b+='<b>척도별 반 평균</b>'+order.map((d,i)=>bar((T.dims[d].emoji||'')+' '+esc(T.dims[d].name),av[d],100,av[d]+'점',i===0)).join('');
      b+=teamTable(L,order.slice(0,8).map(d=>[d,(T.dims[d].emoji||'')+' '+T.dims[d].name]),0,(M,d)=>avg(M.map(x=>x.s[d]||0)));
    }
    h+='<details data-st="'+esc(k)+'" style="border-top:1px solid var(--line);padding-top:8px"'+(op?' open':'')+'><summary style="cursor:pointer;font-weight:800">'+T.emoji+' '+esc(T.title)+' <span class="note">'+n+'명</span></summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">'+b+'</div></details>';
  });
  if(old)h+='<p class="note">통계 기능이 생기기 전에 받은 결과 '+old+'개는 빠져 있어요.</p>';
  return h+'</div>';
}

  document.getElementById('qrP').textContent='방 번호 '+S.pin;document.getElementById('qrU').textContent=u.replace('https://','');b.innerHTML='';
  if(window.QRCode)new QRCode(b,{text:u,width:600,height:600,correctLevel:QRCode.CorrectLevel.M});else b.textContent='QR을 불러오지 못했어요. 위 주소를 칠판에 적어 주세요.'}
app.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.st)openS[d.dataset.st]=d.open},true);
/* 활동 묶음 접기·펴기: 이 노트북에 기억(tm-gopen). 처음엔 모두 접힌 채 묶음 이름만 → 눌러서 펼침 */
app.addEventListener('toggle',e=>{const d=e.target;if(!d.dataset||d.dataset.gf==null||S.favEdit)return;GOPEN[d.dataset.gf]=d.open;lsSet('tm-gopen',GOPEN)},true); /* 통계 펼침 상태 기억(화면이 새로 그려져도) */
app.addEventListener('click',e=>{const t=e.target.closest('[data-fv],[data-a],[data-w],[data-q],[data-mode],[data-pick],[data-live],[data-tn]');if(!t)return;
  if(t.dataset.fv!=null){e.preventDefault();const k=t.dataset.fv,f=FAV().slice(),i=f.indexOf(k);if(i>=0)f.splice(i,1);else f.push(k);mySave({fav:f});render();return}
  if(t.dataset.mode){S.mode=t.dataset.mode;render();return}
  if(t.dataset.tn!=null){const w=document.getElementById('who'),c=document.getElementById('code');if(w)S.name=w.value;if(c)S.code=c.value;readTM();const n=+t.dataset.tn;TM=n?Array.from({length:n},(_,i)=>TM[i]||(i+1)+'조'):[];render();return}
  if(t.dataset.pick){S.pick=!S.pick;render();if(S.pick)document.getElementById('pick').scrollIntoView({behavior:'smooth',block:'center'});return}
  if(t.dataset.live){ // 새 탭(진행 화면)은 링크 그대로 열리고, 학생 화면도 따라감: 마인드맵은 답하기 화면, 게임·교실 도구는 '앞 화면을 보세요'
    const l=t.dataset.live;if(S.mode==='qr'){if(l==='live.html?host')qr('live.html',t.dataset.qn);return}
    push(l==='live.html?host'?'live.html':'play.html',t.dataset.qn);return}
  if(t.dataset.q){if(S.mode==='qr'&&t.dataset.q!=='home')qr(t.dataset.q,t.dataset.qn);else{if(t.dataset.q.indexOf('test.html')===0)S.pick=false;push(t.dataset.q,t.dataset.qn);view(t.dataset.q)}return}
  if(t.dataset.w){openW[t.dataset.w]=!openW[t.dataset.w];render();return}
  const a=t.dataset.a;
  if(a==='fav'){S.favEdit=!S.favEdit;render();return}
  if(a==='tedit'){S.tedit=!S.tedit;if(S.tedit)TM=(S.teams&&S.teams.length?S.teams:TM).slice();render();return}
  if(a==='tsave'){saveTeams().then(()=>{S.teams=TM.slice();S.tedit=false;render();flash('✔ 조를 저장했어요. 새로 들어오는 학생은 이 조에서 골라요')},e=>flash('저장하지 못했어요: '+msg(e),true));return}
  if(a==='make')make();else if(a==='qr')qr();else if(a==='csv')csv();
  else if(a==='new'){if(!confirm('방을 종료할까요? 들어와 있던 학생 화면도 "수업이 끝났어요"로 끊겨요. (받은 결과는 먼저 CSV로 받아 두세요)'))return;
    F.updateDoc(F.doc(db,'rooms',S.pin),{closed:true,q:null}).catch(()=>{});clearInterval(hbT);if(wUnsub)wUnsub();W=[];S.pin='';lsSet('live-host',{});lsSet('tm-room',{});render()}});
document.getElementById('qrX').onclick=()=>document.getElementById('qrov').hidden=true;
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('qrov').hidden=true});
boot().then(resume).then(myLoad).then(render).catch(e=>{app.innerHTML='<p class="bad">연결이 안 돼요. 새로 고침해 주세요. ('+esc(e.message)+')</p>'});
</script>
