<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>강사 입구</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 강사 입구: 방 만들기(필수) → 방 번호·학생 QR·수업 활동 모음 */
:root{
  --bg:#f6f6f6; --ink:#333; --soft:#6f7480; --card:#fff; --line:#e2e3e8; --field:#fbfbfc;
  --blue:#4e6bf1; --blue-ink:#fff; --blue-soft:#e9edfe; --ok:#2e8b4c; --bad:#c8432f;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642; --field:#1a1d23;
  --blue:#7c93ff; --blue-ink:#10121a; --blue-soft:#262d4a; --ok:#5cc47c; --bad:#ff7a63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181d; --ink:#eceef2; --soft:#a3a8b5; --card:#1f2229; --line:#323642; --field:#1a1d23;
  --blue:#7c93ff; --blue-ink:#10121a; --blue-soft:#262d4a; --ok:#5cc47c; --bad:#ff7a63; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;line-height:1.3} h1{font-size:1.6rem;font-weight:900} h3{font-size:1.05rem}
p{margin:0} .soft{color:var(--soft)}
button,input,textarea{font:inherit;color:inherit} button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top a{color:var(--blue);font-weight:700;text-decoration:none}
.brand small{letter-spacing:.12em;font-weight:700;color:var(--blue);font-size:.78rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs a{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;font-weight:700;color:var(--ink);text-decoration:none}
.tabs a[aria-current="page"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:10px 16px;font-weight:700;color:var(--ink)}
.btn.pri{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn.big{font-size:1.2rem;padding:14px 28px}
.btn:disabled{opacity:.45;cursor:not-allowed}
textarea,input{border:1px solid var(--line);background:var(--field);border-radius:4px;padding:10px 12px;box-sizing:border-box}
textarea{width:100%;min-height:150px;resize:vertical}
input[type=number]{width:80px}
.split{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.team{border-radius:10px;padding:14px;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card))}
.team h3{color:var(--c);font-size:1.3rem;font-weight:900;display:flex;justify-content:space-between}
.team ul{margin:8px 0 0;padding:0;list-style:none;font-size:1.25rem;font-weight:700;line-height:1.7}
.team li{animation:pop .35s both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.stage{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(2.4rem,9vw,6rem);font-weight:900;color:var(--blue);border-radius:10px;background:var(--blue-soft);padding:20px}
.stage.spin{color:var(--soft)}
.order{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.order li{background:var(--field);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:1.1rem;animation:pop .3s both}
.order li b{color:var(--blue);margin-right:6px}
.order li.done{opacity:.45;text-decoration:line-through}
.clock{font-size:clamp(5rem,22vw,15rem);font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.clock.warn{color:var(--bad);animation:blink 1s infinite}
.clock.over{color:var(--bad)}
@keyframes blink{50%{opacity:.55}}
.pbar{height:14px;background:var(--line);border-radius:7px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--blue);transition:width .3s linear}
.pbar.warn i{background:var(--bad)}
.label{font-size:clamp(1.2rem,3vw,2rem);font-weight:900;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:8px 16px;font-weight:700}
.note{font-size:.88rem;color:var(--soft)}
:fullscreen .wrap{max-width:none;padding:24px}
:fullscreen{background:var(--bg)}

.pinbig{font-size:clamp(4rem,14vw,8rem);font-weight:900;letter-spacing:.12em;color:var(--blue);line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.g{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:14px;color:var(--ink);text-decoration:none}
.g b{font-size:1.05rem}.g span{color:var(--soft);font-size:.9rem}.g:hover{border-color:var(--blue)}
.who{display:flex;gap:8px;flex-wrap:wrap}
.who button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:8px 16px;font-weight:700}
.who button[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
input.w{width:100%}
.bad{color:var(--bad)}
#qrov{position:fixed;inset:0;z-index:50;background:#fff;color:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
#qrov[hidden]{display:none}
#qrov h2{font-size:clamp(1.4rem,4vw,2.6rem);font-weight:900}
#qrov .p{font-size:clamp(2rem,6vw,4rem);font-weight:900;color:#4e6bf1;letter-spacing:.1em}
#qrbox{width:min(58vh,86vw);height:min(58vh,86vw)}#qrbox img,#qrbox canvas{width:100%!important;height:100%!important}
#qrov .x{position:absolute;top:12px;right:16px;font-size:2rem;background:none;border:0;cursor:pointer;color:#222}
</style>
</head><body>
<div class="wrap" id="app"><p class="soft">불러오는 중…</p></div>
<div id="qrov" hidden role="dialog" aria-label="학생 입장 QR"><button class="x" id="qrX" aria-label="닫기">✕</button><h2>📱 휴대폰 카메라로 찍고 들어오세요</h2><div class="p" id="qrP"></div><div id="qrbox"></div><div id="qrU" style="font-weight:700"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { firebaseConfig } from './firebase-config.js';
const V='10.12.2', G=`https://www.gstatic.com/firebasejs/${V}`;
const SITE='https://themore-junyong.github.io/tools/';
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let F,db,me,call;
async function boot(){
  const { initializeApp } = await import(`${G}/firebase-app.js`);
  const A=await import(`${G}/firebase-auth.js`), D=await import(`${G}/firebase-firestore.js`), Fn=await import(`${G}/firebase-functions.js`);
  const fa=initializeApp(firebaseConfig), auth=A.getAuth(fa);
  await auth.authStateReady(); if(!auth.currentUser)await A.signInAnonymously(auth);
  me=auth.currentUser.uid; db=D.getFirestore(fa); F=D;
  call=(name,data)=>Fn.httpsCallable(Fn.getFunctions(fa,'asia-northeast3'),name,{timeout:20000})(data).then(r=>r.data);
}
const msg=e=>(e&&e.message&&!/^(internal|INTERNAL)$/.test(e.message))?e.message:'연결이 끊겼어요. 다시 눌러 주세요';
/* 방 = 실시간 마인드맵과 같은 rooms/{번호}. 이 노트북에 기억(live-host)해서 마인드맵 강사 화면도 같은 방을 씀 */
const S={name:lsGet('tm-teacher',''),code:(lsGet('tm-code',{})||{}).code||'',pin:'',exp:0,note:'',busy:false};
const ACT=[
 ['live.html?host','📊 실시간 마인드맵 · 투표','학생 휴대폰으로 답이 모여요 (이 방 번호 그대로)'],
 ['icebreak.html','🎲 아이스브레이킹','밸런스 · 초성 · 이모지 · 몸으로 말해요 (진행자 화면 지원)'],
 ['safety.html','🦺 안전 징검다리','현장 안전 팀 대결 (진행자 화면 지원)'],
 ['river.html','🚣 문제해결 강건너기','3단계 퍼즐 (진행자 화면에 풀이)'],
 ['class.html','👥 교실 도구','팀 나누기 · 한 명 뽑기 · 큰 타이머']
];
function render(){
  let h='<div class="top"><div class="brand"><small>위듀케이션 · 강사 입구</small></div><a href="./">학생 첫 화면 보기 →</a></div>';
  if(!S.pin){
    h+='<div class="card"><h1>오늘 수업 방 만들기</h1><p class="soft">여러 반이 동시에 써도 섞이지 않도록 <b>수업마다 방을 먼저 만들어요.</b> 학생은 빔에 띄운 QR(방 번호가 들어 있어요)로 들어와요. 방은 8시간 뒤 자동으로 닫혀요.</p>'+
     '<div class="f"><label><b>강사</b></label><div class="who">'+['강사1','강사2','강사3'].map(n=>'<button data-who="'+n+'" aria-pressed="'+(S.name===n)+'">'+n+'</button>').join('')+'<input id="who" placeholder="또는 이름" value="'+esc(['강사1','강사2','강사3'].includes(S.name)?'':S.name)+'" maxlength="12" style="width:140px"></div></div>'+
     '<div class="f"><label for="code"><b>초대코드</b></label><input id="code" class="w" value="'+esc(S.code)+'" placeholder="예: WEDU-0000" autocomplete="off"></div>'+
     '<button class="btn pri big" data-a="make"'+(S.busy?' disabled':'')+'>'+(S.busy?'만드는 중…':'🏠 방 만들기')+'</button>'+(S.note?'<p class="bad">'+esc(S.note)+'</p>':'')+'</div>';
  }else{
    const left=Math.max(0,Math.round((S.exp-Date.now())/60000));
    h+='<div class="card" style="align-items:center;text-align:center"><span class="soft">'+esc(S.name||'강사')+' 선생님의 오늘 방</span><div class="pinbig">'+S.pin+'</div>'+
     '<span class="soft">학생 입장 주소: '+esc(SITE.replace('https://',''))+'?r='+S.pin+' · '+Math.floor(left/60)+'시간 '+(left%60)+'분 남음</span>'+
     '<div class="row" style="justify-content:center"><button class="btn pri big" data-a="qr">📱 빔에 학생 QR 크게 띄우기</button><button class="btn" data-a="new">⏹ 방 종료</button></div>'+
     '<span class="note">이 탭을 켜 두는 동안 방이 열려 있어요. 방 종료를 누르거나 이 탭을 닫으면 3분 안에 학생 화면도 "수업이 끝났어요"로 끊겨요.</span></div>'+
     '<div class="card"><h3>수업 활동</h3><div class="grid">'+ACT.map(a=>'<a class="g" href="'+a[0]+'" target="_blank" rel="noopener"><b>'+a[1]+'</b><span>'+a[2]+'</span></a>').join('')+'</div>'+
     '<p class="note">활동은 새 탭으로 열려요. 이 탭은 켜 두세요. 게임은 빔에 띄우고 <b>🖥 진행자 화면</b>으로 정답을 보며 진행하면 돼요.</p></div>'+works();
  }
  app.innerHTML=h;
}
/* 학생 결과(work): 자소서·검사·면접·퍼스널컬러·1분 자기소개. 학생이 마치면 실시간으로 쌓임 */
const TOOL={jaso:'📝 자소서',interview:'🎤 모의면접',color:'🎨 퍼스널컬러',intro:'🗣 1분 자기소개'};
const toolName=t=>TOOL[t]||(t.indexOf('test-')===0?'🧭 검사':t);
let W=[],wUnsub=null,hbT=null,openW={};
function works(){
  const by={};W.forEach(w=>{(by[w.nick]=by[w.nick]||[]).push(w)});const names=Object.keys(by).sort((a,b)=>a.localeCompare(b,'ko',{numeric:true}));
  return '<div class="card"><div class="row" style="justify-content:space-between"><h3>학생 결과 ('+names.length+'명 · '+W.length+'개)</h3><span class="note">학생이 마치면 여기 바로 쌓여요. 이 방 강사만 볼 수 있어요.</span></div>'+
   (names.length?names.map(n=>'<div style="border-top:1px solid var(--line);padding-top:8px"><b>'+esc(n)+'</b><div style="display:flex;flex-direction:column;gap:4px;margin-top:4px">'+by[n].map(w=>{const k=w.id,o=openW[k];
     return '<div><button class="btn" data-w="'+esc(k)+'" style="padding:4px 10px;text-align:left;width:100%">'+toolName(w.tool)+' · '+esc(w.title)+' <span class="note">'+(w.t?new Date(w.t.toMillis()).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'')+'</span> '+(o?'▲':'▼')+'</button>'+
      (o?'<pre style="white-space:pre-wrap;font:inherit;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:10px;margin:4px 0 0">'+esc(w.body)+'</pre>':'')+'</div>'}).join('')+'</div></div>').join('')
    :'<p class="soft">아직 없어요. 학생이 방에 들어와 자소서 초안·검사·면접·퍼스널컬러를 마치면 자동으로 들어와요.</p>')+
   (W.length?'<button class="btn" data-a="csv">⬇ 엑셀(CSV)로 받기</button>':'')+'</div>';
}
function live(){ // 방이 정해지면: hb(살아 있음) 1분마다 찍기 + 학생 결과 듣기
  clearInterval(hbT);if(wUnsub)wUnsub();
  const ref=F.doc(db,'rooms',S.pin),beat=()=>F.updateDoc(ref,{hb:F.serverTimestamp()}).catch(()=>{});
  beat();hbT=setInterval(beat,60e3);
  wUnsub=F.onSnapshot(F.collection(db,'rooms',S.pin,'work'),q=>{W=q.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.t?a.t.toMillis():0)-(b.t?b.t.toMillis():0));render()},()=>{});
}
function csv(){const rows=[['이름','도구','제목','시각','내용']].concat(W.map(w=>[w.nick,toolName(w.tool).replace(/^\S+ /,''),w.title,w.t?new Date(w.t.toMillis()).toLocaleString('ko-KR'):'',w.body]));
  const t='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='방'+S.pin+'_학생결과.csv';a.click()}
async function make(){
  const w=document.getElementById('who').value.trim();if(w)S.name=w;
  S.code=document.getElementById('code').value.trim().toUpperCase();S.note='';
  if(!S.name){S.note='강사를 골라 주세요';return render()}
  if(!S.code){S.note='초대코드를 넣어 주세요';return render()}
  S.busy=true;render();
  try{const r=await call('liveRoom',{code:S.code});S.pin=r.pin;S.exp=Date.now()+8*3600e3;
    lsSet('live-host',{pin:S.pin});lsSet('tm-teacher',S.name);lsSet('tm-room',{pin:S.pin,exp:S.exp});
    const c=lsGet('tm-code',{})||{};if(c.code!==S.code)lsSet('tm-code',{code:S.code});live()}
  catch(e){S.note=msg(e)}
  S.busy=false;render();
}
async function resume(){ // 이 노트북에서 만든 방이 아직 살아 있으면 그대로
  const pin=(lsGet('tm-room',{})||{}).pin||(lsGet('live-host',{})||{}).pin;if(!pin)return;
  try{const d=await F.getDoc(F.doc(db,'rooms',pin));const r=d.exists()?d.data():null;
    if(r&&r.owner===me&&!r.closed&&r.exp.toMillis()>Date.now()){S.pin=pin;S.exp=r.exp.toMillis();lsSet('live-host',{pin});live()}}catch(e){}
}
function qr(){const o=document.getElementById('qrov'),u=SITE+'?r='+S.pin,b=document.getElementById('qrbox');o.hidden=false;
  document.getElementById('qrP').textContent='방 번호 '+S.pin;document.getElementById('qrU').textContent=u.replace('https://','');b.innerHTML='';
  if(window.QRCode)new QRCode(b,{text:u,width:600,height:600,correctLevel:QRCode.CorrectLevel.M});else b.textContent='QR을 불러오지 못했어요. 위 주소를 칠판에 적어 주세요.'}
app.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-who],[data-w]');if(!t)return;
  if(t.dataset.w){openW[t.dataset.w]=!openW[t.dataset.w];render();return}
  if(t.dataset.who){S.name=t.dataset.who;const i=document.getElementById('who');if(i)i.value='';document.querySelectorAll('[data-who]').forEach(b=>b.setAttribute('aria-pressed',b===t));return}
  const a=t.dataset.a;
  if(a==='make')make();else if(a==='qr')qr();else if(a==='csv')csv();
  else if(a==='new'){if(!confirm('방을 종료할까요? 들어와 있던 학생 화면도 "수업이 끝났어요"로 끊겨요. (받은 결과는 먼저 CSV로 받아 두세요)'))return;
    F.updateDoc(F.doc(db,'rooms',S.pin),{closed:true,q:null}).catch(()=>{});clearInterval(hbT);if(wUnsub)wUnsub();W=[];S.pin='';lsSet('live-host',{});lsSet('tm-room',{});render()}});
document.getElementById('qrX').onclick=()=>document.getElementById('qrov').hidden=true;
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('qrov').hidden=true});
boot().then(resume).then(render).catch(e=>{app.innerHTML='<p class="bad">연결이 안 돼요. 새로 고침해 주세요. ('+esc(e.message)+')</p>'});
</script>
</body></html>
