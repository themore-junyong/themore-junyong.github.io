<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>댓글 자료실 · THE MORE</title>
<meta name="description" content="릴스·카드에서 댓글 키워드로 약속한 자료를 모아 둔 곳">
<meta property="og:title" content="댓글 자료실 · THE MORE">
<meta property="og:description" content="댓글에 남긴 키워드, 자료는 여기 있어요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 한 줄 세로 흐름 — 물줄기처럼 위에서 아래로, 넓은 여백과 왼쪽 정렬 */
:root{
  --bg:#F3F5F4;        /* 새벽 돌빛 */
  --surface:#FFFFFF;
  --ink:#16222B;       /* 깊은 먹빛 남색 */
  --muted:#5B6A72;
  --line:#D5DDDC;
  --flow:#1F6F78;      /* 흘러가는 물빛 */
  --flow-soft:#E1EEEE;
  --display:"Gowun Batang","Noto Serif KR",Georgia,serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171C;--surface:#16222A;--ink:#E7EEEE;--muted:#98A8AE;--line:#27363F;--flow:#6FC1C6;--flow-soft:#17333A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F171C;--surface:#16222A;--ink:#E7EEEE;--muted:#98A8AE;--line:#27363F;--flow:#6FC1C6;--flow-soft:#17333A;color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75}
.wrap{max-width:760px;margin:0 auto;padding-inline:20px;padding-block:48px 72px;display:flex;flex-direction:column;gap:72px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--flow)}
a:focus-visible,button:focus-visible{outline:2px solid var(--flow);outline-offset:3px;border-radius:4px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Hero */
.hero{display:flex;flex-direction:column;gap:20px}
.mark{font-family:var(--display);font-size:clamp(44px,11vw,84px);line-height:1;letter-spacing:-.01em}
.mark span{color:var(--flow)}
.who{font-size:18px;color:var(--muted)}
.who b{color:var(--ink);font-weight:600}
.wave{width:100%;max-width:100%;height:40px;display:block}
.wave path{fill:none;stroke:var(--flow);stroke-width:2;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:0;animation:flow 2.4s ease-out both}
@keyframes flow{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.wave path{animation:none}}
.thesis{font-family:var(--display);font-size:clamp(22px,4.6vw,30px);line-height:1.5;max-width:22em}
.triad{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted);letter-spacing:.06em}
.triad span::before{content:"More ";color:var(--flow);font-weight:600}

/* Section */
section{display:flex;flex-direction:column;gap:24px}
h2{font-size:26px}
.lead{color:var(--muted);max-width:36em}

.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-block:1px solid var(--line)}
.pillar{background:var(--bg);padding:22px 18px 22px 0;display:flex;flex-direction:column;gap:8px;min-width:0}
.pillar:not(:first-child){padding-left:18px}
.pillar h3{font-size:20px}
.pillar .tag{font-size:13px;color:var(--flow);font-weight:600}
.pillar p{font-size:15px;color:var(--muted)}

.doors{display:flex;flex-direction:column;gap:12px}
.door{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center}
.door h3{font-size:19px}
.door p{grid-column:1;font-size:15px;color:var(--muted)}
.door .go{grid-column:2;grid-row:1 / span 2;font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}

.channels{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.channels li{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:16px;padding-block:14px;border-bottom:1px solid var(--line)}
.channels li:first-child{border-top:1px solid var(--line)}
.channels .k{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.channels a{text-decoration:none;font-weight:500;overflow-wrap:anywhere}
.channels small{display:block;color:var(--muted);font-size:14px}

.contact{background:var(--flow-soft);border-radius:12px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.mail{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mail code{font-family:var(--body);font-size:18px;font-weight:600;user-select:all}
.mail button{font:inherit;font-size:14px;border:1px solid var(--flow);background:transparent;color:var(--flow);border-radius:999px;padding:4px 14px;cursor:pointer}
.mail button:hover{background:var(--flow);color:var(--bg)}

footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px}

@media (max-width:620px){
  .pillars{grid-template-columns:minmax(0,1fr)}
  .pillar,.pillar:not(:first-child){padding:20px 0}
  .door{grid-template-columns:minmax(0,1fr)}
  .door .go{grid-column:1;grid-row:auto}
  .channels li{grid-template-columns:minmax(0,1fr);gap:2px}
}

/* 최근 이야기 */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--flow);background:var(--flow);color:var(--bg)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.post{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-decoration:none;color:inherit}
.post:hover{border-color:var(--flow)}
.post .th{width:96px;height:96px;border-radius:8px;background:var(--flow-soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--flow);font-family:var(--display);font-size:22px}
.post .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;margin-bottom:4px}
.post .meta b{color:var(--flow);font-weight:600}
.post h3{font-family:var(--body);font-size:17px;font-weight:600;line-height:1.45}
.post p{font-size:14px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--muted);font-size:15px;padding:18px 0}
.more{align-self:flex-start;font:inherit;font-size:14px;border:1px solid var(--flow);background:transparent;color:var(--flow);border-radius:999px;padding:6px 16px;cursor:pointer}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.act .tag{font-size:13px;color:var(--flow);font-weight:600}
.act h3{font-size:20px}
.act p{font-size:15px;color:var(--muted);flex:1}
.act a{font-size:14px;font-weight:600;text-decoration:none}
@media (max-width:620px){.acts{grid-template-columns:minmax(0,1fr)}.post{grid-template-columns:72px minmax(0,1fr)}.post .th{width:72px;height:72px}}

.back{font-size:14px;text-decoration:none}
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.info div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.info b{display:block;font-size:13px;color:var(--flow);margin-bottom:4px}
.info span{font-size:15px}
.formwrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.formwrap iframe{display:block;width:100%;height:2300px;border:0}
.fallback{font-size:14px;color:var(--muted)}
@media (max-width:620px){.info{grid-template-columns:minmax(0,1fr)}.formwrap iframe{height:2100px}}

/* 자료실 */
.find{display:flex;gap:8px;flex-wrap:wrap}
.find input{flex:1 1 220px;min-width:0;font:inherit;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px}
.find input:focus-visible{outline:2px solid var(--flow);outline-offset:2px}
.res{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;scroll-margin-top:24px}
.item.hit{border-color:var(--flow);box-shadow:0 0 0 2px var(--flow-soft)}
.item .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.kw{font-size:13px;font-weight:600;color:var(--flow);background:var(--flow-soft);border-radius:999px;padding:2px 10px}
.item h3{font-family:var(--body);font-size:18px;font-weight:600;line-height:1.45}
.item p{font-size:15px;color:var(--muted)}
.item .links{display:flex;flex-wrap:wrap;gap:16px;font-size:14px;font-weight:600}
.item .links a{text-decoration:none}
.empty{color:var(--muted);font-size:15px;padding:18px 0}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="../">← THE MORE 홈</a>
  <header class="hero">
    <p class="eyebrow">댓글 자료실</p>
    <h1 class="mark" style="font-size:clamp(36px,9vw,64px)">댓글로 남긴 <span>키워드</span></h1>
    <p class="thesis">릴스와 카드에서 약속한 자료,<br>모두 여기 있어요.</p>
  </header>

  <section aria-labelledby="h-res">
    <h2 id="h-res">자료 찾기</h2>
    <p class="lead">댓글에 남긴 키워드를 넣으면 바로 찾아 드려요.</p>
    <div class="find"><label for="q" class="eyebrow" style="position:absolute;left:-9999px">키워드</label><input id="q" type="search" placeholder="예: 명부" autocomplete="off"></div>
    <ul class="res" id="res"><li class="empty">자료를 불러오는 중…</li></ul>
  </section>

  <footer>© THE MORE · 김준용 · 받은 것을 흘려보내는 사람</footer>
</main>
<script>
(function(){
  var all=[],res=document.getElementById('res'),q=document.getElementById('q');
  function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function norm(s){return String(s||'').replace(/[\s#'"]/g,'').toLowerCase()}
  function d(s){return s?String(s).slice(0,10).replace(/-/g,'.'):''}
  function render(){
    var t=norm(q.value);
    var list=all.filter(function(p){return !t||norm(p.keyword).indexOf(t)>-1||norm(p.title).indexOf(t)>-1});
    if(!list.length){res.innerHTML='<li class="empty">'+(all.length?'그 키워드는 아직 없어요. 철자를 확인하거나 DM으로 알려 주세요.':'곧 자료가 올라와요.')+'</li>';return}
    res.innerHTML=list.map(function(p){
      var hit=t&&norm(p.keyword)===t;
      return '<li class="item'+(hit?' hit':'')+'" id="k-'+esc(p.keyword)+'"><span class="meta"><span class="kw">'+esc(p.keyword)+'</span><span>'+esc(p.kind)+'</span><span>'+d(p.date)+'</span></span><h3>'+esc(p.title)+'</h3><p>'+esc(p.desc)+'</p><span class="links"><a href="'+esc(p.link)+'">자료 받기 →</a>'+(p.from?'<a href="'+esc(p.from)+'" target="_blank" rel="noopener">원래 게시물</a>':'')+'</span></li>'}).join('');
  }
  q.addEventListener('input',render);
  function fromHash(){var h=decodeURIComponent(location.hash.slice(1));if(h){q.value=h}render();var el=document.getElementById('k-'+h);if(el)el.scrollIntoView({block:'start'})}
  window.addEventListener('hashchange',fromHash);
  fetch('resources.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){all=j.items||[];fromHash()}).catch(function(){res.innerHTML='<li class="empty">자료 목록을 불러오지 못했어요.</li>'});
})();
</script>
</body>
</html>
