:root{

const KEY='lectureApp.v1';

function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){const b=blank();d.settings=Object.assign(b.settings,d.settings||{});return Object.assign(b,d)}}catch(e){}return blank()}

/* ===== 도우미 ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW='일월화수목금토';
const pad=n=>String(n).padStart(2,'0');
const isoOf=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const dt=iso=>{const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const dowOf=iso=>DOW[dt(iso).getDay()];
const todayIso=()=>{const t=new Date();return isoOf(t.getFullYear(),t.getMonth()+1,t.getDate())};
const md=iso=>{const d=dt(iso);return `${d.getMonth()+1}/${d.getDate()}`};
const mdK=iso=>{const d=dt(iso);return `${d.getMonth()+1}월 ${d.getDate()}일`};
const addDays=(iso,n)=>{const d=dt(iso);d.setDate(d.getDate()+n);return isoOf(d.getFullYear(),d.getMonth()+1,d.getDate())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function batchim(w){const c=String(w||'').trim().slice(-1).charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3)return(c-0xAC00)%28;return /[013678LMNR]$/i.test(String(w).trim())?1:0}
const ro=w=>{const b=batchim(w);return b&&b!==8?'으로':'로'};
const eul=w=>batchim(w)?'을':'를';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
async function copy(text,what){try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}toast((what||'')+' 복사했어요')}
function dateText(isos){if(!isos.length)return '';const ds=isos.map(dt);let out=`${ds[0].getMonth()+1}월 ${ds[0].getDate()}일(${DOW[ds[0].getDay()]})`;for(let i=1;i<ds.length;i++){const p=ds[i-1],d=ds[i];out+='·'+(d.getMonth()===p.getMonth()?'':`${d.getMonth()+1}월 `)+`${d.getDate()}일(${DOW[d.getDay()]})`}return out}

'2027-01-01':'신정','2027-02-06':'설날 연휴','2027-02-07':'설날','2027-02-08':'설날 연휴','2027-02-09':'대체공휴일','2027-03-01':'삼일절','2027-05-01':'노동절','2027-05-03':'대체공휴일','2027-05-05':'어린이날','2027-05-13':'부처님오신날','2027-06-06':'현충일','2027-07-17':'제헌절','2027-07-19':'대체공휴일','2027-08-15':'광복절','2027-08-16':'대체공휴일','2027-09-14':'추석 연휴','2027-09-15':'추석','2027-09-16':'추석 연휴','2027-10-03':'개천절','2027-10-04':'대체공휴일','2027-10-09':'한글날','2027-10-11':'대체공휴일','2027-12-25':'성탄절','2027-12-27':'대체공휴일'};

/* ===== 경력 한 줄·진행 방식 (보낸 원문 18통에서 모음, new = Claude가 새로 씀) ===== */
const CAREERS=[
 {t:'특성화고 학생 대상으로 면접·스피치, 비즈니스매너 수업을 꾸준히 하고 있습니다.'},
 {t:'특성화고와 청년 대상으로 AI 자소서, 면접, 취업역량 강의를 꾸준히 하고 있습니다.'},
 {t:'특성화고·직업계고 학생 대상 자기소개서 첨삭, AI 활용 자기소개서 완성, 모의면접 등 취업역량 강화 교육을 꾸준히 진행해 왔습니다.'},

];
const TOPICS=[
 {k:'legal',name:'법정교육',re:/성희롱|괴롭힘|장애인\s*인식|법정\s*의무|법정\s*교육|산업\s*안전/,c:4,org:1,way:'사례 중심으로, 참여자가 직접 상황을 판단해 보는 활동을 넣어 지루하지 않게 진행하겠습니다.',new:1},
 {k:'aicover',name:'AI 자기소개서',re:/(AI|인공지능|생성형|챗\s*GPT|GPT|뤼튼).{0,20}(자소서|자기소개서)|(자소서|자기소개서).{0,20}(AI|인공지능|생성형|GPT)/i,c:1,way:'생성형 AI로 지원 직무에 맞춰 경험을 정리하고, 30분 안에 자기소개서 한 편을 완성하는 방식으로 컨설팅하겠습니다.'},

/* ===== 공고 읽기 (규칙 기반, 외부 전송 없음) ===== */
function parseNotice(raw){
  const text=String(raw||'').replace(/\r/g,'');
  const lines=text.split('\n');
  const lab=re=>{const R=new RegExp('^[\\s\\-•·*▶■□○◎●◇◆※>☞①-⑳\\d.)]*\\s*(?:'+re+')\\s*[:：]\\s*(.+)$');for(const ln of lines){const m=ln.match(R);if(m)return m[1].trim()}return ''};
  const r={dates:[],dows:{},deadline:'',기관명:'',담당자호칭:'',학교명:'',지역:'',시간:'',교시:'',대상:'',강의명:'',지원안:'',to:'',topic:'etc',profile:'school'};
  // 날짜
  const lineOf=idx=>{const s=text.lastIndexOf('\n',idx-1)+1;let e=text.indexOf('\n',idx);if(e<0)e=text.length;return text.slice(s,e)};
  const found=[];
  const now=new Date();
  const add=(y,m,d,w,idx)=>{m=+m;d=+d;if(m<1||m>12||d<1||d>31)return;
    if(!y){y=now.getFullYear();if((now-new Date(y,m-1,d))/864e5>60)y++}

function renderNew(v){v.innerHTML=`<h2>공고 붙여넣기</h2><p class="muted">카톡·메일·사이트에서 공고를 통째로 복사해 붙여 넣으세요. 이 기기 안에서만 읽고, 어디에도 보내지 않아요.</p>

  <div class="row"><button class="btn pri" id="parse">읽어서 지원 메일 만들기</button><button class="btn" id="blankL">빈 강의로 시작</button></div>`;
  $('#parse').onclick=()=>{const raw=$('#notice').value.trim();if(!raw)return toast('공고를 먼저 붙여 넣어 주세요');cur=newLecture(Object.assign(parseNotice(raw),{notice:raw}));cur._new=true;regen(cur);render();scrollTo(0,0)};

function regen(l){if(!l.subjectEdited)l.subject=genSubject(l);if(!l.bodyEdited)l.body=genBody(l)}
function persist(l){if(!l._new){l.updated=new Date().toISOString();save()}}

const FIELDS=[['기관명','섭외 업체·기관'],['담당자호칭','받는 사람 호칭'],['학교명','학교(장소)'],['지역','지역'],['시간','시간 (09:00~15:50)'],['교시','교시·차시'],['대상','대상'],['강의명','강의명·주제'],['지원안','지원안 (A안·메인강사, 없으면 비움)'],['to','받는 메일 주소']];
function renderDetail(v){const l=cur;const isNew=!!l._new;

  <div class="warns" id="warns"></div>

  <details class="card" id="infoBox" ${isNew||l.status==='지원'?'open':''}><summary>기본 정보</summary>
   <div class="grid" style="margin-top:8px">

    <div><label>주제 (경력 문장 고르기)<select data-f="topic">${TOPICS.map(t=>`<option value="${t.k}" ${t.k===l.topic?'selected':''}>${t.name}</option>`).join('')}</select></label></div>
    <div><label>보낼 프로필<select data-f="profile"><option value="school" ${l.profile==='school'?'selected':''}>학교용 (${esc(db.settings.학교프로필)})</option><option value="org" ${l.profile==='org'?'selected':''}>기관·법정교육용 (${esc(db.settings.기관프로필)})</option></select></label></div>
    <div class="full checks"><label><input type="checkbox" data-c="noSchoolContact" ${l.noSchoolContact?'checked':''}>업체가 "학교에 직접 연락 금지"라고 했음 (질문은 업체 단톡으로만)</label></div>
    <div class="full"><label>메모 (학생 이름은 적지 않기)<textarea data-f="memo" rows="2">${esc(l.memo||'')}</textarea></label></div>
   </div></details>

  <details class="card" id="mailBox" ${l.status==='지원'?'open':''}><summary>① 지원 메일</summary>
   <div class="grid" style="margin-top:8px">
    <div><label>형식<select data-f="variant">

      <option value="detail" ${l.variant==='detail'?'selected':''}>상세형 (강사 소개 + 진행 계획)</option>

    <div class="full" id="variantExtra"></div>
    <div class="full"><label>경력 한 줄<select id="careerSel">${CAREERS.map((c,i)=>`<option value="${i}" ${c.t===l.career?'selected':''}>${esc(c.t.slice(0,34))}…${c.new?' (새로 씀)':''}</option>`).join('')}<option value="-1" ${CAREERS.some(c=>c.t===l.career)?'':'selected'}>직접 고침</option></select></label>
      <textarea data-f="career" rows="2">${esc(l.career)}</textarea></div>

   <p class="muted" style="margin-top:8px">보내기는 직접 하세요. 앱은 초안까지만 만들어요. Gmail 창에서 프로필 파일을 첨부하는 것 잊지 마세요.</p>

  ${isNew?'':'<div class="row"><button class="btn bad" id="del">이 강의 지우기</button></div>'}`;

  if(!isNew)$('#del').onclick=()=>{if(!confirm('이 강의를 지울까요? 되돌릴 수 없어요.'))return;db.lectures=db.lectures.filter(x=>x.id!==l.id);save();go('list')};
  $$('[data-st]',v).forEach(b=>b.onclick=()=>{const s=b.dataset.st;if(s===l.status)return;
    if(l.status==='지원'&&s!=='미선정'&&needsAttach(l)&&!l.attached&&!confirm('지원 메일에 프로필 첨부 체크가 안 돼 있어요. 그래도 단계를 바꿀까요?'))return;
    l.status=s;l.history.push({s,at:new Date().toISOString()});persist(l);render();

  // 기본 정보 입력
  $$('[data-f]',v).forEach(el=>{el.oninput=el.onchange=()=>{const k=el.dataset.f;l[k]=el.value;
    if(k==='topic'){const t=topicOf(l.topic);l.career=CAREERS[t.c].t;l.way=t.way;$('[data-f="career"]').value=l.career;$('[data-f="way"]').value=l.way;$('#careerSel').value=String(t.c)}
    if(k==='variant')drawVariantExtra();
    if(k==='career')$('#careerSel').value=String(CAREERS.findIndex(c=>c.t===l.career));
    regen(l);persist(l);refresh()}});
  $$('[data-c]',v).forEach(el=>el.onchange=()=>{l[el.dataset.c]=el.checked;persist(l);refresh()});
  $('#careerSel').onchange=e=>{const i=+e.target.value;if(i>=0){l.career=CAREERS[i].t;$('[data-f="career"]').value=l.career;regen(l);persist(l);refresh()}};
  $('#subj').oninput=e=>{l.subject=e.target.value;l.subjectEdited=true;persist(l);refresh(true)};
  $('#body').oninput=e=>{l.body=e.target.value;l.bodyEdited=true;persist(l);refresh(true)};
  $('#re').onclick=()=>{l.subjectEdited=l.bodyEdited=false;regen(l);persist(l);refresh()};
  $('#cpS').onclick=()=>copy(l.subject,'제목');
  $('#cpB').onclick=()=>{if(needsAttach(l)&&!l.attached)toast('잊지 마세요: 프로필 첨부');copy(l.body,'본문')};
  const send=(url)=>{if(needsAttach(l)&&!l.attached&&!confirm(`본문에 "첨부"가 있는데 아직 첨부 체크가 안 됐어요.\n열린 메일 창에서 ${profileFile(l)}${eul(profileFile(l))} 꼭 첨부하세요.\n\n메일 창을 열까요?`))return;window.open(url,'_blank')};
  $('#gm').onclick=()=>send(gmailUrl(l.to,l.subject,l.body));
  $('#mt').onclick=()=>send(mailtoUrl(l.to,l.subject,l.body));
  drawDates();drawVariantExtra();drawTemplates();drawCal();refresh()}

function drawDates(){const l=cur,box=$('#dates');
  box.innerHTML=(l.dates.length?l.dates:[]).map((d,i)=>`<div class="dr"><input type="date" data-di="${i}" value="${d}"><span class="muted">${dowOf(d)}${l.dows&&l.dows[d]&&l.dows[d]!==dowOf(d)?` (공고: ${l.dows[d]})`:''}</span><button class="btn" data-dx="${i}" aria-label="날짜 빼기">✕</button></div>`).join('')+`<div><button class="btn" id="addD">+ 날짜</button>${l.deadline?` <span class="muted">지원 마감 ${md(l.deadline)}(${dowOf(l.deadline)})</span>`:''}</div>`;
  $$('[data-di]',box).forEach(el=>el.onchange=()=>{if(!el.value)return;const old=l.dates[+el.dataset.di];l.dates[+el.dataset.di]=el.value;if(l.dows)delete l.dows[old];
    l.avail=(l.avail||[]).map(a=>a===old?el.value:a);l.dates=[...new Set(l.dates)].sort();regen(l);persist(l);drawDates();refresh()});
  $$('[data-dx]',box).forEach(b=>b.onclick=()=>{const d=l.dates.splice(+b.dataset.dx,1)[0];l.avail=(l.avail||[]).filter(a=>a!==d);regen(l);persist(l);drawDates();refresh()});
  $('#addD').onclick=()=>{const last=l.dates[l.dates.length-1]||todayIso();const n=addDays(last,l.dates.length?1:7);l.dates.push(n);l.avail=[...(l.avail||[]),n];regen(l);persist(l);drawDates();refresh()};
  drawAvail()}
function drawAvail(){const l=cur,box=$('#availBox');if(!box)return;
  if(l.dates.length<2&&!l.dates.some(d=>conflicts(l,d).length)){box.innerHTML='';return}
  box.innerHTML=`<label>지원 가능한 날 (빼면 "일부 날짜만 가능" 문단이 들어가요)</label><div class="checks">${l.dates.map(d=>{const c=conflicts(l,d);return `<label><input type="checkbox" data-av="${d}" ${availDates(l).includes(d)?'checked':''}>${md(d)}(${dowOf(d)})${c.length?` <span style="color:var(--bad)">겹침</span>`:''}</label>`}).join('')}</div>`;
  $$('[data-av]',box).forEach(el=>el.onchange=()=>{const s=new Set(availDates(l));el.checked?s.add(el.dataset.av):s.delete(el.dataset.av);l.avail=[...s];regen(l);persist(l);refresh()})}
function drawVariantExtra(){const l=cur,box=$('#variantExtra');
  const ks=l.variant==='detail'?['오전계획','오후계획','결과물']:l.variant==='renotice'?['바뀐내용']:[];
  let h=ks.length?`<div class="vars">${ks.map(k=>`<label>${k}<input data-vx="${k}" value="${esc(l.extra[k]||'')}"></label>`).join('')}</div>`:'';
  if(l.variant==='form')h+=`<div class="checks"><label><input type="checkbox" id="wb" ${l.withBirth?'checked':''}>생년월일 넣기 (공고가 요구할 때만, 값은 설정에서)</label></div>`;
  if(dowIssues(l).length)h+=`<div class="checks"><label><input type="checkbox" id="ad" ${l.askDow?'checked':''}>본문에 "날짜 확인 부탁" 문단 넣기</label></div>`;
  box.innerHTML=h;
  $$('[data-vx]',box).forEach(el=>el.oninput=()=>{l.extra[el.dataset.vx]=el.value;regen(l);persist(l);refresh()});
  const wb=$('#wb');if(wb)wb.onchange=()=>{l.withBirth=wb.checked;regen(l);persist(l);refresh()};
  const ad=$('#ad');if(ad)ad.onchange=()=>{l.askDow=ad.checked;regen(l);persist(l);refresh()}}

function tplCard(t,l){const vs=t.vars||[];
  return `<div class="tpl" data-t="${t.id}"><div class="tpl-h"><h3>${esc(t.title)}</h3><span class="chip">${t.ch}</span><span class="src">${esc(t.src)}</span></div>
  ${t.note?`<p class="muted">${esc(t.note)}</p>`:''}
  ${t.id==='b1'&&l.noSchoolContact?'<p class="w warn">업체가 학교 직접 연락을 막았어요. 업체 단톡으로만 보내세요.</p>':''}
  ${t.ask?`<div class="checks">${t.ask.map((q,i)=>`<label><input type="checkbox" data-ck="b1_${i}" ${l.checks['b1_'+i]?'checked':''}>앎 · ${esc(fill(q,l))}</label>`).join('')}</div>`:''}
  ${t.todo?`<div class="checks">${t.todo.map((q,i)=>`<label><input type="checkbox" data-ck="${t.id}_${i}" ${l.checks[t.id+'_'+i]?'checked':''}>${esc(fill(q,l))}</label>`).join('')}</div>`:''}
  ${vs.length?`<div class="vars">${vs.map(k=>`<label>${k}<input data-x="${k}" value="${esc((l.extra||{})[k]||'')}"></label>`).join('')}</div>`:''}
  ${t.text?`<textarea class="out" rows="${Math.min(14,tplText(t,l).split('\n').length+1)}">${esc(tplText(t,l))}</textarea>
  <div class="row"><button class="btn" data-cp>복사</button>${t.big?'<button class="btn" data-big>화면에 크게</button>':''}${t.mail?'<button class="btn pri" data-gm>Gmail로 열기</button>':''}</div>`:''}</div>`}
function bindTpl(box,l,list,ctx){
  $$('.tpl',box).forEach(card=>{const t=list.find(x=>x.id===card.dataset.t);const out=$('.out',card);
    const upd=()=>{if(out)out.value=tplText(t,ctx())};
    $$('[data-x]',card).forEach(el=>el.oninput=()=>{ctx().extra[el.dataset.x]=el.value;l.id?persist(l):save();upd()});
    $$('[data-ck]',card).forEach(el=>el.onchange=()=>{ctx().checks[el.dataset.ck]=el.checked;l.id?persist(l):save();upd()});
    const cp=$('[data-cp]',card);if(cp)cp.onclick=()=>copy(out.value,t.title);
    const bg=$('[data-big]',card);if(bg)bg.onclick=()=>showBig(out.value);
    const gm=$('[data-gm]',card);if(gm)gm.onclick=()=>{const to=t.id.startsWith('f')?(ctx().extra.받는메일||''):cur.to;
      if(/첨부/.test(out.value))toast('메일 창에서 첨부 잊지 마세요');window.open(gmailUrl(to,fill(t.subject,ctx()),out.value),'_blank');if(ctx().onMail)ctx().onMail()}})}
function drawTemplates(){const l=cur;const st=l.status==='미선정'?'':l.status;
  const now=TPL.filter(t=>t.st===st),other=TPL.filter(t=>t.st!==st);
  const nb=$('#nowBox');
  nb.innerHTML=`<h3 style="margin-bottom:8px">${st?`지금 단계(${st})에 쓸 것`:'미선정 — 할 일 없음'}</h3>`+(st==='지원'?'<p class="muted">지원 메일은 위 ①에서. 프로필 요청이 오면 아래를 쓰세요.</p>':'')+now.map(t=>tplCard(t,l)).join('');
  bindTpl(nb,l,TPL,()=>l);
  const ob=$('#otherBox');ob.innerHTML=STEPS.filter(s=>s!==st).map(s=>`<h3 style="margin:12px 0 4px">${s}</h3>`+TPL.filter(t=>t.st===s).map(t=>tplCard(t,l)).join('')).join('');
  bindTpl(ob,l,TPL,()=>l)}
function calUrl(l,iso){const ymd=iso.replace(/-/g,'');let dates;const m=(l.시간||'').match(/(\d{2}):(\d{2})~(\d{2}):(\d{2})/);
  if(m)dates=`${ymd}T${m[1]}${m[2]}00/${ymd}T${m[3]}${m[4]}00`;else dates=`${ymd}/${addDays(iso,1).replace(/-/g,'')}`;
  const text=`[강의] ${l.학교명||l.지역||''} ${l.강의명||''}`.replace(/\s+/g,' ').trim();
  const details=[l.기관명&&'기관: '+l.기관명,l.대상&&'대상: '+l.대상,l.교시&&'교시: '+l.교시,'상태: '+l.status].filter(Boolean).join('\n');
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(text)}&dates=${dates}&details=${encodeURIComponent(details)}&location=${encodeURIComponent(l.학교명||l.지역||'')}&ctz=Asia/Seoul`}
function drawCal(){const l=cur,b=$('#calBox');
  b.innerHTML=`<h3>캘린더에 넣기</h3><p class="muted">선정되면 눌러서 '강의일정' 캘린더를 골라 저장하세요. (캘린더 선택은 구글 창에서)</p><div class="row">${l.dates.map(d=>`<a class="btn" target="_blank" rel="noopener" href="${calUrl(l,d)}">${md(d)}(${dowOf(d)}) 추가</a>`).join('')||'<span class="muted">날짜가 없어요</span>'}</div>`}
function refresh(keepText){const l=cur;if(!l)return;
  $('#ttl').textContent=`${l.학교명||l.지역||'(장소 미정)'} · ${l.강의명||'(강의명 미정)'}`;
  $('#warns').innerHTML=warnings(l).map(([lv,k,m])=>`<div class="w ${lv}"><b>${k}</b>${esc(m)}</div>`).join('');
  if(!keepText){const s=$('#subj'),b=$('#body');if(s&&document.activeElement!==s)s.value=l.subject;if(b&&document.activeElement!==b)b.value=l.body}
  $('#re').hidden=!(l.subjectEdited||l.bodyEdited);
  $('#attLbl').textContent=`Gmail에서 ${profileFile(l)} 첨부했어요`+(needsAttach(l)?'':' (이 형식은 첨부 없음)');
  drawAvail();
  $$('.tpl .out').forEach(o=>{const id=o.closest('.tpl').dataset.t;const t=TPL.find(x=>x.id===id);if(t&&document.activeElement!==o)o.value=tplText(t,l)});
  drawCal()}
function showBig(text){const b=$('#big');b.innerHTML=`<pre>${esc(text)}</pre><small>아무 데나 누르면 닫혀요</small>`;b.hidden=false;b.onclick=()=>{b.hidden=true}}

function renderSales(v){const f=db.salesForm;const S=db.settings;
  if(!f.담당자호칭)f.담당자호칭='진로취업부장 선생님';
  const logSale=()=>{if(!f.학교명)return;db.sales.unshift({id:uid(),학교:f.학교명,sent:todayIso(),call:bizDays(todayIso(),3),result:''});save();drawSalesList();toast(`전화 날짜를 ${md(db.sales[0].call)}로 잡았어요`)};
  const sctx=()=>({extra:f,checks:{},dates:[],학교명:f.학교명,담당자호칭:f.담당자호칭,onMail:logSale});
  v.innerHTML=`<h2>영업 (학교에 먼저 연락)</h2><p class="muted">첫 메일 → 3일(평일) 뒤 전화. 메일을 Gmail로 열면 아래 기록에 전화 날짜가 자동으로 잡혀요.</p>
  <div class="card"><div class="grid"><label>학교명<input data-s="학교명" value="${esc(f.학교명||'')}"></label><label>담당자 호칭<input data-s="담당자호칭" value="${esc(f.담당자호칭)}"></label>
  <label>받는 메일<input data-s="받는메일" type="email" value="${esc(f.받는메일||'')}"></label><label>전화 드릴 요일<input data-s="요일" value="${esc(f.요일||'')}" placeholder="목요일"></label></div>
  ${S.출강학교목록?'':'<p class="w warn" style="margin-top:8px">설정에서 "올해 출강 학교 목록"을 채워야 첫 메일이 완성돼요.</p>'}</div>
  <div class="card" id="salesTpl"></div><h2>영업 기록</h2><div id="salesList"></div>`;
  const box=$('#salesTpl');box.innerHTML=SALES_TPL.map(t=>tplCard(t,sctx())).join('');bindTpl(box,{},SALES_TPL,sctx);
  $$('[data-s]',v).forEach(el=>el.oninput=()=>{f[el.dataset.s]=el.value;save();$$('.out',box).forEach((o,i)=>{o.value=tplText(SALES_TPL[i],sctx())})});
  drawSalesList()}
function bizDays(iso,n){let d=iso;while(n>0){d=addDays(d,1);const w=dowOf(d);if(w!=='토'&&w!=='일'&&!HOL[d])n--}return d}
function drawSalesList(){const box=$('#salesList');if(!box)return;const t=todayIso();
  box.innerHTML=db.sales.length?db.sales.map(s=>`<div class="card sale"><div><b>${esc(s.학교)}</b> <span class="muted">메일 ${md(s.sent)} · 전화 <span class="${!s.result&&s.call<=t?'due':''}">${md(s.call)}(${dowOf(s.call)})</span></span></div>
   <select data-sr="${s.id}" style="width:auto">${['','관심 있음','이미 업체 있음','예산 없음','담당 아님','부재중','계약'].map(r=>`<option ${r===s.result?'selected':''} value="${r}">${r||'결과?'}</option>`).join('')}</select></div>`).join(''):'<p class="muted">아직 기록이 없어요.</p>';
  $$('[data-sr]',box).forEach(el=>el.onchange=()=>{const s=db.sales.find(x=>x.id===el.dataset.sr);s.result=el.value;save();drawSalesList()})}

/* ===== 설정 ===== */
function renderSettings(v){const S=db.settings;
  const F=[['강사명','강사 이름'],['강사연락처','연락처 (메일에 들어감)'],['강사메일','학생 제출 받는 메일'],['거주지','거주지역 (양식형 지원)'],['출발지','출발지 (교통비 질문)'],['학교프로필','학교용 프로필 파일 이름'],['기관프로필','기관·법정교육용 프로필 파일 이름']];
  v.innerHTML=`<h2>설정</h2><p class="muted">여기 값은 이 기기에만 저장돼요. 다른 기기에서 쓰려면 아래 "백업 파일"로 옮기세요.</p>
  <div class="card grid">${F.map(([k,lb])=>`<label>${lb}<input data-k="${k}" value="${esc(S[k]||'')}"></label>`).join('')}
   <label>생년월일 (양식형에서 체크할 때만 들어감)<input data-k="생년월일" value="${esc(S.생년월일||'')}" placeholder="비워 두어도 돼요"></label>
   <label class="full">강의 경력 목록 (양식형)<textarea data-k="경력목록" rows="3">${esc(S.경력목록||'')}</textarea></label>
   <label class="full">올해 출강 학교 목록 (영업 메일)<input data-k="출강학교목록" value="${esc(S.출강학교목록||'')}" placeholder="경주디자인고, 천안공고, 상서고"></label></div>

  <h2>캘린더 일정 불러오기 (겹침 경고용)</h2>
  <div class="card"><p class="muted">구글 캘린더(PC) → 설정 → '강의일정' → <b>캘린더 내보내기</b>로 받은 .ics 파일을 고르세요. zip이면 풀어서 안의 .ics를 고르면 돼요. 날짜와 제목만 이 기기에 저장해요.</p>
   <input type="file" id="ics" accept=".ics,text/calendar"><p class="muted" id="calInfo" style="margin-top:6px">${db.cal.length?`불러온 일정 ${db.cal.length}개 (${esc(db.calAt)})`:'아직 불러온 일정이 없어요. 지금은 이 앱에 저장한 강의끼리만 겹침을 봐요.'}</p>
   ${db.cal.length?'<button class="btn" id="calClr">불러온 일정 지우기</button>':''}</div>

  <h2>백업</h2>
  <div class="card"><p class="muted">강의 목록·설정을 파일로 저장하고, 다른 기기에서 불러올 수 있어요. 생년월일은 백업에 넣지 않아요.</p>
   <div class="row"><button class="btn" id="exp">백업 파일 받기</button><label class="btn" style="display:inline-block">백업 불러오기<input type="file" id="imp" accept=".json,application/json" hidden></label></div></div>
  <div class="row" style="margin-top:24px"><button class="btn bad" id="wipe">이 기기의 앱 데이터 모두 지우기</button></div>
  <p class="muted" style="margin-top:16px">공휴일 목록: 2026·2027년 (2026-10-27 기준). 그 뒤 연도는 주말만 경고해요.</p>`;
  $$('[data-k]',v).forEach(el=>el.oninput=()=>{S[el.dataset.k]=el.value;save()});
  $('#ics').onchange=async e=>{const f=e.target.files[0];if(!f)return;const ev=parseIcs(await f.text());db.cal=ev;db.calAt=new Date().toLocaleDateString('ko-KR');save();toast(`일정 ${ev.length}개를 불러왔어요`);render()};
  const cc=$('#calClr');if(cc)cc.onclick=()=>{db.cal=[];save();render()};
  $('#exp').onclick=()=>{const d=JSON.parse(JSON.stringify(db));d.settings.생년월일='';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,1)],{type:'application/json'}));a.download=`강의앱_백업_${todayIso()}.json`;a.click()};
  $('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.lectures))throw 0;
    const byId=new Map(db.lectures.map(l=>[l.id,l]));for(const l of d.lectures)byId.set(l.id,l);db.lectures=[...byId.values()];
    const birth=db.settings.생년월일;db.settings=Object.assign(db.settings,d.settings||{},{생년월일:birth});if(d.cal&&d.cal.length){db.cal=d.cal;db.calAt=d.calAt||''}if(d.sales)db.sales=d.sales;save();toast(`강의 ${d.lectures.length}건을 불러왔어요`);render()}catch(err){toast('백업 파일이 아니에요')}};
  $('#wipe').onclick=()=>{if(!confirm('이 기기의 강의 목록·설정·영업 기록을 모두 지울까요? 되돌릴 수 없어요.'))return;localStorage.removeItem(KEY);db=blank();render()}}
function parseIcs(txt){const t=txt.replace(/\r?\n[ \t]/g,'');const out=[];const from=addDays(todayIso(),-60);
  for(const b of t.split('BEGIN:VEVENT').slice(1)){const s=(b.match(/^DTSTART[^:\n]*:(\d{8})(T(\d{2})(\d{2})\d{2}(Z)?)?/m)||[]);if(!s[1])continue;
    let y=+s[1].slice(0,4),mo=+s[1].slice(4,6),d=+s[1].slice(6,8);
    if(s[5]){const u=new Date(Date.UTC(y,mo-1,d,+s[3],+s[4]));const k=new Date(u.getTime()+9*3600e3);y=k.getUTCFullYear();mo=k.getUTCMonth()+1;d=k.getUTCDate()}
    const iso=isoOf(y,mo,d);if(iso<from)continue;
    const sum=((b.match(/^SUMMARY[^:\n]*:(.*)$/m)||[])[1]||'').replace(/\\,/g,',').replace(/\\n/g,' ').trim();
    if(/STATUS:CANCELLED/.test(b))continue;out.push({d:iso,t:sum})}
  return out.sort((a,b)=>a.d.localeCompare(b.d))}

render();
</script>
