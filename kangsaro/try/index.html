<style>

--g1:#2A3337;--g2:#C9D2D6;--b1:#1B2F47;--b2:#9CC6F2;--p1:#2E2540;--p2:#CDB5EE;--k1:#173426;--k2:#94D9AE;--r1:#3A2116;--r2:#F2A57E;--sun:#F28B82;color-scheme:dark}}

.pic{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--acs);color:var(--ac);display:inline-grid;place-items:center;font-weight:700;font-size:20px}.pic.s{width:36px;height:36px;font-size:14px}

main{padding:12px 16px;display:flex;flex-direction:column;gap:12px}
h2{font-size:18px;margin:4px 0 0}h3{font-size:15px;margin:0}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}

.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--bg)}.btn.nv{background:var(--nv);border-color:var(--nv);color:var(--bg)}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}

<script>
/* ===== 도우미·공고 읽기 (lecture-app v1에서 가져옴) ===== */

/* ===== 도우미 ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW='일월화수목금토';
const pad=n=>String(n).padStart(2,'0');
const isoOf=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const dt=iso=>{const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const dowOf=iso=>DOW[dt(iso).getDay()];
const todayIso=()=>{const t=new Date();return isoOf(t.getFullYear(),t.getMonth()+1,t.getDate())};
const md=iso=>{const d=dt(iso);return `${d.getMonth()+1}/${d.getDate()}`};
const mdK=iso=>{const d=dt(iso);return `${d.getMonth()+1}월 ${d.getDate()}일`};
const addDays=(iso,n)=>{const d=dt(iso);d.setDate(d.getDate()+n);return isoOf(d.getFullYear(),d.getMonth()+1,d.getDate())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function batchim(w){const c=String(w||'').trim().slice(-1).charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3)return(c-0xAC00)%28;return /[013678LMNR]$/i.test(String(w).trim())?1:0}
const ro=w=>{const b=batchim(w);return b&&b!==8?'으로':'로'};
const eul=w=>batchim(w)?'을':'를';

/* ===== 공휴일 (kholidayz.com 2026·2027 목록 기준, 2026-10-27 확인) ===== */
const HOL={'2026-01-01':'신정','2026-02-16':'설날 연휴','2026-02-17':'설날','2026-02-18':'설날 연휴','2026-03-01':'삼일절','2026-03-02':'대체공휴일','2026-05-01':'노동절','2026-05-05':'어린이날','2026-05-24':'부처님오신날','2026-05-25':'대체공휴일','2026-06-03':'지방선거','2026-06-06':'현충일','2026-07-17':'제헌절','2026-08-15':'광복절','2026-08-17':'대체공휴일','2026-09-24':'추석 연휴','2026-09-25':'추석','2026-09-26':'추석 연휴','2026-10-03':'개천절','2026-10-05':'대체공휴일','2026-10-09':'한글날','2026-12-25':'성탄절',
'2027-01-01':'신정','2027-02-06':'설날 연휴','2027-02-07':'설날','2027-02-08':'설날 연휴','2027-02-09':'대체공휴일','2027-03-01':'삼일절','2027-05-01':'노동절','2027-05-03':'대체공휴일','2027-05-05':'어린이날','2027-05-13':'부처님오신날','2027-06-06':'현충일','2027-07-17':'제헌절','2027-07-19':'대체공휴일','2027-08-15':'광복절','2027-08-16':'대체공휴일','2027-09-14':'추석 연휴','2027-09-15':'추석','2027-09-16':'추석 연휴','2027-10-03':'개천절','2027-10-04':'대체공휴일','2027-10-09':'한글날','2027-10-11':'대체공휴일','2027-12-25':'성탄절','2027-12-27':'대체공휴일'};

const TOPICS=[
 {k:'legal',name:'법정교육',re:/성희롱|괴롭힘|장애인\s*인식|법정\s*의무|법정\s*교육|산업\s*안전/,c:4,org:1,way:'사례 중심으로, 참여자가 직접 상황을 판단해 보는 활동을 넣어 지루하지 않게 진행하겠습니다.',new:1},
 {k:'aicover',name:'AI 자기소개서',re:/(AI|인공지능|생성형|챗\s*GPT|GPT|뤼튼).{0,20}(자소서|자기소개서)|(자소서|자기소개서).{0,20}(AI|인공지능|생성형|GPT)/i,c:1,way:'생성형 AI로 지원 직무에 맞춰 경험을 정리하고, 30분 안에 자기소개서 한 편을 완성하는 방식으로 컨설팅하겠습니다.'},
 {k:'cover',name:'자기소개서',re:/자소서|자기소개서|이력서/,c:2,way:'학생들이 자기 경험을 직접 꺼내 정리하고, 그 자리에서 첨삭을 받아 한 편을 완성해 가는 실습 위주로 준비하겠습니다.',new:1},
 {k:'interview',name:'면접·스피치',re:/면접|스피치|말하기/,c:0,way:'학생 한 명 한 명이 1분 자기소개와 모의면접을 직접 해 보고, 그 자리에서 피드백을 받는 실습 위주로 준비하겠습니다.',new:1},
 {k:'manner',name:'비즈니스매너',re:/비즈니스\s*매너|직장\s*예절|매너|예절|고객\s*응대/,c:0,way:'인사, 명함 교환, 전화 응대, 자기소개를 학생들이 직접 해 보는 실습 위주로 준비하겠습니다.'},
 {k:'labor',name:'노동인권',re:/노동\s*인권|노동법|근로\s*계약|근로\s*기준|노동\s*교육/,c:3,way:'첫 월급 명세서 읽기, 근로계약서 체크포인트, 부당한 상황에서 내 권리 지키기처럼 학생들이 곧 사회에 나가 바로 쓸 수 있는 내용으로, 사례와 실습 위주로 준비하겠습니다.'},
 {k:'startup',name:'창업',re:/창업|기업가\s*정신/,c:3,way:'제공해 주시는 기본 교안을 바탕으로 학생들이 직접 아이디어를 내고 발표해 보는 실습 중심으로 진행하겠습니다.'},
 {k:'career',name:'진로',re:/진로|동기\s*부여|취업\s*역량|취업\s*특강|직업\s*탐색/,c:3,way:'게임·팀 활동·발표로 학생들이 직접 움직이며, 자기 진로를 한 문장으로 정리해 가는 참여형으로 준비하겠습니다.',new:1},
 {k:'etc',name:'기타',re:/$^/,c:3,way:'학생들이 직접 해 보는 실습과 팀 활동 위주로 준비하겠습니다.',new:1}
];
const topicOf=k=>TOPICS.find(t=>t.k===k)||TOPICS[TOPICS.length-1];

/* ===== 공고 읽기 (규칙 기반, 외부 전송 없음) ===== */
// 강사료: '강사비·강의료·페이' 줄 우선, '총 ○만원' 우선, '시간당 ○' 은 시간 수를 곱함 (톡방 공고 293건 시험으로 맞춤)
function feeOf(raw){const T=String(raw||''),L=T.split('\n'),KW=/강사비|강의료|강사료|강의비|교육비|페이|사례비|보수|수당/;
  const amt=t=>{const x=String(t).match(/(\d{1,3}(?:,\d{3})+|\d+(?:\.\d+)?)(?!\s*(?:H|h|시간|교시|차시|명|회|일|월|%|\d))\s*(만)?\s*(원)?/);if(!x)return 0;let v=+x[1].replace(/,/g,'');if(x[2])v*=1e4;else if(!x[3]&&v<=50)v*=1e4;return v>=3e4&&v<=3e6?Math.round(v):0};
  const hrs=()=>{let x=T.match(/(\d)\s*[~\-∼]\s*(\d)\s*교시/);if(x)return x[2]-x[1]+1;x=T.match(/(\d)\s*(?:시간|차시|교시)/);return x?+x[1]:1};
  for(let i=0;i<L.length;i++){const k=L[i].match(KW);if(!k)continue;let t=L[i].slice(k.index+k[0].length);if(!/\d/.test(t)&&L[i+1])t+=' '+L[i+1];
    let x=t.match(/총\s*([\d,]+\s*만?\s*원?)/);if(x&&amt(x[1]))return amt(x[1]);
    x=t.match(/(?:시간|차시|교시)\s*당\s*([\d,.]+\s*만?\s*원?)/);if(x&&amt(x[1]))return amt(x[1])*hrs();
    if(amt(t))return amt(t)}
  for(const x of T.matchAll(/(\d{1,3}(?:,\d{3})+\s*원|\d+\s*만\s*원)/g))if(amt(x[1]))return amt(x[1]);return ''}
function parseNotice(raw){
  const text=String(raw||'').replace(/\r/g,'');
  const lines=text.split('\n');
  const lab=re=>{const R=new RegExp('^[\\s\\-•·*▶■□○◎●◇◆※>☞①-⑳\\d.)]*\\s*(?:'+re+')\\s*(?:[:：_]|-(?!\\d))\\s*(.+)$');for(const ln of lines){const m=ln.match(R);if(m)return m[1].trim()}return ''};
  const r={dates:[],dows:{},deadline:'',기관명:'',담당자호칭:'',학교명:'',지역:'',시간:'',교시:'',대상:'',강의명:'',지원안:'',to:'',topic:'etc',profile:'school'};
  // 날짜
  const lineOf=idx=>{const s=text.lastIndexOf('\n',idx-1)+1;let e=text.indexOf('\n',idx);if(e<0)e=text.length;return text.slice(s,e)};
  const found=[];
  const now=new Date();
  const add=(y,m,d,w,idx)=>{m=+m;d=+d;if(m<1||m>12||d<1||d>31)return;
    if(!y){y=now.getFullYear();if((now-new Date(y,m-1,d))/864e5>60)y++}
    const iso=isoOf(+y,m,d);if(dt(iso).getMonth()!==m-1)return;
    const ln=lineOf(idx);
    const dl=/마감|접수|지원\s*기한|모집\s*기간|까지|제출\s*기한|서류/.test(ln)&&!/교육\s*일|강의\s*일|일시|일정|출강/.test(ln);
    found.push({iso,w:w||'',dl})};
  const W='(?:\\s*\\(\\s*([월화수목금토일])\\s*\\)|\\s*([월화수목금토일])요일)?';
  const RG='(?:\\s*[~∼\\-–]\\s*(\\d{1,2})\\s*일?(?![\\d/.:월])(?:\\s*\\(\\s*([월화수목금토일])\\s*\\))?)?';
  let masked=text;
  const run=(re,hasY)=>{masked=masked.replace(re,(...a)=>{const idx=a[a.length-2];const g=a.slice(1,a.length-2);

// 내 캘린더로 보내기: 구글은 채워진 일정 만들기 화면, 아이폰은 .ics 파일 (권한·서버 필요 없음)
function calEv(id,d){const e=entries(meId()).find(x=>x.ref.id===id&&x.d===d);if(!e)return null;
  const m=String(e.time||'').match(/(\d{1,2}):(\d{2})\s*[~∼\-–]\s*(\d{1,2}):(\d{2})/),[y,mo,da]=d.split('-').map(Number);
  const s=m?new Date(y,mo-1,da,+m[1],+m[2]):null,en=m?new Date(y,mo-1,da,+m[3],+m[4]):null;
  const title=`[${e.st==='applied'?'지원':'강의'}] ${m?pad(+m[1])+':'+m[2]+' ':''}${e.title}`;
  const dep=departText(e.time,+e.ref.km);
  const desc=[e.org&&`업체: ${e.org}`,`강사료 ${won(e.fee)} · 순수익 ${won(netOf(e))}`,dep&&`🚗 ${dep}`,e.st==='applied'?'확정 대기':'페이 지급: ☐ 미입금','강사로에서 보냄'].filter(Boolean).join('\n');
  const loc=e.job?`${e.job.region} ${e.job.school}`:'';return {e,s,en,title,desc,loc,d}}
const utc=x=>x.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
function gcalUrl(c){const day=c.d.replace(/-/g,''),next=addDays(c.d,1).replace(/-/g,'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(c.title)+'&dates='+(c.s?utc(c.s)+'/'+utc(c.en):day+'/'+next)+'&details='+encodeURIComponent(c.desc)+(c.loc?'&location='+encodeURIComponent(c.loc):'')+'&ctz=Asia/Seoul'}
function icsText(c){const day=c.d.replace(/-/g,''),next=addDays(c.d,1).replace(/-/g,''),e=x=>String(x).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//kangsaro//KO','BEGIN:VEVENT',`UID:${c.e.ref.id}-${day}@kangsaro`,`DTSTAMP:${utc(new Date())}`,c.s?`DTSTART:${utc(c.s)}`:`DTSTART;VALUE=DATE:${day}`,c.s?`DTEND:${utc(c.en)}`:`DTEND;VALUE=DATE:${next}`,`SUMMARY:${e(c.title)}`,`DESCRIPTION:${e(c.desc)}`,c.loc?`LOCATION:${e(c.loc)}`:'','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n')}

/* ===== 거리 어림 (시·군 중심 좌표 직선거리 × 1.3 도로 보정 × 왕복). 정확한 길찾기는 서버 단계에서 ===== */
const GEO={서울:[37.57,126.98],수원:[37.26,127.03],안양:[37.39,126.95],성남:[37.42,127.13],분당:[37.38,127.12],용인:[37.24,127.18],화성:[37.2,126.83],평택:[36.99,127.11],안산:[37.32,126.83],시흥:[37.38,126.8],광명:[37.48,126.86],군포:[37.36,126.94],의왕:[37.34,126.97],오산:[37.15,127.07],인천:[37.46,126.71],부천:[37.5,126.78],김포:[37.62,126.72],고양:[37.66,126.83],파주:[37.76,126.78],의정부:[37.74,127.05],남양주:[37.64,127.22],하남:[37.54,127.21],이천:[37.27,127.44],천안:[36.81,127.15],아산:[36.79,127],청주:[36.64,127.49],충주:[36.99,127.93],대전:[36.35,127.38],세종:[36.48,127.29],원주:[37.34,127.92],춘천:[37.88,127.73],강릉:[37.75,128.88],정선:[37.38,128.66],전주:[35.82,127.15],광주:[35.16,126.85],목포:[34.81,126.39],여수:[34.76,127.66],순천:[34.95,127.49],대구:[35.87,128.6],구미:[36.12,128.34],안동:[36.57,128.73],포항:[36.02,129.34],경주:[35.86,129.22],울산:[35.54,129.31],부산:[35.18,129.08],창원:[35.23,128.68],김해:[35.23,128.89],제주:[33.5,126.53]};
const geoOf=t=>{t=String(t||'');for(const k in GEO)if(t.includes(k))return GEO[k];return null};
function kmBetween(a,b){const A=geoOf(a),B=geoOf(b);if(!A||!B)return null;const R=6371,r=x=>x*Math.PI/180;const dl=r(B[0]-A[0]),dn=r(B[1]-A[1]);
  const h=Math.sin(dl/2)**2+Math.cos(r(A[0]))*Math.cos(r(B[0]))*Math.sin(dn/2)**2;return Math.max(10,Math.round(2*R*Math.asin(Math.sqrt(h))*1.3*2))}
// 편도 시간: 평균 시속 약 65km(시내·고속 섞임)로 어림
function netGuess(j,p){const km=kmBetween(p.region,j.region);if(km==null)return null;const amt=j.fee*j.dates.length,fuel=Math.round(km*j.dates.length/(+p.kmpl||15)*(+p.fuel||1650)),min=Math.max(15,Math.round(km/2/65*60/5)*5);return {km,fuel,amt,tx:tax(amt),min,net:tax(amt).net-fuel}}
const hmText=m=>m>=60?`${Math.floor(m/60)}시간${m%60?` ${m%60}분`:''}`:`${m}분`;

  return {su,body,url:`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(p.to)}&su=${encodeURIComponent(su)}&body=${encodeURIComponent(body)}`}}

function vMoney(){const E=entries(meId()).filter(e=>e.st!=='applied');const Y=ui.month.slice(0,4);
  const rows=[];let T={n:0,fee:0,tx:0,net:0,trv:0,pn:0,un:0};

    const r={m,n:es.length,fee:0,tx:0,net:0,trv:0,un:0};for(const e of es){const x=tax(e.fee);r.fee+=e.fee;r.tx+=x.all;r.trv+=e.trv;r.net+=x.net-e.trv;if(e.st==='done')r.un+=x.net}
    rows.push(r);for(const k2 of ['n','fee','tx','net','trv','un'])T[k2]+=r[k2]}
  return `<div class="row"><h2 class="sp">${Y}년 결산</h2><button class="btn sm" data-act="year" data-n="-1">‹</button><button class="btn sm" data-act="year" data-n="1">›</button></div>

  ${rows.map(r=>`<tr><td>${r.m}월</td><td>${r.n}</td><td>${won(r.fee)}</td><td>${won(r.tx)}</td><td>${won(r.trv)}</td><td>${won(r.net)}</td><td>${r.un?won(r.un):'-'}</td></tr>`).join('')||'<tr><td colspan="7">아직 기록이 없어요</td></tr>'}
  ${rows.length?`<tr><th>합계</th><th>${T.n}</th><th>${won(T.fee)}</th><th>${won(T.tx)}</th><th>${won(T.trv)}</th><th>${won(T.net)}</th><th>${T.un?won(T.un):'-'}</th></tr>`:''}</tbody></table></div>
  <button class="btn" data-act="copyYear">결산표 복사 (종합소득세 준비용)</button>
  <p class="mu sm">강의한 날짜 기준으로 모았어요. 3.3%는 소득세 3%와 지방소득세 0.3%예요. 참고용이며 실제 신고는 홈택스 지급명세서 기준으로 하세요.</p>`}

// 인증 강의: 강사로 안에서 업체가 확정하고 강의를 마친 뒤 지급 완료까지 된 강의 (강사가 '안 들어옴'이라 답한 건 제외)
function verified(iid){const t=todayIso();return S.apps.filter(a=>a.instId===iid&&a.status==='확정'&&a.paidAt&&a.recv!=='no'&&last(job(a.jobId).dates)<t).map(a=>{const j=job(a.jobId);return {d:j.dates[0],n:j.dates.length,co:co(j.coId).name,j}}).sort((a,b)=>a.d<b.d?1:-1)}
const vLine=v=>`${v.d.replace(/-/g,'.')}${v.n>1?` 외 ${v.n-1}일`:''} ${v.co} · ${v.j.region} ${v.j.school} ${v.j.title}`;
const VAULT=['통장사본','신분증 사본'],RRN='주민등록번호';
// 확정된 업체에만: 업체가 따로 올린 서류가 없으면 강사가 '내 서류'에 저장한 파일을 자동으로 넘겨요
function docOf(a,n){if(a.docs[n])return a.docs[n];const v=(inst(a.instId).vault||{})[n];return a.status==='확정'&&VAULT.includes(n)&&v?v+' (자동)':''}
function profileText(p){const V=verified(p.id);return `■ 강사 프로필\n이름: ${p.name}\n연락처: ${p.phone}\n메일: ${p.email}\n지역: ${p.region}\n강의 분야: ${p.topics}\n\n${p.intro}\n\n${V.length?`[강사로 인증 강의 ${V.length}회] 업체 확정·강의·입금까지 끝난 강의\n${V.map(v=>'✓ '+vLine(v)).join('\n')}\n\n`:''}[강의 경력 (본인 작성)]\n${p.career}`}
function vMe(){const p=inst(meId());

    ${VAULT.map(n=>{const v=(p.vault||{})[n];return `<div class="row sm"><span class="sp">${esc(n)} ${v?`<span class="chip paid">✓ ${esc(v)}</span>`:'<span class="mu">없음</span>'}</span><label class="btn sm">${v?'바꾸기':'올리기'}<input type="file" accept="image/*,.pdf" data-act="vault" data-n="${n}" hidden></label>${v?`<button class="btn sm" data-act="vaultDel" data-n="${n}">지우기</button>`:''}</div>`}).join('')}
    <span class="mu sm">주민등록번호는 원천징수 신고 때문에 업체가 요청할 때만, 확정된 강의 화면에서 그 업체에 한 번 보내요. 강사로에는 남지 않아요.</span></div>

  <p class="mu sm">가입일 ${esc(p.joined)} · ${p.beta?'시범 운영 회원 (정식 운영 때 감사 혜택 대상)':''}</p>`}

function jobStats(j){const A=appsOf(j.id),cf=A.filter(a=>a.status==='확정');
  const miss=cf.reduce((n,a)=>n+j.needs.filter(x=>x!=='프로필'&&!docOf(a,x)).length,0);
  const unread=j.notices.reduce((n,nt)=>n+(nt.to||[]).filter(i=>!nt.reads[i]).length,0);
  return {ap:A.filter(a=>a.status==='지원').length,cf:cf.length,miss,unread,cx:cf.length?0:A.filter(a=>a.status==='취소'&&a.cxConfirmed).length}}
// 업체 달력: 강의 있는 날에 점, 날짜를 누르면 그날 강의만
function coCal(J){const [Y,M]=(ui.cmonth||todayIso().slice(0,7)).split('-').map(Number),first=new Date(Y,M-1,1).getDay(),days=new Date(Y,M,0).getDate(),t=todayIso();const cells=[];

  for(let n=1;n<=days;n++){const iso=isoOf(Y,M,n),js=J.filter(j=>j.dates.includes(iso)),warn=js.some(j=>{const s=jobStats(j);return s.miss||s.unread||!s.cf});
    cells.push(`<button class="day ${iso===ui.csel?'sel':''}" data-act="csel" data-d="${iso}" aria-label="${M}월 ${n}일 강의 ${js.length}개"><span class="n ${iso===t?'today':''}">${n}</span>${js.length?`<span class="bar ${warn?'done':'confirmed'}">${js.length}건</span>`:''}</button>`)}
  const SJ=ui.csel?J.filter(j=>j.dates.includes(ui.csel)):[];
  return `<div class="row"><h3 class="sp">${Y}년 ${M}월 강의 달력</h3><button class="btn sm" data-act="cmon" data-n="-1" aria-label="이전 달">‹</button><button class="btn sm" data-act="cmon" data-n="0">오늘</button><button class="btn sm" data-act="cmon" data-n="1" aria-label="다음 달">›</button></div>

function vCJobs(){if(ui.jobId&&job(ui.jobId))return vCJob(job(ui.jobId));const t=todayIso();

    ${cf?`<span class="mu sm">리마인드: ${remText(a)}</span><div class="row">${contactBtns(p,`[${co(j.coId).name}] ${p.name} 강사님, ${j.dates.map(d=>`${md(d)}(${dowOf(d)})`).join('·')} ${j.school} ${j.title} 강의 관련 연락드립니다.`)}</div>`:''}
    ${cf?`<div class="mu sm">받을 것: ${j.needs.map(n=>n==='프로필'?'프로필 ✓':n===RRN&&a.rrn?`${RRN} ✓ <button class="btn sm" data-act="rrnTake" data-a="${a.id}">복사하고 지우기</button>`:docOf(a,n)?`${esc(n)} ✓ <span class="sm">(${esc(docOf(a,n))})</span>`:`<b style="color:var(--r2)">${esc(n)} 빠짐</b>`).join(' · ')}</div>`:''}

  <span class="mu">${esc(j.교시)} · ${esc(j.대상)} · 1일 강사료 ${won(j.fee)} (강사에게 공개)</span>

function pickRole(r){S.me=r==='co'?'c:c1':'i:i1';ui.tab=NAV[meRole()][0][0];save();closeSheet();render();toast(r==='co'?'업체 화면으로 보고 있어요. 맨 위에서 언제든 바꿀 수 있어요':'강사 화면으로 보고 있어요. 맨 위에서 언제든 바꿀 수 있어요')}
const asQ=new URLSearchParams(location.search).get('as');
render();
if(asQ==='inst'||asQ==='co')pickRole(asQ);
else if(firstVisit)openSheet(`<h2>어느 쪽으로 써 볼까요?</h2><p class="mu">예시 강의가 들어 있는 체험판이에요. 가입 없이 눌러 볼 수 있고, 맨 위에서 언제든 바꿀 수 있어요.</p>
  <button class="btn pri" data-act="role" data-r="inst">강사로 써 보기</button><span class="mu sm">내 강의 달력, 공고 지원, 강사료·결산</span>
  <button class="btn nv" data-act="role" data-r="co">강의 업체로 써 보기</button><span class="mu sm">강의 운영판, 강사 확정, 공지·서류, 강사비 지급</span>`);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act=role]');if(b)pickRole(b.dataset.r)});
</script>
</body>
</html>
